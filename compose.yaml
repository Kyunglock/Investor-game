# 로컬 개발용 Postgres. 테스트(Testcontainers)와 같은 버전을 쓴다.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: investor
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
