# 로컬 개발용 Postgres. 테스트(Testcontainers)와 같은 이미지를 쓴다. 행동 프로필이 pgvector를 쓴다.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: investor
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
