/* Expansion choreography: camera and scenery move independently of the HUD. */
.gallery{display:block;max-width:470px}.variant-head small{display:block}.selector{display:none}
.camera{transform-origin:195px 550px;transform-box:view-box;transition:transform 1.1s cubic-bezier(.22,.7,.18,1)}
.zoomed .camera{transform:translate(30px,6px) scale(.84)}
.phone.expanded .our-office{animation:none;transform:none}

.phone .our-office{transform-origin:180px 560px}.phone .rival-office{transform-origin:35px 560px}
.colliding .our-office{animation:ram .7s both}.colliding .rival-office{animation:evict .8s .22s both}

.furnished .new-desk{opacity:1;transform:none}.furnished .new-desk.second{transition-delay:.2s}
.new-employee{opacity:0;transform:translate(65px,75px);transition:opacity .3s,transform .8s cubic-bezier(.2,.8,.3,1)}
.arrived-one .new-employee.first,.arrived-two .new-employee.second{opacity:1;transform:none}
.phone .confetti{opacity:0}.celebrating .confetti{opacity:1;animation:confetti-fall 1.2s both}

<header><div class="eyebrow">TOY CITY · EXPANSION STUDY 03</div><h1>다섯 번의 확장, 하나의 고양이 회사.</h1><p><b>5회 자동 재생</b>으로 작은 사무실이 22명의 회사가 되는 과정을 보세요.<br>하나씩 확장하거나, 중간에 멈췄다가 이어서 볼 수도 있어요.</p><div class="selector" role="group" aria-label="시안 선택"><button data-view="all" aria-pressed="true">나란히 비교</button><button data-view="sunny" aria-pressed="false">01 햇살 타이쿤</button><button data-view="night" aria-pressed="false">02 네온 증권가</button><button data-view="toy" aria-pressed="false">03 토이 시티</button></div></header>

<script>
const c={id:'toy',title:'토이 시티'};
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#${name}"/></svg>`;
const stages=[
 {name:'상가 3층',staff:4,price:21.3,scale:1,cx:195,add:'작은 사무실',rival:'치즈증권'},
 {name:'작은 빌딩',staff:6,price:34,scale:.84,cx:150,add:'리서치실 · 라운지',rival:'삼색캐피탈'},

article.innerHTML=`<div class="variant-head"><span>토이 시티 · 5단계 확장</span><small>FIVE CHAPTERS</small></div><div class="viewport"><section class="phone ${c.id}" aria-label="${c.title} 게임 시안">${renderScene()}<div class="top-progress"><i></i></div><div class="progress-text">다음 건물까지 63%</div><div class="top-tools"><button class="circle" data-action="settings" aria-label="설정">${icon('gear')}</button><button class="circle" data-action="sound" aria-label="사운드 시안 표시" aria-pressed="false">${icon('sound')}</button><button class="circle" data-action="rank" aria-label="순위">${icon('cup')}</button></div><div class="wallets"><div class="wallet"><i>₩</i><span class="money">21.3억</span></div><div class="wallet heart"><i>♥</i>멘탈 <span class="mental-value">84</span></div></div><div class="stage"><div class="chapter">CHAPTER 03 · GREEN STREET</div><h2>상가 3층</h2><small class="date">3년 차 2분기 · 자리 4 / 4</small></div><div class="rival-label"><small>다음 라이벌</small>34억</div><div class="rival-label right"><small>삼색캐피탈</small>210억</div><div class="side left"><button class="side-button" data-action="hire">${icon('hire')}채용<span class="badge">2</span></button><button class="side-button" data-action="chairs">${icon('chair')}배치</button><button class="side-button" data-action="news">${icon('news')}이슈<span class="badge">!</span></button><button class="side-button" data-action="records">${icon('book')}기록</button></div><div class="side right"><button class="side-button strong" data-action="growth">${icon('build')}건물 올리기<span class="mini">목표 34억</span></button><button class="side-button" data-action="mental">${icon('heart')}멘탈</button></div><div class="speech">작은 회사의, 아주 큰 야망</div><div class="impact">쾅!</div><div class="phase-label" role="status" aria-live="polite"></div><div class="seat-popup"></div><div class="bottom"><button class="ticker" data-action="news"><b>거리 소식</b>치즈증권, 신입 공채를 준비하고 있대요${icon('arrow')}</button><div class="bottom-cards"><div class="stat"><small>이번 분기 수익</small><strong class="gain" const q=s=>article.querySelector(s),all=s=>[...article.querySelectorAll(s)];
let autoRun=0;let level=0,staff=4,seats=4,busy=false,auto=false,timers=[],epoch=0,money=21.3,quarter=0,mental=84,lastFocus;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function later(ms,fn){const token=epoch;timers.push(setTimeout(()=>{if(token===epoch)fn()},reduced()?Math.min(ms,30):ms));}
function view(n){const s=stages[n];q('.camera').style.transform=`translate(${195-s.cx*s.scale}px,${560-550*s.scale}px) scale(${s.scale})`;}
function update(){const s=stages[level];q('.stage h2').textContent=s.name;q('.date').textContent=`${3+Math.floor(quarter/4)}년 차 ${quarter%4+1}분기 · 자리 ${staff} / ${seats}`;q('.money').textContent=money.toFixed(1)+'억';q('.mental-value').textContent=mental;q('.advance em').textContent=`직원 ${staff}명 일하는 중`;q('.top-progress i').style.width=(level/5*100)+'%';q('.progress-text').textContent=`회사 확장 ${level} / 5`;q('.mini').textContent=level===5?'최종 단계':`다음 ${stages[level+1].staff}자리`;q('.rival-label').innerHTML=`<small>${level===5?'완료':'다음 라이벌'}</small>${s.rival}`;q('.rival-label.right').innerHTML=`<small>회사 규모</small>${staff}명 / ${seats}자리`;q('.seat-popup').textContent=`고양이 ${staff}명 · 자리 ${seats}개`;all('[data-step]').forEach(el=>{const n=Number(el.dataset.step);el.classList.toggle('done',n<=level);el.classList.toggle('current',busy&&n===level+1)});all('[data-action]').forEach(b=>{const a=b.dataset.action;b.disabled=a==='reset'?false:a==='stop'?!auto:(busy||auto||(level===5&&['demo','growth'].includes(a)));});q('[data-action=auto]').disabled=busy||auto;q('[data-action=auto]').textContent=level===5?'처음부터 5회 재생':level?'남은 확장 자동 재생':'5회 자동 재생';}
function opponents(n){q('.opponents').innerHTML=n===5?'':opponent(stages[n].rival,n>=3?-170:-90,200+n*15)+opponent('다음 증권가',n>=3?480:315,260+n*15);}
function close(){q('.overlay').hidden=true;lastFocus?.focus()}
function modal(title,body){lastFocus=document.activeElement;q('.dialog h3').textContent=title;q('.body').innerHTML=body;q('.overlay').hidden=false;q('.dismiss').focus()}
function reset(){epoch++;timers.forEach(clearTimeout);timers=[];level=0;staff=4;seats=4;money=21.3;quarter=0;busy=false;auto=false;q('.phone').classList.remove('cinematic','celebrating');q('.company').classList.remove('company-hit');all('.module').forEach(el=>el.classList.toggle('built',el.dataset.level==='0'));all('.employee').forEach(el=>el.classList.toggle('arrived',Number(el.dataset.person)<4));all('.workdesk').forEach(el=>el.classList.toggle('placed',el.closest('.module').dataset.level==='0'));q('.roof').style.transform='none';q('.opponents').innerHTML=opponent('치즈증권',-7)+opponent('삼색캐피탈',310,260);q('.phase-label').textContent='준비 완료 · 다섯 번 확장해보세요';q('.speech').textContent='작은 회사의, 아주 큰 야망';close();view(0);update();}
function expand(){if(busy||level===5)return;busy=true;const next=level+1,s=stages[next],before=staff;q('.phone').classList.remove('celebrating');void q('.phone').offsetWidth;q('.phone').classList.add('cinematic');q('.company').classList.add('company-hit');q('.phase-label').textContent=`${next} / 5 · ${stages[level].rival} 밀어내기!`;update();
 later(230,()=>all('.opponent')[0]?.classList.add('evicted'));
 later(350,()=>{view(next);q('.phase-label').textContent=`${next} / 5 · ${s.add} 공간을 넓혀요`;});
 later(1000,()=>{all(`.module[data-level="${next}"]`).forEach(el=>el.classList.add('built'));q('.roof').style.transform=`translateY(${next===1?-34:-134}px)`;});
 later(1550,()=>{all(`.module[data-level="${next}"] .workdesk`).forEach(el=>el.classList.add('placed'));seats=s.staff;update();q('.phase-label').textContent=`새 책상 +${s.staff-before} · ${s.add}`;});
 for(let person=before;person<s.staff;person++){later(2100+(person-before)*230,()=>{q(`[data-person="${person}"]`).classList.add('arrived');staff=person+1;update();q('.phase-label').textContent=`${names[person]} 합류 · ${staff} / ${seats}명`;});}
 later(3600,()=>{level=next;busy=false;money=s.price;staff=seats=s.staff;q('.phone').classList.remove('cinematic');q('.company').classList.remove('company-hit');q('.phone').classList.add('celebrating');opponents(next);update();q('.phase-label').textContent=`${next} / 5 확장 완료! · 직원 ${before} → ${staff}명`;q('.speech').textContent=next===5?'고양이 22명이 함께하는 금융 캠퍼스!':`${s.add}까지 우리 회사예요!`;if(auto&&level<5){const run=autoRun;later(1100,()=>{if(auto&&run===autoRun)expand()});}else{auto=false;update();}});
}
article.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;const a=button.dataset.action;if(a==='reset')reset();if(a==='demo'||a==='growth')expand();if(a==='auto'){if(level===5)reset();autoRun++;auto=true;expand();}if(a==='stop'){autoRun++;auto=false;update();q('.phase-label').textContent=busy?'현재 확장까지만 마무리해요':'자동 재생을 멈췄어요';}if(a==='next'){quarter++;money+=1.8;update();}if(a==='chairs')modal('우리 회사의 고양이들',names.slice(0,staff).map((n,i)=>`<div class="person"><span>자리 ${i+1}</span><b>${n} · 근무 중</b></div>`).join(''));if(a==='hire')modal('채용 현황',`<p>직원 ${staff}명 · 자리 ${seats}개<br>이 시안에서는 확장 연출에 맞춰 새 동료가 합류합니다.</p>`);if(a==='records')modal('회사의 성장 기록',stages.slice(1,level+1).map((s,i)=>`<div class="person"><span>${i+1}차 · ${s.add}</span><b>${s.staff}명</b></div>`).join('')||'<p>첫 번째 확장을 기다리고 있어요.</p>');if(a==='news')modal('거리 소식',`<p>우리 회사는 ${stages[level].name}입니다.<br>${level===5?'다섯 번의 확장을 모두 마쳤어요.':`다음 목표는 ${stages[level+1].add}입니다.`}</p>`);if(a==='mental'){mental=Math.min(100,mental+8);update();modal('잠깐 쉬어가요',`<p>고양이들과 쉬면서 멘탈이 ${mental}이 되었어요.</p>`);}if(a==='rank')modal('거리의 증권사',`<p>우리 회사 · ${staff}명<br>확장 ${level} / 5<br>다음 라이벌 · ${stages[level].rival}</p>`);if(a==='settings'||a==='sound')modal('시안 안내','<p>5회 자동 재생은 약 23초입니다. 자동 재생 중지는 현재 확장을 마친 뒤 멈춥니다.<br>처음으로 버튼은 즉시 초기화합니다. 음원과 실제 게임 데이터는 연결하지 않았습니다.</p>');});
q('.dismiss').onclick=close;q('.overlay').onclick=e=>{if(e.target===q('.overlay'))close()};document.addEventListener('keydown',e=>{if(q('.overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();q('.dismiss').focus();}});
