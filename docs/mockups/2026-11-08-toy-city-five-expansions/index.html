/* Expansion choreography: camera and scenery move independently of the HUD. */
.gallery{display:block;max-width:470px}.variant-head small{display:block}.selector{display:none}
.camera{transform-origin:195px 550px;transform-box:view-box;transition:transform 1.1s cubic-bezier(.22,.7,.18,1)}
.zoomed .camera{transform:translate(30px,6px) scale(.84)}
.phone.expanded .our-office{animation:none;transform:none}
.phone.expanded .rival-office{animation:none;opacity:0;transform:translateX(-150px) rotate(-35deg)}
.phone .our-office{transform-origin:180px 560px}.phone .rival-office{transform-origin:35px 560px}
.colliding .our-office{animation:ram .7s both}.colliding .rival-office{animation:evict .8s .22s both}
@keyframes ram{0%{transform:none}25%{transform:translateX(12px) rotate(2deg)}48%{transform:translateX(-30px) rotate(-5deg)}70%{transform:translateX(5px) rotate(1deg)}100%{transform:none}}
@keyframes evict{0%{transform:none;opacity:1}35%{opacity:1}100%{transform:translateX(-160px) translateY(25px) rotate(-35deg);opacity:0}}
.new-floor{opacity:0;transform:translateY(80px);transition:opacity .4s,transform .85s cubic-bezier(.16,1,.3,1)}
.building .new-floor,.phone.expanded .new-floor{opacity:1;transform:none}
.old-sign{transition:opacity .2s}.building .old-sign,.phone.expanded .old-sign{opacity:0}
.new-desk{opacity:0;transform:translateY(-16px);transition:opacity .3s,transform .5s cubic-bezier(.2,1.7,.4,1)}
.furnished .new-desk{opacity:1;transform:none}.furnished .new-desk.second{transition-delay:.2s}
.new-employee{opacity:0;transform:translate(65px,75px);transition:opacity .3s,transform .8s cubic-bezier(.2,.8,.3,1)}
.arrived-one .new-employee.first,.arrived-two .new-employee.second{opacity:1;transform:none}
.phone .confetti{opacity:0}.celebrating .confetti{opacity:1;animation:confetti-fall 1.2s both}
@keyframes confetti-fall{0%{transform:translateY(-30px);opacity:0}20%{opacity:1}100%{transform:translateY(110px);opacity:0}}
.phone.expanded .impact{display:none}.cinematic .impact{display:block;animation:hit-label .85s both;top:286px;font-size:46px}
@keyframes hit-label{0%,15%{opacity:0;scale:.5}40%,70%{opacity:1;scale:1.1}100%{opacity:0;scale:1}}
.cinematic .side,.cinematic .rival-label,.cinematic .speech{opacity:.2;pointer-events:none;transition:opacity .3s}
.zoomed .rival-label:not(.right){opacity:0;pointer-events:none}.zoomed .rival-label.right{top:280px;right:27px}
.phase-label{position:absolute;top:237px;left:65px;right:65px;z-index:4;text-align:center;background:#fffdf4eF;color:#4c6085;border:1px solid #c5cdec;border-radius:18px;padding:8px 12px;box-shadow:0 3px 0 #8d9ac4;font-size:11px;font-weight:800;opacity:0;transition:opacity .2s}
.cinematic .phase-label,.phone.expanded .phase-label{opacity:1}
.seat-popup{opacity:0;position:absolute;top:282px;left:100px;right:100px;text-align:center;color:#4e7199;font-size:10px;font-weight:800;transition:opacity .3s}
.furnished .seat-popup{opacity:1}.arrived-two .seat-popup{color:#cb624e}
.phone button:disabled{opacity:.65}.demo-controls button:first-child{background:#fc795e;color:#fff;border-color:#fc795e;font-weight:800}.demo-controls{justify-content:center}
@media(prefers-reduced-motion:reduce){.camera,.new-floor,.new-employee,.new-desk{transition:none!important}}

/* The captured lot becomes a connected reception wing. */
.annex{opacity:0;transform:translateY(65px);transition:opacity .35s,transform .7s cubic-bezier(.16,1,.3,1)}
.claimed .annex{opacity:1;transform:none}
.annex-terrace{opacity:0;transform:translateY(8px);transition:opacity .4s .3s,transform .4s .3s}
.building .annex-terrace{opacity:1;transform:none}
.zoomed .rival-label.right{right:8px}

.gallery{max-width:470px}.steps{display:flex;justify-content:center;gap:8px;margin:15px 0}.steps span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e2e7ed;color:#8c99a8;font-size:11px;font-weight:800}.steps .done{background:#557ac0;color:white}.steps .current{background:#fc795e;color:white;box-shadow:0 0 0 4px #fc795e22}
.camera{transform-origin:0 0;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.module{opacity:0;transform:translateY(65px);transition:opacity .3s,transform .75s cubic-bezier(.2,1,.3,1)}.module.built{opacity:1;transform:none}
.employee{opacity:0;transform:translate(30px,35px);transition:opacity .25s,transform .6s cubic-bezier(.2,.9,.3,1)}.employee.arrived{opacity:1;transform:none}
.workdesk{opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .4s cubic-bezier(.2,1.5,.4,1)}.workdesk.placed{opacity:1;transform:none}
.opponent{transition:opacity .5s,transform .7s}.opponent.evicted{opacity:0;transform:translateX(-180px) rotate(-12deg)}
.company-hit{animation:company-hit .6s}@keyframes company-hit{30%{transform:translateX(12px)}55%{transform:translateX(-25px)}100%{transform:none}}
.phone .phase-label{opacity:1}.phone .seat-popup{opacity:1}.phone .impact{display:none}.phone.cinematic .impact{display:block;animation:hit-label .8s both}
.rival-label{top:290px!important;left:13px!important;right:auto!important;font-size:10px}.rival-label.right{left:auto!important;right:13px!important;top:290px!important}
.demo-controls{flex-wrap:wrap}.demo-controls button:disabled{opacity:.45}.demo-controls .autoplay{background:#557ac0;color:white;border-color:#557ac0}.description{text-align:center}.speech{left:100px;right:100px;font-size:9px}.journey{font-size:12px;text-align:center;color:var(--muted-foreground,#718071);line-height:1.8}.footer{max-width:700px;text-align:center}

/* Each plot is absorbed into a single, continuous building envelope. */
.station{transition:transform .85s cubic-bezier(.2,.8,.3,1),opacity .25s}
.employee{opacity:0;transform:translate(25px,25px)}.employee.arrived{opacity:1;transform:none}
.opponent.evicted{opacity:0;transform:translateX(var(--push)) rotate(10deg)}
.company-hit{animation:alternating-impact .65s both}
@keyframes alternating-impact{0%{transform:none}25%{transform:translateX(calc(var(--hit) * -.4))}48%{transform:translateX(var(--hit))}70%{transform:translateX(calc(var(--hit) * -.15))}100%{transform:none}}
.puff{animation:dust-puff 1s both}@keyframes dust-puff{0%{opacity:0}20%,60%{opacity:1}100%{opacity:0}}
.claimed-lot{transition:opacity .5s}.rival-label.target{background:#fff0d0;border-color:#eab773;box-shadow:0 3px 0 #d3a36b}
.phase-label{left:50px;right:50px}.rival-label{max-width:105px;font-size:9px}.phone[data-direction=right] .impact{left:220px;right:20px}.phone[data-direction=left] .impact{left:20px;right:220px}
.phone .seat-popup{display:none}</style></head><body>

<header><div class="eyebrow">TOY CITY · EXPANSION STUDY 03</div><h1>왼쪽, 오른쪽. 우리 사옥이 자랍니다.</h1><p><b>5회 자동 재생</b>으로 작은 사무실이 22명의 회사가 되는 과정을 보세요.<br>하나씩 확장하거나, 중간에 멈췄다가 이어서 볼 수도 있어요.</p><div class="selector" role="group" aria-label="시안 선택"><button data-view="all" aria-pressed="true">나란히 비교</button><button data-view="sunny" aria-pressed="false">01 햇살 타이쿤</button><button data-view="night" aria-pressed="false">02 네온 증권가</button><button data-view="toy" aria-pressed="false">03 토이 시티</button></div></header>

<script>
const c={id:'toy',title:'토이 시티'};
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#${name}"/></svg>`;
const stages=[
 {name:'상가 3층',staff:4,price:21.3,scale:1,cx:195,add:'작은 사무실',rival:'치즈증권'},
 {name:'작은 빌딩',staff:6,price:34,scale:.84,cx:150,add:'서쪽 부지 · 2층 사옥',rival:'삼색캐피탈'},
 {name:'투자 전문 사옥',staff:10,price:210,scale:.72,cx:150,add:'동쪽 부지 · 투자팀',rival:'턱시도자산'},
 {name:'중형 증권 사옥',staff:14,price:500,scale:.60,cx:230,add:'서쪽 부지 · 3층 사옥',rival:'페르시안금융'},
 {name:'그린 스트리트 본사',staff:18,price:1200,scale:.56,cx:230,add:'동쪽 부지 · 전략팀',rival:'골든캣홀딩스'},
 {name:'고양이 금융 본사',staff:22,price:3000,scale:.50,cx:195,add:'서쪽 부지 · 4층 본사',rival:'거리 정복 완료'}

 {x:35,w:310,rows:2,scale:.80},

function slots(n){const g=geometry[n],count=stages[n].staff,result=[],perRow=Math.ceil(count/g.rows);for(let i=0;i<count;i++){const row=Math.floor(i/perRow),column=i%perRow,total=Math.min(perRow,count-row*perRow);result.push({x:g.x+15+(g.w-30)/total*(column+.5)-18,y:560-64-row*86-56});}return result;}
function station(i){return `<g class="station" data-person="${i}" style="opacity:0"><g class="employee"><use href="#cat" width="35" height="41" style="--fur:${colors[i%colors.length]};--coat:${['#557ac0','#9b80b9','#6c9986'][i%3]}"/></g><g class="workdesk"><rect x="0" y="37" width="38" height="6" rx="2" fill="#ba956d"/><path d="M4 43v13m30-13v13" stroke="#a58364" stroke-width="3"/><rect x="16" y="24" width="22" height="15" rx="2" fill="#526780"/><rect x="19" y="27" width="16" height="9" rx="1" fill="#a8cbd0"/><path d="m21 33 3-3 4 1 4-3" stroke="#f9df98" fill="none" stroke-width="1.3"/></g></g>`;}
function opponent(name,x,height,side){const width=58;return `<g class="opponent" data-side="${side}" style="--push:${side==='left'?-150:150}px;transform-origin:${x+29}px 560px"><path d="M${x} ${560-height}l9-7h${width}v${height}l-9 7" fill="#8fa5c8"/><rect x="${x}" y="${560-height}" width="${width}" height="${height}" rx="5" fill="#b9c7e2"/><rect x="${x+4}" y="${568-height}" width="50" height="18" rx="3" fill="#829bc4"/><text x="${x+29}" y="${580-height}" text-anchor="middle" font-size="6.5" fill="#fff" font-weight="700">${name}</text>${Array.from({length:Math.floor((height-44)/28)},(_,r)=>[0,1].map(c=>`<rect x="${x+8+c*25}" y="${595-height+r*28}" width="17" height="18" rx="3" fill="${(r+c)%3?'#97b5c9':'#ffdc8f'}"/>`).join('')).join('')}<rect x="${x+19}" y="537" width="22" height="23" fill="#829bc4"/></g>`;}
function renderScene(){return `<svg class="scene" viewBox="0 0 390 814" role="img" aria-label="좌우 라이벌 부지를 번갈아 차지하며 하나의 사옥으로 성장하는 회사"><defs><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#fff7e5"/><stop offset="1" stop-color="#f0ddba"/></linearGradient></defs><rect width="390" height="814" fill="#b9ddf2"/><circle cx="75" cy="250" r="32" fill="#fff0b9"/><g fill="#fff" opacity=".5"><rect x="28" y="233" width="95" height="12" rx="6"/><rect x="51" y="220" width="40" height="19" rx="10"/></g><g class="camera"><g fill="#9ec7dc">${Array.from({length:17},(_,i)=>`<rect x="${-500+i*75}" y="${260+(i*47)%130}" width="50" height="330" rx="4"/>`).join('')}</g><path d="M-700 555h1800v500H-700" fill="#b9d8c6"/><path d="M-700 609h1800v446H-700" fill="#a0c7b8"/><path d="M-700 620h1800" stroke="#c8dfd0" stroke-width="5"/><g class="opponents"></g><rect class="claimed-lot" y="550" height="22" rx="5" fill="#f8d98b" opacity="0"/><g class="company"><g class="envelope"></g><g class="stations">${Array.from({length:22},(_,i)=>station(i)).join('')}</g><g class="roof"></g></g><g class="dust" opacity="0"><ellipse cx="0" cy="556" rx="27" ry="12" fill="#ffedc9"/><ellipse cx="-20" cy="552" rx="18" ry="13" fill="#f4ddb5"/><ellipse cx="20" cy="548" rx="19" ry="16" fill="#fff1d5"/></g><use href="#cat" x="169" y="610" width="45" height="50"/><g class="confetti">${Array.from({length:25},(_,i)=>`<rect x="${30+i*16}" y="${230+(i*37)%100}" width="7" height="13" rx="2" fill="${['#fc795e','#557ac0','#f2bc61'][i%3]}"/>`).join('')}</g></g></svg>`;}
let frame=0;
function drawEnvelope(g){const {x,w,h}=g,top=560-h,cx=x+w/2;let floors='';const visibleRows=Math.max(1,Math.floor((h-104)/86+.02));for(let row=0;row<visibleRows;row++){const y=560-64-row*86-64;floors+=`<rect x="${x+10}" y="${y}" width="${w-20}" height="73" rx="3" fill="#ffdfb0"/><path d="M${x+8} ${y+75}h${w-16}" stroke="#cdb28b" stroke-width="5"/>`;}
 q('.envelope').innerHTML=`<ellipse cx="${cx}" cy="569" rx="${w/2+12}" ry="11" fill="#34486122"/><path d="M${x} ${top}l13-10h${w}v${h}l-13 10" fill="#d4b38a"/><rect x="${x}" y="${top}" width="${w}" height="${h}" rx="7" fill="url(#wall)"/><rect x="${x+12}" y="${top+24}" width="${w-24}" height="25" rx="4" fill="#a9c9d3"/>${[1,2,3].map(i=>`<path d="M${x+w*i/4} ${top+24}v25" stroke="#fff4db" stroke-width="4"/>`).join('')}${floors}<path d="M${x+4} ${top+10}v${h-15}m${w-8}-${h-15}v${h-15}" stroke="#f9eacc" stroke-width="7"/><rect x="${cx-21}" y="529" width="42" height="32" rx="4" fill="#8eb4ca"/><path d="M${cx} 530v31" stroke="#fff4db" stroke-width="3"/><rect x="${cx-24}" y="516" width="48" height="9" rx="3" fill="#557ac0"/><text x="${cx}" y="523" font-size="5.5" text-anchor="middle" fill="#fff">CAT SECURITIES</text><path d="M${x-5} 565h${w+10}" stroke="#bd9f7d" stroke-width="5" stroke-linecap="round"/>`;
 q('.roof').innerHTML=`<path d="M${x-5} ${top}l13-10h${w+7}l-13 10" fill="#7797ce"/><rect x="${x-5}" y="${top}" width="${w+11}" height="11" rx="3" fill="#557ac0"/><rect x="${cx-60}" y="${top-31}" width="120" height="25" rx="6" fill="#557ac0"/><text x="${cx}" y="${top-14}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff9df">흔들리지 않는 고양이</text><path d="M${cx-44} ${top-6}v6m88-6v6" stroke="#bd9f7d" stroke-width="3"/>`;
}
function morph(a,b){cancelAnimationFrame(frame);if(reduced()){drawEnvelope(b);return;}const token=epoch,start=performance.now();function tick(now){if(token!==epoch)return;const t=Math.min(1,(now-start)/850),ease=1-Math.pow(1-t,3);drawEnvelope({x:a.x+(b.x-a.x)*ease,w:a.w+(b.w-a.w)*ease,h:a.h+(b.h-a.h)*ease});if(t<1)frame=requestAnimationFrame(tick);}frame=requestAnimationFrame(tick);}
function placeStaff(n,before){slots(n).forEach((p,i)=>{const node=q(`.station[data-person="${i}"]`);node.style.transform=`translate(${p.x}px,${p.y}px)`;if(i<before){node.style.opacity='1';node.querySelector('.employee').classList.add('arrived');node.querySelector('.workdesk').classList.add('placed');}});}
function view(n,pan=0){const g=geometry[n];q('.camera').style.transform=`translate(${195-(g.x+g.w/2)*g.scale+pan}px,${560-550*g.scale}px) scale(${g.scale})`;}
function opponentIndex(n,side){return side==='left'?2*Math.ceil(n/2):1+2*Math.floor(n/2);}
function opponents(n){const g=geometry[n];q('.opponents').innerHTML=opponent(rivals[opponentIndex(n,'left')]||'다음 증권가',g.x-66,Math.min(350,g.h+25),'left')+opponent(rivals[opponentIndex(n,'right')]||'다음 증권가',g.x+g.w+8,Math.min(380,g.h+50),'right');}
function reset(){epoch++;autoRun++;timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(frame);level=0;staff=4;seats=4;money=21.3;quarter=0;busy=false;auto=false;q('.phone').classList.remove('cinematic','celebrating');q('.company').classList.remove('company-hit');q('.dust').classList.remove('puff');q('.claimed-lot').setAttribute('opacity','0');all('.station').forEach(node=>{node.style.opacity='0';node.querySelector('.employee').classList.remove('arrived');node.querySelector('.workdesk').classList.remove('placed');});drawEnvelope(geometry[0]);placeStaff(0,4);opponents(0);q('.phase-label').textContent='왼쪽부터 · 좌우로 번갈아 확장해요';q('.speech').textContent='하나의 사옥으로 차곡차곡 성장';close();view(0);update();}
function expand(){if(busy||level===5)return;busy=true;const next=level+1,s=stages[next],before=staff,side=direction(next),sign=side==='left'?-1:1,old=geometry[level],target=geometry[next];q('.phone').dataset.direction=side;q('.phone').classList.remove('celebrating');q('.company').classList.remove('company-hit');void q('.phone').offsetWidth;q('.phone').classList.add('cinematic');q('.company').style.setProperty('--hit',sign*22+'px');q('.company').classList.add('company-hit');q('.phase-label').textContent=`${next} / 5 · ${sideName(side)} ${stages[level].rival} 밀어내기!`;view(level,-sign*12);update();
 later(260,()=>{q(`.opponent[data-side="${side}"]`).classList.add('evicted');const dust=q('.dust');dust.setAttribute('transform',`translate(${side==='left'?old.x:old.x+old.w},0)`);dust.classList.add('puff');});
 later(420,()=>{view(next);q('.phase-label').textContent=`${sideName(side)} 부지 확보 · 건물의 기초를 넓혀요`;const lot=q('.claimed-lot');lot.setAttribute('x',side==='left'?target.x:old.x+old.w);lot.setAttribute('width','70');lot.setAttribute('opacity','1');});
 later(950,()=>{morph(old,target);placeStaff(next,before);q('.phase-label').textContent='외벽과 층을 연결하고, 지붕을 다시 얹어요';});
 later(1850,()=>{seats=s.staff;for(let i=before;i<s.staff;i++){const node=q(`.station[data-person="${i}"]`);node.style.opacity='1';node.querySelector('.workdesk').classList.add('placed');}q('.phase-label').textContent=`새 책상 +${s.staff-before} · 고양이들을 맞이해요`;update();});
 for(let person=before;person<s.staff;person++)later(2300+(person-before)*230,()=>{q(`.station[data-person="${person}"] .employee`).classList.add('arrived');staff=person+1;update();q('.phase-label').textContent=`${names[person]} 합류 · ${staff} / ${seats}명`;});
 later(3900,()=>{level=next;busy=false;money=s.price;staff=seats=s.staff;q('.phone').classList.remove('cinematic');q('.company').classList.remove('company-hit');q('.dust').classList.remove('puff');q('.claimed-lot').setAttribute('opacity','0');q('.phone').classList.add('celebrating');opponents(next);update();q('.phase-label').textContent=`${next} / 5 · ${sideName(side)} 확장 완료! ${before} → ${staff}명`;q('.speech').textContent=next===5?'고양이 22명의 하나 된 사옥!':`다음은 ${sideName(direction(next+1))} 라이벌 차례!`;if(auto&&level<5){const run=autoRun;later(1100,()=>{if(auto&&run===autoRun)expand()});}else{auto=false;update();}});
}

let autoRun=0;let level=0,staff=4,seats=4,busy=false,auto=false,timers=[],epoch=0,money=21.3,quarter=0,mental=84,lastFocus;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function later(ms,fn){const token=epoch;timers.push(setTimeout(()=>{if(token===epoch)fn()},reduced()?Math.min(ms,30):ms));}
function update(){const s=stages[level];q('.stage h2').textContent=s.name;q('.date').textContent=`${3+Math.floor(quarter/4)}년 차 ${quarter%4+1}분기 · 자리 ${staff} / ${seats}`;q('.money').textContent=money.toFixed(1)+'억';q('.mental-value').textContent=mental;q('.advance em').textContent=`직원 ${staff}명 일하는 중`;q('.top-progress i').style.width=(level/5*100)+'%';q('.progress-text').textContent=`회사 확장 ${level} / 5`;q('.mini').textContent=level===5?'최종 단계':`다음 ${stages[level+1].staff}자리`;['left','right'].forEach(side=>{const label=q(side==='left'?'.rival-label':'.rival-label.right');const target=level<5&&direction(level+1)===side;label.innerHTML=`<small>${target?'다음 충돌 '+(side==='left'?'←':'→'):sideName(side)+' 라이벌'}</small>${rivals[opponentIndex(level,side)]||'다음 증권가'}`;label.classList.toggle('target',target);});q('.seat-popup').textContent=`고양이 ${staff}명 · 자리 ${seats}개`;all('[data-step]').forEach(el=>{const n=Number(el.dataset.step);el.classList.toggle('done',n<=level);el.classList.toggle('current',busy&&n===level+1)});all('[data-action]').forEach(b=>{const a=b.dataset.action;b.disabled=a==='reset'?false:a==='stop'?!auto:(busy||auto||(level===5&&['demo','growth'].includes(a)));});q('[data-action=auto]').disabled=busy||auto;q('[data-action=auto]').textContent=level===5?'처음부터 5회 재생':level?'남은 확장 자동 재생':'5회 자동 재생';}
function close(){q('.overlay').hidden=true;lastFocus?.focus()}
function modal(title,body){lastFocus=document.activeElement;q('.dialog h3').textContent=title;q('.body').innerHTML=body;q('.overlay').hidden=false;q('.dismiss').focus()}
article.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;const a=button.dataset.action;if(a==='reset')reset();if(a==='demo'||a==='growth')expand();if(a==='auto'){if(level===5)reset();autoRun++;auto=true;expand();}if(a==='stop'){autoRun++;auto=false;update();q('.phase-label').textContent=busy?'현재 확장까지만 마무리해요':'자동 재생을 멈췄어요';}if(a==='next'){quarter++;money+=1.8;update();}if(a==='chairs')modal('우리 회사의 고양이들',names.slice(0,staff).map((n,i)=>`<div class="person"><span>자리 ${i+1}</span><b>${n} · 근무 중</b></div>`).join(''));if(a==='hire')modal('채용 현황',`<p>직원 ${staff}명 · 자리 ${seats}개<br>이 시안에서는 확장 연출에 맞춰 새 동료가 합류합니다.</p>`);if(a==='records')modal('회사의 성장 기록',stages.slice(1,level+1).map((s,i)=>`<div class="person"><span>${i+1}차 · ${s.add}</span><b>${s.staff}명</b></div>`).join('')||'<p>첫 번째 확장을 기다리고 있어요.</p>');if(a==='news')modal('거리 소식',`<p>우리 회사는 ${stages[level].name}입니다.<br>${level===5?'다섯 번의 확장을 모두 마쳤어요.':`다음 목표는 ${stages[level+1].add}입니다.`}</p>`);if(a==='mental'){mental=Math.min(100,mental+8);update();modal('잠깐 쉬어가요',`<p>고양이들과 쉬면서 멘탈이 ${mental}이 되었어요.</p>`);}if(a==='rank')modal('거리의 증권사',`<p>우리 회사 · ${staff}명<br>확장 ${level} / 5<br>다음 라이벌 · ${stages[level].rival}</p>`);if(a==='settings'||a==='sound')modal('시안 안내','<p>5회 자동 재생은 약 25초입니다. 자동 재생 중지는 현재 확장을 마친 뒤 멈춥니다.<br>처음으로 버튼은 즉시 초기화합니다. 음원과 실제 게임 데이터는 연결하지 않았습니다.</p>');});
q('.dismiss').onclick=close;q('.overlay').onclick=e=>{if(e.target===q('.overlay'))close()};document.addEventListener('keydown',e=>{if(q('.overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();q('.dismiss').focus();}});
function fit(){const w=q('.viewport'),scale=w.clientWidth/400;w.style.height=824*scale+'px';q('.phone').style.transform=`scale(${scale})`;}
new ResizeObserver(fit).observe(q('.viewport'));addEventListener('resize',fit);reset();fit();

</script></body></html>
