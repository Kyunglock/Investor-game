/* Expansion choreography: camera and scenery move independently of the HUD. */
.gallery{display:block;max-width:470px}.variant-head small{display:block}.selector{display:none}
.camera{transform-origin:195px 550px;transform-box:view-box;transition:transform 1.1s cubic-bezier(.22,.7,.18,1)}
.zoomed .camera{transform:translateY(6px) scale(.84)}
.phone.expanded .our-office{animation:none;transform:none}

.phone .our-office{transform-origin:180px 560px}.phone .rival-office{transform-origin:35px 560px}
.colliding .our-office{animation:ram .7s both}.colliding .rival-office{animation:evict .8s .22s both}

.building .new-floor,.phone.expanded .new-floor{opacity:1;transform:none}

.furnished .new-desk{opacity:1;transform:none}.furnished .new-desk.second{transition-delay:.2s}

<header><div class="eyebrow">TOY CITY · EXPANSION STUDY 03</div><h1>밀어내고, 한 층 더 성장해요.</h1><p>라이벌 밀어내기 → 카메라 줌아웃 → 사무실 증축 → 책상 배치 → 고양이 합류.<br><b>확장 연출 보기</b>를 눌러 4명에서 6명으로 커지는 회사를 확인해보세요.</p><div class="selector" role="group" aria-label="시안 선택"><button data-view="all" aria-pressed="true">나란히 비교</button><button data-view="sunny" aria-pressed="false">01 햇살 타이쿤</button><button data-view="night" aria-pressed="false">02 네온 증권가</button><button data-view="toy" aria-pressed="false">03 토이 시티</button></div></header>
<main class="gallery" id="gallery"></main><p class="footer">인터랙티브 시안 · 수치와 이벤트는 디자인 체험용입니다. 실제 게임에는 아직 적용하지 않았습니다.</p>
<script>
const configs=[{id:'sunny',title:'햇살 타이쿤',en:'SUNNY TYCOON',sub:'햇살 아래, 차곡차곡 성장 중',desc:'<b>추천 · 편안한 캐주얼 경영 게임.</b> 크림색 패널, 꿀빛 버튼, 따뜻한 나무와 초록 지붕. 이전 시안의 차분함에 게임의 손맛을 더했어요.',sky:'#cae6db',ground:'#c6d5a3',road:'#aec18f',back:'#afd0be',main:'#fae9c4',side:'#c4a778',roof:'#54866c',room:'#fff2ce',rival:'#d2d8bd',rivalSide:'#b1bc9b',glass:'#a5cbb8',lit:'#f7dd9b',ink:'#53765e'},
{id:'night',title:'네온 증권가',en:'AFTER HOURS',sub:'도시는 잠들어도, 수익은 자란다',desc:'<b>성장과 경쟁에 집중하는 야간 분위기.</b> 짙은 남색 도시, 라임색 보상, 라벤더 조명. 회사의 불빛과 확장 순간을 강조했어요.',sky:'#1b253d',ground:'#313b56',road:'#252e48',back:'#28374f',main:'#60627f',side:'#3e4463',roof:'#b8df7a',room:'#b8b4cb',rival:'#414b69',rivalSide:'#303a55',glass:'#56727d',lit:'#e7c899',ink:'#c4d8da'},

 606h990v449H-300" fill="${c.road}"/><path d="M-300 619h990" stroke="${c.ground}" stroke-width="5"/><g class="rival-office"><path d="m-20 382 95-8 16 11v174l-111 8" fill="${c.rivalSide}"/><rect x="-20" y="385" width="95" height="176" rx="${c.id==='toy'?13:3}" fill="${c.rival}"/><rect x="-14" y="393" width="83" height="18" rx="4" fill="${c.roof}"/><text x="28" y="406" text-anchor="middle" fill="#fff9df" font-size="9" font-weight="800">치즈증권</text>${left}<rect x="16" y="540" width="26" height="22" rx="3" fill="${c.glass}"/></g><path d="m285 300 91-7 22 14v251l-113 5" fill="${c.rivalSide}"/><rect x="285" y="305" width="91" height="256" rx="${c.id==='toy'?15:3}" fill="${c.rival}"/><rect x="302" y="289" width="54" height="16" rx="4" fill="${c.rivalSide}"/><rect x="292" y="313" width="77" height="18" rx="4" fill="${c.roof}"/><text x="330" y="326" fill="#fff9df" text-anchor="middle" font-size="8" font-weight="800">삼색캐피탈</text>${windows}<rect x="316" y="537" width="26" height="24" rx="3" fill="${c.glass}"/><ellipse cx="187" cy="570" rx="105" ry="13" fill="#1c314b20"/><g class="our-office"><path d="m94 372 169-10 15 15v183l-184 9" fill="${c.side}"/><rect x="94" y="377" width="169" height="185" rx="${c.id==='toy'?15:4}" fill="${c.main}"/><path d="m89 374 15-12h165v12" fill="${c.roof}"/><rect x="89" y="374" width="180" height="12" rx="3" fill="${c.roof}"/><g class="old-sign"><rect x="122" y="343" width="112" height="27" rx="7" fill="${c.roof}"/><text x="178" y="361" text-anchor="middle" fill="#fff9df" font-size="11" font-weight="800">흔들리지 않는 고양이</text><path d="M135 370v5m88-5v5" stroke="${c.side}" stroke-width="4"/></g><rect x="104" y="398" width="149" height="48" rx="5" fill="${c.glass}"/><path d="M153 398v48m49-48v48" stroke="${c.main}" stroke-width="5"/><path d="M106 443h146" stroke="${c.side}" stroke-width="3"/><rect x="100" y="456" width="157" height="75" rx="3" fill="${c.room}"/><path d="M100 456h157v9H100" fill="${c.side}" opacity=".6"/>${cats}<path d="M99 532h159" stroke="${c.side}" stroke-width="7"/><rect x="166" y="540" width="30" height="23" rx="3" fill="${c.roof}"/><path d="M181 540v23" stroke="${c.main}" stroke-width="2"/><rect x="111" y="542" width="36" height="14" rx="2" fill="${c.glass}"/><rect x="216" y="542" width="32" height="14" rx="2" fill="${c.glass}"/><path d="M90 565h178" stroke="${c.side}" stroke-width="5"/><g class="new-floor">

function create(c){const article=document.createElement('article');article.className='variant '+(c.id==='toy'?'selected':'');article.dataset.id=c.id;article.innerHTML=`<div class="variant-head"><span>0${configs.indexOf(c)+1} ${c.title}</span><small>${c.en}</small></div><div class="viewport"><section class="phone ${c.id}" aria-label="${c.title} 게임 시안">${scene(c)}<div class="top-progress"><i></i></div><div class="progress-text">다음 건물까지 63%</div><div class="top-tools"><button class="circle" data-action="settings" aria-label="설정">${icon('gear')}</button><button class="circle" data-action="sound" aria-label="사운드 시안 표시" aria-pressed="false">${icon('sound')}</button><button class="circle" data-action="rank" aria-label="순위">${icon('cup')}</button></div><div class="wallets"><div class="wallet"><i>₩</i><span class="money">21.3억</span></div><div class="wallet heart"><i>♥</i>멘탈 <span class="mental-value">84</span></div></div><div class="stage"><div class="chapter">CHAPTER 03 · GREEN STREET</div><h2>상가 3층</h2><small class="date">3년 차 2분기 · 자리 4 / 4</small></div><div class="rival-label"><small>다음 라이벌</small>34억</div><div class="rival-label right"><small>삼색캐피탈</small>210억</div><div class="side left"><button class="side-button" data-action="hire">${icon('hire')}채용<span class="badge">2</span></button><button class="side-button" data-action="chairs">${icon('chair')}배치</button><button class="side-button" data-action="news">${icon('news')}이슈<span class="badge">!</span></button><button class="side-button" data-action="records">${icon('book')}기록</button></div><div class="side right"><button class="side-button strong" data-action="growth">${icon('build')}건물 올리기<span class="mini">목표 34억</span></button><button class="side-button" data-action="mental">${icon('heart')}멘탈</button></div><div class="speech">${c.sub}</div><div class="impact">쾅!</div><div class="phase-label" role="status" aria-live="polite"></div><div class="seat-popup"></div><div class="bottom"><button class="ticker" data-action="news"><b>거리 소식</b>치즈증권, 신입 공채를 준비하고 있대요${icon('arrow')}</button><div class="bottom-cards"><div class="stat"><small>이번 분기 수익</small><strong class="gain">+1.8억</strong><em>차곡차곡 성장 중</em></div><button class="stat advance" data-action="next"><small>다음 분기로</small><strong>▶ 넘기기</strong><em>직원 4명 일하는 중</em></button><div class="stat"><small>팀 분위기</small><strong>좋음</strong><em>사기 72</em></div></div></div><div class="gesture"></div><div class="notice" role="status" hidden></div><div class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="title-${c.id}"><h3 id="title-${c.id}"></h3><div class="body"></div><button class="dismiss">닫기</button></section></div></section></div><p class="description">${c.desc}</p><div class="demo-controls"><button data-action="demo">확장 연출 보기</button><button data-action="reset">처음으로</button></div>`;document.querySelector('#gallery').append(article);const q=s=>article.querySelector(s);let money=21.3,turn=0,expanded=false,mental=84,history=[],lastFocus,timer;let busy=false,staff=4,seats=4,jobs=[],generation=0;function refresh(){q('.money').textContent=money.toFixed(1)+'억';q('.mental-value').textContent=mental;const goal=expanded?210:34,percent=Math.min(100,Math.floor(money/goal*100));q('.top-progress i').style.width=percent+'%';q('.progress-text').textContent='다음 건물까지 '+percent+'%';q('.date').textContent=`${3+Math.floor((turn+1)/4)}년 차 ${(turn+1)%4+1}분기 · 자리 ${staff} / ${seats}`;q('.stage h2').textContent=expanded?'작은 빌딩':'상가 3층';q('.mini').textContent=expanded?'확장 완료':money>=34?'확장 가능!':'목표 34억';q('.phone').classList.toggle('expanded',expanded);q('.advance em').textContent=`직원 ${staff}명 일하는 중`}function notify(s){clearTimeout(timer);q('.notice').textContent=s;q('.notice').hidden=false;timer=setTimeout(()=>q('.notice').hidden=true,2400)}function close(){q('.overlay').hidden=true;lastFocus?.focus()}function modal(title,body){lastFocus=document.activeElement;q('.dialog h3').textContent=title;q('.body').innerHTML=body;q('.overlay').hidden=false;q('.dismiss').focus()}
function stopSequence(){generation++;jobs.forEach(clearTimeout);jobs=[];busy=false;q('.phone').classList.remove('colliding','zoomed','building','furnished','arrived-one','arrived-two','celebrating','cinematic');article.querySelectorAll('button[data-action]').forEach(b=>b.disabled=false)}
function expand(){
 if(busy)return;stopSequence();expanded=false;staff=4;seats=4;refresh();void q('.phone').offsetWidth;
 close();clearTimeout(timer);q('.notice').hidden=true;busy=true;money=Math.max(34,money);refresh();
 article.querySelectorAll('button[data-action]').forEach(b=>b.disabled=b.dataset.action!=='reset');
 const phone=q('.phone');phone.classList.add('cinematic','colliding');q('.impact').textContent='쾅!';
 const phase=text=>q('.phase-label').textContent=text;phase('01 · 치즈증권을 넘어서는 순간!');
 const token=generation;const schedule=(ms,fn)=>jobs.push(setTimeout(()=>{if(token===generation)fn()},ms));
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const at=(ms,fn)=>schedule(reduced?0:ms,fn);
 at(350,()=>{phone.classList.add('zoomed');phase('02 · 더 넓어진 풍경, 더 큰 우리 회사');});
 at(1150,()=>{phone.classList.add('building');phase('03 · 새로운 사무실이 올라가요');});
 at(1850,()=>{phone.classList.add('furnished');seats=6;refresh();q('.seat-popup').textContent='새 책상 +2 · 자리 4 / 6';phase('04 · 새 동료를 위한 책상 두 개');});
 at(2550,()=>{phone.classList.add('arrived-one');phase('05 · 라떼가 새 자리로 들어와요');});
 at(3250,()=>{staff=5;refresh();q('.seat-popup').textContent='라떼 합류! · 자리 5 / 6';phone.classList.add('arrived-two');phase('06 · 후추도 함께 일하기 시작해요');});
 at(4100,()=>{staff=6;expanded=true;busy=false;refresh();phone.classList.remove('cinematic','colliding');phone.classList.add('celebrating');q('.seat-popup').textContent='고양이 6명 · 모두 근무 중';phase('확장 완료! 직원 4 → 6 · 자리 4 → 6');q('.speech').textContent='우리 회사가 한 층 더 자랐어요!';article.querySelectorAll('button[data-action]').forEach(b=>b.disabled=false);});
}

article.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='next'){money=Math.round((money+1.8)*10)/10;history.push(q('.date').textContent.split(' · ')[0]);turn++;refresh();notify('분기 결산 +1.8억'+(money>=34&&!expanded?' · 건물 확장 가능!':''))}if(a==='demo')expand();if(a==='reset'){stopSequence();staff=4;seats=4;money=21.3;turn=0;expanded=false;mental=84;history=[];refresh();q('.speech').textContent=c.sub;close();q('.notice').hidden=true}if(a==='growth'){modal(expanded?'확장 완료!':'라이벌을 넘어설 시간',`<p>${expanded?'새 사무실과 책상이 생기고 라떼·후추가 합류했어요. 직원 6명이 모두 일하고 있어요.':`자산 34억이 되면 치즈증권을 밀어내고 회사를 넓힐 수 있어요.<br>현재 자산 <b>${money.toFixed(1)}억</b> · 자리 4 → 6`}</p>${!expanded?`<button class="do-expand" ${money<34?'disabled':''}>${money<34?'아직 '+(34-money).toFixed(1)+'억이 더 필요해요':'건물 올리기!'}</button>`:''}`);q('.do-expand')?.addEventListener('click',expand)}if(a==='hire')modal('새로운 동료를 찾아요',`<p>${expanded?'라떼와 후추가 합류해 여섯 자리가 모두 찼어요.':'지금은 자리가 꽉 찼어요. 회사 확장 후 채용할 수 있어요.'}</p><div class="person"><b>라떼 · A</b><span>차분한 분석가</span></div><div class="person"><b>후추 · B</b><span>용감한 투자자</span></div><p>이번 시안에서는 후보 조회까지 체험할 수 있어요.</p>`);if(a==='chairs')modal('우리 회사 자리 배치','<p>각자의 자리에서 고양이들이 일하고 있어요.</p>'+['모카 · A · 분석','구름 · A · 장기 투자','치즈 · B · 기회 포착','호두 · B · 위험 관리',...(expanded?['라떼 · A · 분석','후추 · B · 기회 포착']:[])].map((p,i)=>`<div class="person"><span>자리 ${i+1}</span><b>${p}</b></div>`).join(''));if(a==='news')modal('그린 스트리트 소식','<p><b>치즈증권, 신입 공채 준비</b><br>새 직원이 합류하면 라이벌의 성장 속도가 빨라질 수 있어요.</p><p><b>우리 팀은 열심히 일하는 중</b><br>모든 자리에 고양이가 배치되어 있어요. 다음 분기로 넘어가 성과를 확인해보세요.</p>');if(a==='records')modal('우리 회사의 발자취',history.length?history.map(h=>`<div class="person"><span>${h}</span><b>+1.8억</b></div>`).join(''):'<p>다음 분기를 진행하면 성장 기록이 쌓여요.</p>');if(a==='mental'){modal('마음을 단단하게',`<p>현재 멘탈 <b>${mental}</b><br>고양이들과 잠깐 쉬면서 마음을 회복해요.</p><button class="rest" ${mental===100?'disabled':''}>쉬는 시간 · 멘탈 +8</button>`);q('.rest').onclick=()=>{mental=Math.min(100,mental+8);refresh();close();notify('마음이 한결 편안해졌어요 · 멘탈 '+mental)}}if(a==='settings')modal('시안 안내','<p>채용·배치·이슈·기록은 원래 위치에 있어요. 분기를 넘겨 자산을 모은 다음 오른쪽에서 건물을 올려보세요.</p><p>실제 게임 데이터와 사운드는 연결하지 않은 디자인 시안입니다.</p>');if(a==='rank')modal('거리의 증권사들',`<div class="person"><b>삼색캐피탈</b><span>210억</span></div><div class="person"><b>치즈증권</b><span>34억</span></div><div class="person"><b>우리 회사</b><span>${money.toFixed(1)}억</span></div>`);if(a==='sound'){const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));notify('사운드 '+(!on?'켜짐':'꺼짐')+' 표시 · 시안에는 음원이 없어요')}});q('.dismiss').onclick=close;q('.overlay').onclick=e=>{if(e.target===q('.overlay'))close()};article.addEventListener('keydown',e=>{if(q('.overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const items=[...q('.dialog').querySelectorAll('button:not(:disabled)')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});}
configs.filter(c=>c.id==='toy').forEach(create);function fit(){document.querySelectorAll('.viewport').forEach(w=>{if(!w.clientWidth)return;const s=w.clientWidth/400;w.style.height=(824*s)+'px';w.querySelector('.phone').style.transform=`scale(${s})`})}let selection='all';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{selection=b.dataset.view;document.querySelector('#gallery').classList.toggle('single',selection!=='all');document.querySelectorAll('.variant').forEach(v=>v.classList.toggle('selected',v.dataset.id===(selection==='all'?'sunny':selection)));document.querySelectorAll('[data-view]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn===b)));fit()});addEventListener('resize',fit);new ResizeObserver(fit).observe(document.querySelector('#gallery'));fit();
</script></body></html>
