# 병합 조건의 자동 검사 (code-style.md 9절): 테스트, 스타일, 도메인 경계, 마이그레이션 규칙, 계약 동기화.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: 서버 (테스트·스타일·경계 검사)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck test

  web:
    name: 웹 (린트·타입·단위 테스트·빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: 계약과 생성된 타입이 같은지 확인
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm check
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: pnpm build

  app:
    name: 앱 (린트·타입·단위 테스트·빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      # 앱은 frontend/src를 그대로 가져다 쓰므로 웹의 의존성도 깔아야 타입 검사가 된다 (docs/app.md).
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (브라우저·서버·DB)
    runs-on: ubuntu-latest
    needs: [server, web, app]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # 러너의 우분투 패키지 서버 이름 풀이가 잠깐 끊기면(#686) 테스트 전에 실패했다. 세 번까지 간격을 두고 다시 설치한다.
      - name: Playwright 브라우저 설치 (실패 시 재시도)
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "브라우저 설치 실패 ($i/3), $((i * 30))초 뒤 다시 시도"
            sleep $((i * 30))
          done
          exit 1
      - run: pnpm e2e
      - name: 앱 전체화면 자동 전투 검증
        run: |
          pnpm --dir ../app install --frozen-lockfile
          pnpm --dir ../app exec playwright install chromium
          pnpm --dir ../app dev --port 5182 --strictPort > /tmp/idle-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5182/app/ > /dev/null && break
            sleep 1
          done
          APP_URL=http://localhost:5182/app/ node ../app/scripts/idleCheck.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results
