# 병합 조건의 자동 검사 (code-style.md 9절): 테스트, 스타일, 도메인 경계, 마이그레이션 규칙, 계약 동기화.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: 서버 (테스트·스타일·경계 검사)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck test

  web:
    name: 웹 (린트·타입·단위 테스트·빌드)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: 계약과 생성된 타입이 같은지 확인
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm check
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (브라우저·서버·DB)
    runs-on: ubuntu-latest
    needs: [server, web]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results
