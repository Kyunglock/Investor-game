# 안드로이드 앱(APK) 빌드 (decisions.md 306·309번, docs/app.md). app/의 앱 화면을 Capacitor WebView에 담은 앱이다.
# Actions 탭의 Run workflow 로 돌리거나, main 에 앱 관련 변경이 들어오면 돈다. 산출물(APK)은 실행 결과의 Artifacts 에서 받는다.
name: Android

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '앱이 띄울 주소. 비우면 저장소 변수 APP_SERVER_URL, 그것도 없으면 운영 웹의 앱 화면(https://game.kwaklabs.com/app/)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/src/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/src/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    env:
      # 앱이 운영 웹의 앱 화면(/app/)을 그대로 띄우는 방식(기본). 입력 → 저장소 변수 → 운영 웹 순. 화면을 APK 안에 담으려면(docs/app.md)
      # server_url 에 'none' 을 넣고 APP_API_BASE 를 둔다.
      CAP_SERVER_URL: ${{ inputs.server_url == 'none' && '' || inputs.server_url || vars.APP_SERVER_URL || 'https://game.kwaklabs.com/app/' }}
      VITE_API_BASE: ${{ vars.APP_API_BASE }}
      # step 의 if 에서는 secrets 를 직접 볼 수 없어(워크플로가 통째로 거부된다) 있는지만 여기서 env 로 내린다.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable
      # 앱은 frontend/src를 그대로 가져다 쓴다 (docs/app.md).
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile

      - name: 앱 화면 빌드와 안드로이드에 복사
        run: |
          if [ -z "$CAP_SERVER_URL" ] && [ -z "$VITE_API_BASE" ]; then
            echo "::warning::APP_SERVER_URL 도 APP_API_BASE 도 없다. 이 APK 는 서버에 닿지 못한다 (docs/app.md)."
          fi
          pnpm build
          pnpm exec cap sync android

      - name: 디버그 APK
        working-directory: app/android
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 테스트판 앱 (decisions.md 499번): 같은 화면을 `?test=1` 로 띄우는 다른 앱 ID(com.kyunglock.investorgame.test)의 APK.
      # 본 앱과 나란히 깔리고 저장도 따로다. 열면 테스트판 코드를 묻는다(서버의 SANDBOX_CODE). 화면을 APK 안에 담는 방식에는 만들지 않는다.
      - name: 테스트판 디버그 APK
        if: env.CAP_SERVER_URL != ''
        run: |
          case "$CAP_SERVER_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
          CAP_SERVER_URL="${CAP_SERVER_URL}${sep}test=1" pnpm exec cap sync android
          (cd android && APP_TEST=1 ./gradlew assembleDebug --console=plain)
          mkdir -p "$RUNNER_TEMP/test-apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/test-apk/app-test-debug.apk"
          # 뒤의 배포용 APK 는 본 앱의 주소로 만든다.
          pnpm exec cap sync android

      - uses: actions/upload-artifact@v7
        if: env.CAP_SERVER_URL != ''
        with:
          name: app-test-debug
          path: ${{ runner.temp }}/test-apk/app-test-debug.apk
          if-no-files-found: error

      # 서명 키가 저장소 Secrets 에 있으면(ANDROID_KEYSTORE_BASE64·ANDROID_KEYSTORE_PASSWORD·ANDROID_KEY_ALIAS·ANDROID_KEY_PASSWORD)
      # 배포용 APK 도 만든다. 없으면 건너뛴다. 스토어 올리기(AAB)는 bundleRelease 로 바꾸면 된다.
      - name: 배포용 APK (서명 키가 있을 때)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore" ./gradlew assembleRelease --console=plain
          rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v7
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: app-release
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
