name: Deploy

# ── 트리거 ────────────────────────────────────────────────────────────────────
# main 에서 CI(테스트·E2E)가 성공했을 때만 배포한다. 신뢰할 수 없는 코드가 배포
# 파이프라인·홈서버에 닿지 않도록 pull_request 트리거는 의도적으로 넣지 않는다.
# workflow_run 은 원본 저장소의 기본 브랜치 정의로만 돈다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# ── 중첩 배포 방지 ────────────────────────────────────────────────────────────
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── ① 산출물 빌드 (jar·정적 파일은 플랫폼 무관이라 일반 러너에서 빌드) ───────
  build:
    # 방어 가드: 원본 저장소의 main push 로 돈 CI 가 성공했을 때만 (fork·PR 차단)
    if: >-
      github.repository == 'Kyunglock/Investor-game' &&
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # CI 가 검사한 바로 그 커밋을 배포한다.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: corepack enable

      - name: 프론트 빌드
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 백엔드 빌드
        working-directory: backend
        run: ./gradlew bootJar --console=plain

      - name: 산출물 모으기
        run: |
          set -euo pipefail
          mkdir -p out/web
          cp -R frontend/dist/. out/web/
          cp "$(ls backend/build/libs/backend-*.jar | grep -v -- '-plain' | head -1)" out/backend.jar
          ls -la out out/web | head -20

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: out
          retention-days: 7

  # ── ② 홈서버로 배포 (Tailscale VPN 경유 SSH) ──────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Environment 보호 규칙(필수 리뷰어 등)으로 배포 직전 승인 게이트를 걸 수 있다.
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release

      # 러너를 tailnet 에 임시(ephemeral) 노드로 연결. job 이 끝나면 사라진다.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # tailnet 내부에서만 홈서버 SSH 에 접속 → 공인 IP 에 SSH 포트 노출 0.
      # 실제 교체 절차(DB 백업 → jar·정적 파일 교체 → 백엔드 재기동, 실패 시 이전 jar
      # 로 롤백 → nginx 재시작 → 검증)는 공개 저장소에 두지 않고 서버의 deploy.sh 가
      # 맡는다. 여기서는 산출물을 올리고 그 스크립트를 부르기만 한다.
      - name: Deploy over SSH (tailnet)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSHOPT="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"

          RDIR="srv/investor-game/releases/$SHA"
          ssh $SSHOPT "$SSH_USER@$SSH_HOST" "mkdir -p '$RDIR'"
          scp $SSHOPT -r release/backend.jar release/web "$SSH_USER@$SSH_HOST:$RDIR/"

          ssh $SSHOPT "$SSH_USER@$SSH_HOST" RDIR="$RDIR" 'sh -s' <<'REMOTE'
          set -eu
          cd "$HOME"
          # 성공·실패와 상관없이 올린 산출물은 지운다(롤백은 서버의 backend.jar.prev 가 맡음).
          trap 'rm -rf "$HOME/$RDIR"' EXIT
          DEPLOY_ARTIFACTS="$HOME/$RDIR" "$HOME/srv/investor-game/deploy.sh"
          REMOTE
