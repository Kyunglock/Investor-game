openapi: 3.1.0
info:
  title: Investor Game API
  version: 0.3.0
  description: |
    클라이언트와 서버의 계약. 통합 담당만 수정한다 (architecture.md 8절).
    클라이언트 타입은 `web`에서 `pnpm gen:api`로 생성한다.
    규칙 정보(확률, 숨은 방향, 변동 폭, 시드)는 응답에 담지 않는다. 증권사(회사·채용 뽑기·종목회의·실시간 수입)의 API다.
    회사 매각은 뺐다 (decisions.md 236번).
    3분 육성 판은 없앴다 (decisions.md 228번).
servers:
  - url: /
paths:
  /api/sessions:
    post:
      operationId: ensureSession
      summary: 익명 세션을 확보한다
      description: 유효한 세션 쿠키가 있으면 그대로 두고, 없으면 새 세션을 발급해 `IG_SESSION` 쿠키로 준다.
      responses:
        '204':
          description: 세션이 준비됨
  /api/company:
    get:
      operationId: getCompany
      summary: 세션의 가장 최근 회사 (증권사 육성 설계 4·6절)
      responses:
        '200':
          description: 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: openCompany
      summary: 사장의 사재로 회사를 차린다 (decisions.md 228·247번)
      description: |
        직원 없이 열리고 첫 해 공채 시장에 지원자가 와 있다. 이미 회사가 있으면 400(회사는 세션마다 하나).
        회사는 끝나지 않는다 (523번): 파산해 닫고 다음 회사를 차리는 길은 없앴다.
      responses:
        '201':
          description: 새 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /api/company/draws:
    post:
      operationId: drawEmployees
      summary: 다이아로 직원 count명을 뽑는다 (decisions.md 312·526번)
      description: |
        한 명에 다이아 diamonds.hire(100)이고, 온 직원은 서버가 바로 빈 자리에 앉힌다(524번, 사장이 배치하지 않는다). 자리(seats)가 꽉 차면 400: 회사를 넓혀야 더 뽑는다. 돈은 들지 않는다. 등급은 회사 등급(인사팀이 있으면 더 높게)을 중심으로 한 확률표대로다.
        요청에 지금까지 뽑은 횟수(draws)를 싣는다: 이미 한 뽑기면 아무것도 하지 않고 지금 회사를 돌려주고, 아직 오지 않은 것이면 400.
        다이아가 모자라거나 한 번에 maxDraws를 넘으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count, draws]
              properties:
                count: { type: integer, minimum: 1 }
                draws: { type: integer, minimum: 0, description: 지금까지 뽑은 횟수(Company.gacha.draws) }
      responses:
        '200':
          description: 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest/open:
    post:
      operationId: conveneInvestMeeting
      summary: 종목회의를 연다 (decisions.md 249·523번)
      description: |
        기회 하나(meetings.chances)를 써서 새 회의를 연다: 직원이 종목을 물어 오고, 지금 배치로 직원 한마디(invest.remarks)와 리서치 팀 형광펜을 굳힌다.
        그 뒤로 직원이 늘어도 그 회의에서 본 말은 그대로다.
        정하지 않은 회의가 이미 있으면 기회를 쓰지 않고 그 회의를 돌려준다.
        기회가 없거나 돈을 굴리는 자리에 아무도 없으면 400(기회는 쓰지 않는다).
      responses:
        '200':
          description: 회의를 연 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest:
    post:
      operationId: holdInvestMeeting
      summary: 올해 투자 회의에서 고른다 (decisions.md 229번)
      description: |
        돈을 굴리는 직원마다 사장 말대로 하거나, 꼬드김에 넘어가거나, "제가 알아서 할게요" 하고 제 판단대로 한다.
        아직 회의를 열지 않았으면 지금 배치로 연 셈 친다(/api/company/invest/open).
        손익은 바로 자본에 들어가고 invest.outcome에 실린다. 이미 했거나 돈을 굴리는 자리에 아무도 없거나 고를 수 없는 것이면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [BUY, SELL], description: '산다·판다 둘 중 하나 (decisions.md 423번: 지켜본다·맡기기는 뺐다)' }
                big: { type: [boolean, 'null'], description: 크게 한다(화면에서는 뺐다, 279번). 판돈 두 배, 직원이 사장 말을 안 들을 확률 1.5배. 지켜보기는 크게 할 수 없다(400) (decisions.md 260번) }
      responses:
        '200':
          description: 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest/battle:
    post:
      operationId: reportInvestBattle
      summary: 종목 회의 뒤 전투의 결과를 보낸다 (decisions.md 414번, #573)
      description: |
        틀린 쪽에 걸었으면 디펜스(DEFENSE)로 손실을 줄이고(별 0·1·2·3 → 잃은 몫의 100·70·40·0%, 별 3개면 판돈의 10%를 더 번다),
        맞힌 쪽이면 공격 판(ASSAULT)으로 번 몫을 키운다(실패는 추가 0%, 매도벽 열 개 클리어는 벽당 2%로 추가 20%, 기존 회의 수익 유지). 바뀐 몫은 자본에 들어가고 invest.outcome.battle에 실린다.
        모드가 회의 결과와 다르거나, 지켜봤거나, 이미 보냈거나, 다음 회의를 열었으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, stars]
              properties:
                mode: { type: string, enum: [DEFENSE, ASSAULT] }
                stars: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200':
          description: 전투 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/weapon:
    post:
      operationId: equipWeapon
      summary: 가진 무기 가운데 하나를 든다 (decisions.md 346번)
      description: |
        무기는 멘탈 전투에서 드는 총이다. 종류(F·E 권총, D 리볼버, C·B 기관단총, A 폭발포, S~LR 성운포)와 등급(F·E·D·C·B·A·S·SS·SSS·SR·UR·LR)이 있고, F~A는 무기 뽑기로, S~LR은 합성으로만 얻는다.
        든 무기의 수치가 다음 판의 바탕 수치(공격력·연사·탄 강화 단계·탄 속도)가 된다. 없는 종류·등급이거나 안 가진 무기면 400.
        고양이가 들고 있어 아무도 들지 않은 것이 없는 무기도 400 (decisions.md 530번).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, grade]
              properties:
                kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR, LR] }
      responses:
        '200':
          description: 무기를 든 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/stage:
    post:
      operationId: reportStage
      summary: 멘탈 스테이지 한 판의 결과를 보낸다 (decisions.md 369번)
      description: |
        열린 스테이지(1 ~ 깬 최고 + 1)만 받는다. 깼으면 처음이면 자본(번호 × 1b), 별을 처음 얻을 때마다 다이아(1개째 30·2개째 30·3개째 40, 10의 배수 스테이지는 두 배, 526번). 이미 얻은 별은 다시 깨도 주지 않는다.
        못 깼으면 보상 없이 결과만 남는다. 결과는 stages.lastResult에 담긴다. 아직 안 열린 스테이지면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, cleared, stars]
              properties:
                stage: { type: integer, minimum: 1 }
                cleared: { type: boolean }
                stars: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200':
          description: 결과를 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/idle:
    post:
      summary: 화면에 켜 둔 자동 전투의 접속 신호. 10초 넘는 공백은 보상 없음
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId, sequence, action]
              properties:
                runId: { type: string, format: uuid }
                sequence: { type: integer, format: int64, minimum: 0 }
                action: { type: string, enum: [start, tick, stop] }
                hits:
                  type: array
                  maxItems: 60
                  description: 실제 명중한 매도벽과 공격 종류별 횟수 및 표시 피해 합계. 서버가 무기·획득 스킬별 피해와 발사 한도로 검증하며, 명중 없이는 벽 피해 없음
                  items:
                    type: object
                    required: [wall, kind, count]
                    properties:
                      wall: { type: integer, format: int64, minimum: 1 }
                      kind: { type: string, enum: [bullet, water, meteor, bolt, ram, barrage, buy], description: barrage는 액티브 스킬 매수세례의 매수 주문 (503번), buy는 매수벽의 보통 매수 주문 (514번) }
                      count: { type: integer, minimum: 1, maximum: 1000 }
                      damage: { type: number, minimum: 0, maximum: 1000000000000, description: 실제 충돌 피해의 합계. 치명타·지원 주문·범위 감쇠를 포함하며 초당 피해를 곱하지 않음 }
                      depth: { type: integer, minimum: 0, maximum: 2, description: "총알이 이 벽에 닿기 전에 뚫고 온 벽의 수. 0은 화면이 치고 있던 맨 앞 벽(직접 명중)이다. 화면이 서버보다 먼저 벽을 부수므로(532번) 직접 명중은 서버의 맨 앞 벽부터 차례로 깎고 넘친 것은 다음 벽으로 넘어간다. 뚫고 간 명중(1, 2)은 wall에 적힌 벽에 쌓인다. 없으면 옛 화면: 서버의 맨 앞 벽에서 떨어진 거리로 본다" }
      responses:
        '200':
          description: 서버가 계산한 전투와 회사 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
  /api/company/idle/active:
    post:
      operationId: useIdleActive
      summary: 액티브 스킬을 쓴다 (decisions.md 503번)
      description: |
        매수세례(barrage)·불장(rally)·방어선 구축(fortify). 처음부터 모두 쓸 수 있고, 쓰면 재사용 대기 시간이 돈다. 대기 시간은 전투가 돌아가는 동안만
        흐른다. 없는 스킬이거나 대기 중이거나 거래 정지 중이면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, enum: [barrage, rally, fortify] }
      responses:
        '200':
          description: 쓴 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/assault:
    post:
      operationId: reportAssault
      summary: 매도벽 돌파 스테이지 한 판의 결과를 보낸다 (#698)
      description: |
        열린 스테이지(1 ~ 깬 최고 + 1)만 받는다. 처음 깨면 자본(번호 × 1b)을 준다. 다이아는 주지 않는다(526번).
        못 깼으면 보상 없이 결과만 남는다. 결과는 assaults.lastResult에 담긴다. 아직 안 열린 스테이지면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, cleared, stars]
              properties:
                stage: { type: integer, minimum: 1 }
                cleared: { type: boolean }
                stars: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200':
          description: 결과를 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/pass/claim:
    post:
      operationId: claimPass
      summary: 시즌패스의 단계 보상을 받는다 (decisions.md 529번)
      description: |
        step을 실으면 그 단계 하나를, 본문이 없거나 step이 없으면 받을 수 있는 것을 모두 받는다. 받은 것은 pass.lastRewards에 담긴다.
        서버가 도달 여부와 중복 수령을 검증한다: 도달하지 않았거나 이미 받은 단계, 없는 단계, 받을 것이 없는 모두 받기는 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                step: { type: integer, minimum: 1, description: 받을 단계. 없으면 받을 수 있는 것을 모두 받는다 }
      responses:
        '200':
          description: 보상을 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/attendance:
    post:
      operationId: claimAttendance
      summary: 오늘의 출석 보상을 받는다 (decisions.md 528번)
      description: |
        하루에 한 번, 한국 시간 자정 기준이고 서버 시각으로 판정한다. 출석판(attendance.board)의 다음 칸을 받고 한 칸 나아간다.
        누적 출석이라 빠진 날이 있어도 처음으로 돌아가지 않고, 7일 차 다음은 다시 1일 차다. 받은 보상은 attendance.lastReward에 담긴다.
        오늘 이미 받았으면 400.
      responses:
        '200':
          description: 보상을 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/ex:
    post:
      operationId: reportEx
      summary: EX 디펜스 한 판의 결과를 보낸다 (decisions.md 369번)
      description: 하루에 한 번(한국 시간 자정에 다시 열린다, 523번) 다이아 300개(526번, 전에는 무기 뽑기권). 오늘 이미 했으면 그대로 둔다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kills]
              properties:
                kills: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 결과를 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/battle-upgrade:
    post:
      operationId: buyBattleUpgrade
      summary: 자본으로 전투 강화를 levels단계까지 산다 (decisions.md 367·394번)
      description: |
        공격력(+3%)·연사(쏘는 빠르기 +2%, 100%까지)·매수벽 체력(+3%)·매수벽 공격(+3%)·치명타 피해(+6%)를 단계마다 올린다. 연사 말고는 최대 단계가 없다. 값은 1b부터 단계마다 4%씩 오른다.
        상한에 닿은 강화를 사면 400 (487번).
        꾹 눌러 연속으로 올릴 때 화면이 모은 단계를 levels로 묶어 보낸다: 자본이 닿는 데까지 한 단계씩 사고, 한 단계도 못 사면 400.
        고양이 속도 강화는 394번에서 뺐다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [damage, fire, hp, buy, crit] }
                levels: { type: integer, minimum: 1, maximum: 100, description: 올릴 단계 수. 없으면 1 }
      responses:
        '200':
          description: 산 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/weapon/draw:
    post:
      operationId: drawWeapon
      summary: '다이아로 무기를 뽑는다. 한 번 100, 10연차는 1,000에 열한 개 (decisions.md 366·517·526번)'
      description: |
        등급은 F 450·E 260·D 150·C 80·B 40·A 17·S 3의 가중치로, 종류는 등급에 따라 정한다. 이미 가진 종류·등급이면 그 무기의 수가 하나 늘어 무기 합성 재료가 된다.
        결과는 armory.lastDraw에, 한꺼번에 뽑은 것은 armory.lastDraws에 차례대로 담긴다. count가 10이면 10연차다(diamonds.tenDraw에 diamonds.tenCount개). 다이아가 모자라면 하나도 뽑지 않고 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 10, description: 한꺼번에 뽑을 수(10연속, 517번). 없으면 1 }
      responses:
        '200':
          description: 뽑은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/weapon/merge:
    post:
      operationId: mergeWeapon
      summary: 같은 무기 여럿을 합쳐 한 등급 올린다 (decisions.md 366번)
      description: |
        같은 종류·등급의 무기 armory.mergeCount개를 합쳐 한 등급 위에 해당하는 종류 하나로 만든다. 사장냥이나 고양이가 든 것은 합치기에 쓰지 않는다
        (decisions.md 530번): 아무도 들지 않은 것이 mergeCount개 있어야 한다. 모자라거나 가장 높은 등급(LR)이면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, grade]
              properties:
                kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR] }
      responses:
        '200':
          description: 합친 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/cat/draw:
    post:
      operationId: drawCat
      summary: '다이아로 고양이를 뽑는다. 한 번 100, 10연차는 1,000에 열한 마리 (decisions.md 488·493·517·526번)'
      description: |
        무기 뽑기와 같은 값이다. 동료 고양이는 39종(사장냥 포함 총 40종)이고 가중치대로 나온다. 새 고양이는 출전 칸이 비어 있으면 바로 출전하고,
        이미 가진 고양이면 레벨이 하나 올라 그 고양이 총의 공격력이 20% 는다. 나온 고양이는 idle.lastDraws에 차례대로 담긴다.
        다이아가 모자라면 하나도 뽑지 않고 400.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, minimum: 1, maximum: 10, description: 한꺼번에 뽑을 수(10연속, 517번). 없으면 1 }
      responses:
        '200':
          description: 뽑은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/cat/field:
    post:
      operationId: fieldCat
      summary: 가진 고양이를 출전시키거나 쉬게 한다 (decisions.md 488번)
      description: 출전한 고양이만 제 총으로 함께 쏜다. 스킬은 고양이와 상관없이 벽 돌파로 얻는다 (491번). 가지지 않은 고양이거나 출전 칸(idle.fieldSlots)이 꽉 찼으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, fielded]
              properties:
                code: { type: string, enum: [sky, mint, lilac, sunset, night, snow, caramel, mocha, peach, silver, panda, biscuit, ocean, lemon, cocoa, rose, tiger, cloud, star, siam, tilt, russet, sage, apricot, plum, patch, drowsy, coral, truffle, frost, butter, terra, wisteria, odd, pistachio, sand, blush, petrol, oat] }
                fielded: { type: boolean }
      responses:
        '200':
          description: 바꾼 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/cat/weapon:
    post:
      operationId: equipCat
      summary: 고양이에게 가진 무기 하나를 들린다 (decisions.md 488번)
      description: |
        고양이는 가진 무기의 한 개씩을 빌려 든다. kind와 grade를 함께 비우면 뺀다(기본 권총을 쏜다). 사장냥이나 다른 고양이가 든 것은
        가져가지 못한다(decisions.md 530번): 아무도 들지 않은 것이 없으면 400. 가지지 않은 고양이·무기도 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, enum: [sky, mint, lilac, sunset, night, snow, caramel, mocha, peach, silver, panda, biscuit, ocean, lemon, cocoa, rose, tiger, cloud, star, siam, tilt, russet, sage, apricot, plum, patch, drowsy, coral, truffle, frost, butter, terra, wisteria, odd, pistachio, sand, blush, petrol, oat] }
                kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR, LR] }
      responses:
        '200':
          description: 바꾼 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/upgrade:
    post:
      operationId: upgradeBuilding
      summary: 이사 비용을 내고 다음 건물로 간다 (decisions.md 296번)
      description: |
        건물(회사 등급)은 저절로 오르지 않는다. 자본이 다음 띠 + 이사 비용(다음 띠 자본의 25%) 이상이면 비용을 내고 올라간다. 자리 수와 규모의 벽은 바로
        새 건물로 바뀐다. 랜드마크 타워에 오르면 엔딩이다. 돈이 모자라거나 끝 등급이면 400.
      responses:
        '200':
          description: 이사한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400':
          description: 돈이 모자라거나 끝 등급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 세션 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/sandbox:
    post:
      operationId: enterSandbox
      summary: 코드를 넣고 테스트판에 들어간다 (decisions.md 499번)
      description: |
        코드가 맞으면 테스트판 쿠키(IG_SANDBOX)를 심고 이 플레이어의 테스트판 회사를 돌려준다. 쿠키가 있는 동안 /api/company 요청은 본 게임과 따로 둔
        테스트판 회사로 간다. 테스트판 회사는 자본·다이아가 요청마다 다시 채워지고 업계 순위에 남지 않는다. 서버에 코드가 없으면(꺼짐) 404,
        코드가 틀리면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: leaveSandbox
      summary: 테스트판에서 나온다. 다음 요청부터 본 게임의 회사다 (decisions.md 499번)
      description: 테스트판 쿠키를 지운다. 테스트판 회사는 남아 다시 들어오면 이어진다.
      responses:
        '204': { description: 나왔다 }
  /api/sandbox/wall:
    post:
      operationId: jumpSandboxWall
      summary: 테스트판 회사를 고른 매도벽 앞으로 옮긴다 (decisions.md 499번)
      description: 그 벽은 새 벽이고 거래 정지와 쌓인 피해는 지운다. 테스트판에 들어와 있지 않으면(본 게임의 회사면) 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wall]
              properties:
                wall: { type: integer, format: int64, minimum: 1, maximum: 100000 }
      responses:
        '200':
          description: 옮긴 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/wallet:
    post:
      operationId: setSandboxWallet
      summary: 테스트판의 무한 지갑을 켜고 끈다 (decisions.md 499번). 끄면 자본은 처음 돈, 다이아는 0에서 시작한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [infinite]
              properties:
                infinite: { type: boolean }
      responses:
        '200':
          description: 바뀐 뒤의 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/cats:
    post:
      operationId: grantSandboxCats
      summary: 테스트판에서 동료 고양이 39종을 모두 그 레벨로 받고 빈 출전 칸을 채운다 (decisions.md 499번)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: 바뀐 뒤의 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/pass-exp:
    post:
      operationId: addSandboxPassExp
      summary: 테스트판에서 시즌패스 경험치를 더한다 (decisions.md 529번)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exp]
              properties:
                exp: { type: integer, format: int64, minimum: 1, maximum: 100000 }
      responses:
        '200':
          description: 바뀐 뒤의 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/next-season:
    post:
      operationId: skipSandboxSeason
      summary: 테스트판에서 다음 시즌으로 넘긴다 (decisions.md 529번). 진행도가 비고 받지 않은 보상은 사라진다
      responses:
        '200':
          description: 바뀐 뒤의 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/next-day:
    post:
      operationId: skipSandboxDay
      summary: 테스트판에서 하루가 지난 셈 친다 (decisions.md 528번). 출석 보상을 다시 받을 수 있다
      responses:
        '200':
          description: 바뀐 뒤의 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/weapon:
    post:
      operationId: grantSandboxWeapon
      summary: 테스트판에서 그 등급의 무기를 여섯 개 받고 사장냥이 든다 (decisions.md 499번)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties:
                grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR, LR] }
      responses:
        '200':
          description: 바뀐 뒤의 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sandbox/reset:
    post:
      operationId: resetSandbox
      summary: 테스트판 회사를 닫고 처음부터 새로 차린다 (decisions.md 499번)
      description: 강화·고양이·무기·벽이 모두 처음으로 돌아간다. 테스트판에 들어와 있지 않으면 400.
      responses:
        '200':
          description: 새로 차린 테스트판 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/plays:
    get:
      operationId: getPlayLog
      summary: 관리자 플레이 기록 — 누가(익명 세션) 언제 회사를 차려 어디까지 갔는지
      description: |
        서버에 `ADMIN_TOKEN`이 설정되어 있고 `X-Admin-Token` 헤더가 같을 때만 연다 (decisions.md 46번).
        최근 접속 세션 500개와 최근에 차린 회사 500곳. 숨은 값(시드, 능력치)은 없다.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 플레이 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayLog' }
        '403':
          description: 관리자 토큰이 없거나 틀림 (`ADMIN_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Company:
      type: object
      description: 회사 화면의 값. 직원 능력치는 등급만. 분기·결산·파산·엔딩은 없다 (decisions.md 523번). 회사는 끝나지 않고 시간이 흐르는 대로 돈을 번다
      required: [companyId, number, era, capital, diamonds, grade, seats, employees, desks, gacha, history, meetings, attendance, pass]
      properties:
        companyId: { type: string, format: uuid }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era:
          type: object
          description: 지금 시대 (9.4절). 시대는 세 해마다 다른 시대로 바뀐다 (decisions.md 250번)
          required: [code, name, description]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string }
        opening: { type: [string, 'null'], description: 회사를 차릴 때의 한 줄 }
        capital: { type: number, description: 자본. 자동 전투의 물가(decisions.md 505번)로 int64를 넘게 커진다. 소수 없는 수다 }
        diamonds:
          type: object
          description: 다이아 (decisions.md 526번). 직원·고양이·무기 뽑기에 쓰는 하나뿐인 뽑기 재화. 채용권과 뽑기권을 대신한다. 멘탈 보호 스테이지의 별과 EX 디펜스로 얻는다
          required: [amount, draw, tenDraw, tenCount, hire]
          properties:
            amount: { type: integer, format: int64, description: 가진 다이아 }
            draw: { type: integer, format: int64, description: 고양이·무기 한 번 뽑는 값(100) }
            tenDraw: { type: integer, format: int64, description: '고양이·무기 10연차의 값(1,000)' }
            tenCount: { type: integer, description: 10연차에 나오는 수(11) }
            hire: { type: integer, format: int64, description: 직원 한 명을 뽑는 값(100) }
        grade: { $ref: '#/components/schemas/Grade' }
        nextGradeCapital: { type: [integer, 'null'], format: int64, description: 다음 띠의 자본. 끝 등급이면 null }
        upgrade:
          description: 건물 이사 (decisions.md 296번). 자본이 needed를 넘으면 cost를 내고 곧바로 다음 건물로 확장한다. 끝 등급이면 null
          oneOf:
            - type: object
              required: [to, cost, needed, affordable]
              properties:
                to: { $ref: '#/components/schemas/Grade' }
                cost: { type: integer, format: int64, description: 이사 비용(다음 띠 자본의 15%) }
                needed: { type: integer, format: int64, description: 이사하려면 있어야 하는 자본(다음 띠 + 이사 비용) }
                affordable: { type: boolean }
            - type: 'null'
        seats: { type: integer }
        employees:
          type: array
          items:
            type: object
            required: [id, name, overallGrade, grades, effects, perk, incomePerSecond]
            properties:
              id: { type: integer }
              name: { type: string }
              overallGrade:
                $ref: '#/components/schemas/Grade'
                description: F~SSS, 그 위 X~ZZZ·XS·XSS·GOD. 뽑은 그대로 가고 오르거나 떨어지지 않는다 (2.3절, decisions.md 421번)
              effects:
                type: array
                description: 등급 효과 이름. 쌓인다. 능력치로 매긴 종합 등급까지의 A 손절·S 끌어주기·SS 방패·SSS 전설의 촉(decisions.md 387번) 위에 SSS 위 단계만큼 확신·경보·역발상·리더·사수·선견·큰손·철벽·신의 손 (2.4절)
                items: { type: string }
              perk: { type: string, description: '등급 효과 한 줄: 이름·맞히면 버는 배수(더 버는 몫, 등급마다 두 배)·손 뒤집힘 보정·그 등급의 이름 붙은 효과 (decisions.md 289·387번)' }
              grades: { type: object, additionalProperties: { $ref: '#/components/schemas/Grade' } }
              desk: { type: [string, 'null'], description: 앉은 자리 코드. 뽑으면 서버가 빈 자리에 바로 앉힌다 (524번). 자리는 그림과 종목회의의 팀에만 쓰이고 수입과 상관없다 }
              sector: { type: [string, 'null'], description: 관심 섹터 코드. 같은 섹터 데스크에 앉으면 조금 더 번다 }
              sectorName: { type: [string, 'null'] }
              quirk: { type: string, enum: [gut, chat, chart, news, coffee], description: 버릇 (decisions.md 349번). 번호로 정해져 바뀌지 않고 첫인사 문구가 이를 따른다 }
              quirkName: { type: string, description: 버릇 이름(촉파·단톡방파·차트파·뉴스파·커피파) }
              role: { type: [string, 'null'], description: 앉은 자리의 직함(애널리스트·종목 발굴 담당…). 직함이 없는 자리거나 쉬면 null (decisions.md 267번) }
              incomePerSecond: { type: number, description: '이 직원이 실제 1초에 버는 돈 (523번): 등급별 기본값 × (1 + 능력치 합 ÷ 100)에 그 벽의 물가와 멘탈 보호 보너스를 곱했다. 자리와 상관없다' }
        desks:
          type: array
          items:
            type: object
            required: [code, name, statCode, trades, hot, description]
            properties:
              code: { type: string }
              name: { type: string }
              statCode: { type: string }
              trades: { type: boolean, description: 거짓이면 돈을 굴리지 않고 다른 자리를 돕는다 }
              sector: { type: [string, 'null'], description: 섹터 데스크면 그 섹터 코드. 섹터를 가리지 않는 자리면 null }
              hot: { type: boolean, description: 이 시대에 뜨는 자리(시대 보너스가 붙는다, 9.4절) }
              description: { type: string }
              gainBp: { type: [integer, 'null'], description: 맞혔을 때 버는 몫(만분율, 시대 보너스 포함). 돈을 굴리지 않으면 null (decisions.md 259번) }
              missBp: { type: [integer, 'null'], description: 틀렸을 때 잃는 몫(만분율). 돈을 굴리지 않으면 null }
              crashPercent: { type: [integer, 'null'], description: 폭락장의 시장 손익에 곱하는 비율. 100보다 작으면 폭락장에 덜 빠진다. 돈을 굴리지 않으면 null }
              unlockGrade: { type: [string, 'null'], description: 이 자리가 열린 회사 등급 (#393). 처음부터 열려 있었으면 null }
        lockedDesks:
          description: 아직 닫힌 돕는 자리 (#393). 회사가 unlockGrade가 되면 열려 desks에 들어간다
          type: array
          items:
            type: object
            required: [code, name, description, unlockGrade]
            properties:
              code: { type: string }
              name: { type: string }
              description: { type: string }
              unlockGrade: { $ref: '#/components/schemas/Grade' }
        meeting:
          type: object
          description: 채용·시대 안내 줄
          properties:
            hrCap:
              description: 인사팀에 사람이 있으면 지원자 등급의 중심이 오를 수 있는 곳(인사 직원보다 두 단계 아래). 없으면 null (6.3절)
              oneOf: [{ $ref: '#/components/schemas/Grade' }, { type: 'null' }]
            hot: { type: [string, 'null'], description: 이번 시대에 뜨는 섹터 한 줄. 뜨는 섹터가 없는 시대면 null (9.4절) }
        pass:
          type: object
          description: 시즌패스 (decisions.md 529번). 4주짜리 시즌 동안 플레이로 패스 경험치를 모아 단계마다 보상을 받는다. 무료 줄 하나뿐이다. 시즌이 끝나면 받지 않은 보상은 사라진다
          required: [season, name, endsAt, secondsLeft, endingSoon, exp, expPerStep, step, claimable, steps, lastRewards]
          properties:
            season: { type: integer, description: 시즌 번호 }
            name: { type: string }
            endsAt: { type: integer, format: int64, description: 시즌이 끝나는 때(서버 시각, ms) }
            secondsLeft: { type: integer, format: int64, description: 끝날 때까지 남은 시간(초) }
            endingSoon: { type: boolean, description: 끝나기까지 하루가 안 남았다. 받지 않은 보상이 있으면 알려 준다 }
            exp: { type: integer, format: int64, description: 이번 시즌에 모은 패스 경험치 }
            expPerStep: { type: integer, description: 한 단계에 드는 경험치 }
            step: { type: integer, description: 지금 도달한 단계(0부터) }
            claimable: { type: integer, description: 받을 수 있는 보상의 수 }
            steps:
              type: array
              description: 단계마다의 보상, 1단계부터
              items:
                type: object
                required: [step, diamonds, weapon, cat, reached, claimed]
                properties:
                  step: { type: integer }
                  diamonds: { type: integer, format: int64, description: 받는 다이아. 돈 단계면 0 }
                  money: { type: [number, 'null'], description: 돈 단계면 지금 받으면 들어올 돈(회사의 초당 수입 30분어치). 아니면 null }
                  weapon: { type: boolean, description: 무기 하나를 더 받는다. 등급은 뽑기처럼 정해진다 }
                  cat: { type: boolean, description: 고양이 한 마리를 더 받는다 }
                  reached: { type: boolean, description: 경험치가 이 단계에 닿았다 }
                  claimed: { type: boolean, description: 이미 받았다 }
            lastRewards:
              type: array
              description: 마지막으로 받은 보상들. 화면이 획득 연출에 쓴다
              items:
                type: object
                required: [step, diamonds, money]
                properties:
                  step: { type: integer }
                  diamonds: { type: integer, format: int64 }
                  money: { type: number }
                  weaponKind: { type: [string, 'null'] }
                  weaponGrade: { type: [string, 'null'] }
                  cat: { type: [string, 'null'], description: 받은 고양이의 코드 }
                  catName: { type: [string, 'null'] }
        attendance:
          type: object
          description: 출석 보상 (decisions.md 528번). 하루에 한 번이고 한국 시간 자정에 다시 열린다. 누적 7일 주기라 빠진 날이 있어도 이어서 간다
          required: [today, claimable, board]
          properties:
            today: { type: integer, description: 오늘 받을 칸(1부터). 오늘 이미 받았으면 오늘 받은 칸 }
            claimable: { type: boolean, description: 오늘 보상을 아직 안 받았다 }
            board:
              type: array
              description: 출석판, 1일 차부터
              items:
                type: object
                required: [day, diamonds, incomeMinutes, claimed]
                properties:
                  day: { type: integer }
                  diamonds: { type: integer, format: int64, description: 받는 다이아. 돈 칸이면 0 }
                  incomeMinutes: { type: integer, description: 돈 칸이면 회사의 초당 수입 몇 분어치인가. 다이아 칸이면 0 }
                  money: { type: [number, 'null'], description: 돈 칸이면 지금 받으면 들어올 돈(지금의 초당 수입 기준). 다이아 칸이면 null }
                  claimed: { type: boolean, description: 이번 주기에서 이미 받은 칸 }
            lastReward:
              description: 마지막으로 받은 보상. 받은 적이 없으면 null
              oneOf:
                - type: object
                  required: [day, diamonds, money]
                  properties:
                    day: { type: integer }
                    diamonds: { type: integer, format: int64 }
                    money: { type: number }
                - type: 'null'
        meetings:
          type: object
          description: 종목회의의 기회 (decisions.md 523번). 1시간마다 하나씩 생기고 max까지 쌓인다. 자리를 비운 동안에도 쌓인다
          required: [chances, max, nextSeconds]
          properties:
            chances: { type: integer, description: 지금 열 수 있는 횟수. /api/company/invest/open이 하나를 쓴다 }
            max: { type: integer, description: 쌓이는 상한(3) }
            nextSeconds: { type: integer, format: int64, description: 다음 기회까지 남은 시간(초). 상한에 찼으면 0 }
        gacha:
          type: object
          description: 채용 뽑기 (decisions.md 312번). 공채 시장(지원자를 골라 계약금을 내고 뽑던 것, 228번)을 대신한다
          required: [roster, rosterMax, draws, maxDraws, rates, drawn, collection]
          properties:
            roster: { type: integer, description: 데리고 있는 사람 수 }
            rosterMax: { type: integer, description: '데리고 있을 수 있는 사람 수 = 회사의 자리 수 (524번). roster가 여기에 닿으면 더 뽑을 수 없고, 회사를 넓히면 는다' }
            draws: { type: integer, description: 지금까지 뽑은 횟수. 뽑기 요청에 싣는다 }
            maxDraws: { type: integer, description: 한 번에 뽑을 수 있는 최대 수 }
            rates:
              type: array
              description: 이 회사의 확률표. 칸마다 나오는 종합 등급과 확률. star면 특급
              items:
                type: object
                required: [grade, percent, star]
                properties:
                  grade: { $ref: '#/components/schemas/Grade' }
                  percent: { type: integer }
                  star: { type: boolean }
            drawn:
              type: array
              description: 마지막 뽑기에서 온 사람. 화면이 카드를 뒤집어 보인다
              items:
                type: object
                required: [employeeId, name, grade, star, fresh, perk]
                properties:
                  employeeId: { type: integer }
                  name: { type: string }
                  grade: { $ref: '#/components/schemas/Grade' }
                  star: { type: boolean, description: 특급 칸에서 나왔다 }
                  fresh: { type: boolean, description: 도감에 처음 오른 등급이다 }
                  perk: { type: string, description: '짧은 등급 효과: 맞히면 버는 배수와 가장 높은 등급 효과 이름("맞히면 13.8배 · 방패", decisions.md 387번). 등급으로 정한다' }
                  hello: { type: [string, 'null'], description: 첫인사 (349번). 버릇대로 한마디. 옛 뽑기면 null }
            collection:
              type: array
              description: 도감. 등급(F~GOD)마다 뽑아서 얻은 사람 수. 사장의 것이라 다음 회사로 이어진다
              items:
                type: object
                required: [grade, count]
                properties:
                  grade: { $ref: '#/components/schemas/Grade' }
                  count: { type: integer }
        history:
          type: object
          description: 회사 연표·업적·명예의 전당 (decisions.md 263번)
          required: [timeline, achievements, hall]
          properties:
            timeline:
              type: array
              description: 큰 일, 오래된 것부터
              items:
                type: object
                required: [year, kind]
                properties:
                  year: { type: integer }
                  kind: { type: string, enum: [open, grow, shrink, era, overtake, rise, left, best, worst, target, ending] }
                  text: { type: [string, 'null'] }
                  grade:
                    description: grow·shrink의 새 등급. 화면이 건물 이름으로 바꾼다
                    oneOf: [{ $ref: '#/components/schemas/Grade' }, { type: 'null' }]
            achievements:
              type: array
              description: 모든 업적. year가 없으면 아직 못 열었다
              items:
                type: object
                required: [code, name, description, fail]
                properties:
                  code: { type: string }
                  name: { type: string }
                  description: { type: string }
                  year: { type: [integer, 'null'] }
                  fail: { type: boolean, description: 실패 업적 (decisions.md 351번). 망한 판도 즐겁게. 열리면 채용권은 위로 보상 한 장 }
            hall:
              type: array
              description: 이 회사에서 가장 많이 번 사람부터(지금 직원과 떠난 직원), 다섯까지
              items:
                type: object
                required: [name, from, totalPnl, grade]
                properties:
                  name: { type: string }
                  from: { type: integer, description: 들어온 해. 이 기록 전에 들어왔으면 0 }
                  to: { type: [integer, 'null'], description: 떠난 해. 아직 일하면 null }
                  totalPnl: { type: integer, format: int64 }
                  grade: { $ref: '#/components/schemas/Grade' }
        invest:
          description: |
            지금(또는 마지막) 종목회의 (decisions.md 229·523번). 아직 한 번도 열지 않았으면 null. 숨은 방향은 정한 뒤 outcome에만 있다.
            /api/company/invest/open이 기회 하나를 써서 연다: 직원이 종목을 물어 오고(finder) 한마디가 굳는다. 정한 회의는 다음 회의를 열 때까지 결과로 남는다
          oneOf:
            - type: object
              required: [title, stockName, sectorName, sentences, sway, remarks, options, ready, convened, scouted, range]
              properties:
                title: { type: string }
                range:
                  type: object
                  description: 종목 회의 수익률이 오갈 수 있는 범위(만분율, decisions.md 388번). 데스크 몫과 떼어 낸 회의만의 수익률로 −50% ~ +300%
                  required: [lossBp, gainBp]
                  properties:
                    lossBp: { type: integer, description: 틀렸을 때 가장 크게 잃는 몫. 틀려도 잃지 않아 늘 0이다 (#697) }
                    gainBp: { type: integer, description: 맞혔을 때 가장 크게 버는 몫. 기사가 클수록 이 끝에 가깝다 }
                scouted: { type: boolean, description: 이 회의에 직원이 종목을 물어 왔다 (267·523번) }
                stockName: { type: string }
                sectorName: { type: string }
                sentences:
                  type: array
                  description: 단서 기사 문장. 리서치 팀이 형광펜을 그은 문장은 highlighted
                  items:
                    type: object
                    required: [text, highlighted]
                    properties:
                      text: { type: string }
                      highlighted: { type: boolean }
                highlightBy: { type: [string, 'null'], description: 형광펜을 그은 리서치 팀 직원 }
                sway:
                  type: object
                  required: [who, text]
                  properties:
                    who: { type: string, description: 꼬드기는 단골 인물 }
                    text: { type: string }
                remarks:
                  type: array
                  description: 자리에 앉은 직원의 한마디. 회의를 열기 전에는 비어 있다
                  items:
                    type: object
                    required: [employeeId, name, desk, read, text]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      read: { type: string, enum: [UP, DOWN, NEUTRAL] }
                      text: { type: string }
                      stubborn:
                        type: [string, 'null']
                        enum: [LOW, MID, HIGH, null]
                        description: 돈을 굴리는 직원이 제멋대로 할 낌새. 돈을 굴리지 않으면 null
                options:
                  type: array
                  items:
                    type: object
                    required: [code, label]
                    properties:
                      code: { type: string, enum: [BUY, SELL] }
                      label: { type: string }
                ready: { type: boolean, description: 지금 정할 수 있다(정하지 않았고 돈을 굴리는 자리에 사람이 있다) }
                convened: { type: boolean, description: 회의를 열어 한마디와 형광펜을 굳혔다. 그 뒤로 배치를 바꿔도 그대로다 (decisions.md 249번) }
                team:
                  description: 회의에 앉은 팀의 합산 등급 (decisions.md 353번). 앉은 사람이 없으면 null
                  oneOf:
                    - type: object
                      required: [grade, score, hint, members]
                      properties:
                        grade: { $ref: '#/components/schemas/Grade' }
                        score: { type: integer, description: 0~100 }
                        hint: { type: string, description: 한 줄 풀이 }
                        members: { type: integer, description: 앉은 사람 수 }
                    - type: 'null'
                teamBuy: { type: [integer, 'null'], description: 토론에서 매수 쪽에 얹힌 무게(직원 안목, 352번). 회의를 열기 전이면 null }
                teamSell: { type: [integer, 'null'], description: 토론에서 매도 쪽에 얹힌 무게. 회의를 열기 전이면 null }
                teamCall: { type: [string, 'null'], enum: [BUY, SELL, null], description: 토론 뒤 직원들이 기운 쪽 (decisions.md 352번). 사장은 그 뒤에 고른다. 회의를 열기 전이면 null }
                debate:
                  type: array
                  description: 회의를 열면 먼저 오가는 매수파·매도파의 토론 (352번). 결정 전에 본다. 회의를 열기 전이면 비어 있다
                  items:
                    type: object
                    required: [name, side, text, last, kind]
                    properties:
                      name: { type: string }
                      side: { type: string, enum: [BUY, SELL] }
                      text: { type: string }
                      last: { type: boolean }
                      kind: { type: string, enum: [TALK, TALLY, WIN, LOSE] }
                finder:
                  description: 이 종목을 물어 온 직원 (267번). 아직 아무도 안 가져왔거나 옛 회의면 null
                  oneOf:
                    - $ref: '#/components/schemas/Finder'
                    - type: 'null'
                outcome:
                  oneOf:
                    - type: object
                      required: [choice, big, delegated, teamBuy, teamSell, debate, up, reveal, decisive, total, results, returnBp, gainBp, lossBp, battle]
                      properties:
                        choice: { type: string, enum: [BUY, SELL, HOLD], description: 정한 것. HOLD는 423번 전의 옛 회의에만 있다 }
                        big: { type: boolean, description: 크게 했다 (decisions.md 260번) }
                        delegated: { type: boolean, description: 사장이 "너희가 알아서 해" 하고 맡겼다 (decisions.md 279번) }
                        teamBuy: { type: integer, description: 맡겼을 때 매수 쪽에 얹힌 무게(직원 안목). 맡기지 않았으면 0 }
                        teamSell: { type: integer, description: 매도 쪽 무게 }
                        debate:
                          type: array
                          description: 맡겼을 때 매수파·매도파가 주고받은 말 (decisions.md 285번). 맡기지 않았으면 비었다
                          items:
                            type: object
                            required: [name, side, text, last, kind]
                            properties:
                              name: { type: string }
                              side: { type: string, enum: [BUY, SELL] }
                              text: { type: string }
                              last: { type: boolean, description: 결판의 세 박자(표결·선언·승복)면 참 (295번) }
                              kind: { type: string, enum: [TALK, TALLY, WIN, LOSE], description: 'TALK: 토론, TALLY: 사회가 무게를 읽으며 표결을 부른다, WIN: 이긴 쪽 선언, LOSE: 진 쪽이 토를 달고 물러난다 (295번)' }
                        up: { type: boolean }
                        reveal: { type: string }
                        decisive: { type: integer, description: 결정적 문장의 번호(sentences 안) }
                        total: { type: integer, format: int64, description: 회의 손익. 이미 자본에 들어갔다 }
                        returnBp: { type: [integer, 'null'], description: '회의 수익률(만분율, decisions.md 388번) = 회의 손익 ÷ 건 판돈. 판돈을 적기 전에 정한 옛 회의면 null' }
                        gainBp: { type: integer, description: 이 종목을 맞힌 쪽으로 했으면 번 수익률(만분율). 기사가 클수록 크다(최대 +300%) }
                        lossBp: { type: integer, description: 틀린 쪽으로 했으면 잃은 수익률(만분율). 틀려도 잃지 않아 늘 0이다 (#697) }
                        battle:
                          type: [object, 'null']
                          description: 회의 뒤 전투 (decisions.md 414번, #573). 지켜봤으면 null
                          required: [mode, level, levelParts, open, stars, bonus, before, after]
                          properties:
                            mode: { type: string, enum: [DEFENSE, ASSAULT], description: 'DEFENSE: 틀린 쪽에 걸어 디펜스로 손실을 줄인다. ASSAULT: 맞힌 쪽이라 공격 판(매도벽)으로 수익을 키운다' }
                            level: { type: integer, description: '전투의 세기(1부터). 크게 움직인 종목, 크게 건 회의, 깬 번호 스테이지, 회사 건물, 연차로 오른다. 자본 전투 강화는 방어 전투에서만 난이도에 반영하며 매도벽 돌파에서는 제외한다' }
                            levelParts:
                              type: array
                              description: 세기가 오른 이유와 그만큼(0인 것은 뺐다, #594)
                              items:
                                type: object
                                required: [code, plus]
                                properties:
                                  code: { type: string, enum: [news, big, stage, building, year, upgrade] }
                                  plus: { type: integer }
                            open: { type: boolean, description: 아직 할 수 있다. 다음 회의를 열면 끝난다(배율 1) }
                            stars: { type: [integer, 'null'], description: 얻은 별(0~3). 아직 안 했으면 null }
                            bonus: { type: [integer, 'null'], format: int64, description: 전투로 막은 손실 + 더 번 몫(0 이상). 아직 안 했으면 null }
                            before: { type: integer, format: int64, description: 전투 전 회의 손익 }
                            after: { type: [integer, 'null'], format: int64, description: 전투 뒤 회의 손익. 아직 안 했으면 null }
                        reactions:
                          type: array
                          description: 결과가 드러난 뒤 양쪽의 반응 (decisions.md 358번). 맞힌 쪽(kind WIN)과 틀린 쪽(LOSE)이 한마디씩. 토론이 없던 옛 회의면 비어 있다
                          items:
                            type: object
                            required: [name, side, text, last, kind]
                            properties:
                              name: { type: string }
                              side: { type: string, enum: [BUY, SELL] }
                              text: { type: string }
                              last: { type: boolean }
                              kind: { type: string, enum: [TALK, TALLY, WIN, LOSE] }
                        credit: { type: [string, 'null'], description: 물어 온 직원을 칭찬하거나 탓하는 한 줄 (267번). 옛 회의면 null }
                        results:
                          type: array
                          items:
                            type: object
                            required: [employeeId, name, desk, action, follow, pnl, line]
                            properties:
                              employeeId: { type: integer }
                              name: { type: string }
                              desk: { type: string }
                              action: { type: string, enum: [BUY, SELL, HOLD] }
                              follow:
                                type: string
                                enum: [BOSS, OWN, SWAY]
                                description: 사장 말대로·제 판단대로("제가 알아서 할게요")·꼬드김
                              pnl: { type: integer, format: int64 }
                              line: { type: string }
                              rival:
                                description: |
                                  사장 말과 맞붙은 행동: 일어난 쪽(꼬드김·제 판단), 사장 말대로 했으면 먼저 굴린 꼬드김부터 사장과 다른 것.
                                  맞붙을 것이 없었으면 null. 회의 창의 맞대결 막대가 쓴다 (decisions.md 235번)
                                oneOf:
                                  - type: object
                                    required: [kind, action, stat]
                                    properties:
                                      kind: { type: string, enum: [SWAY, OWN], description: 꼬드김·제 판단 }
                                      action: { type: string, enum: [BUY, SELL, HOLD] }
                                      stat: { type: string, description: 사장 쪽을 지킨 능력치 코드(꼬드김이면 conviction) }
                                  - type: 'null'
                    - type: 'null'
            - type: 'null'
        weapons:
          description: 가진 무기 (decisions.md 346번). 수치는 등급을 더한 최종값으로 한 판의 바탕 수치다. 처음엔 일반 권총 하나
          type: array
          items:
            type: object
            required: [kind, name, grade, gradeName, damagePercent, fireMs, power, bulletSpeed, equipped, count]
            properties:
              kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
              name: { type: string }
              grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR, LR] }
              gradeName: { type: string }
              damagePercent: { type: integer, description: 탄 하나의 공격력(%). 100이 적 체력 1 }
              fireMs: { type: integer, description: 연사 간격(ms) }
              power: { type: integer, description: "탄 강화 단계(0~3). 탄은 항상 한 줄이고, 2단계부터 맞으면 주변 적도 휘말린다 (decisions.md 362번)" }
              bulletSpeed: { type: integer, description: 탄 속도(px/s) }
              equipped: { type: boolean, description: 지금 든 무기 }
              count: { type: integer, description: "가진 수 (decisions.md 366번). 같은 무기를 또 뽑으면 늘고, armory.mergeCount개면 합쳐 한 등급 올린다" }
        stages:
          description: 멘탈 스테이지 (decisions.md 369번). 번호 스테이지를 골라 전진 모드로 깬다. 깬 최고 스테이지만큼 회사의 초당 수입이 는다 (523번)
          type: object
          required: [best, last, perChapter, stars, bonusPercent, exAvailable, diamondsLeft, exDiamonds, lastResult]
          properties:
            best: { type: integer, description: 깬 최고 스테이지(0이면 아직 없다). 다음에 열리는 것은 best + 1 }
            last: { type: integer, description: 마지막 스테이지(챕터당 스테이지 수 × 챕터 수, 407번) }
            perChapter: { type: integer, description: 한 챕터의 스테이지 수. 챕터 마지막은 보스 }
            stars: { type: array, items: { type: integer }, description: 깬 스테이지의 별(1~3), 1번부터 차례로 }
            bonusPercent: { type: integer, description: 멘탈 보호 보너스(%). 회사의 초당 수입에 곱한다 (523번) }
            exAvailable: { type: boolean, description: 오늘 EX 디펜스를 아직 안 했다. 하루에 한 번이고 한국 시간 자정에 다시 열린다 (523번) }
            diamondsLeft: { type: array, items: { type: integer, format: int64 }, description: '스테이지마다 아직 받을 수 있는 다이아, 1번부터 마지막 스테이지까지 (527번). 별을 처음 얻을 때마다 받으므로 얻지 않은 별의 몫이다. 별 셋을 다 얻었으면 0' }
            exDiamonds: { type: integer, format: int64, description: EX 디펜스 한 번의 다이아 (527번) }
            lastResult:
              description: 마지막으로 보낸 스테이지·EX 결과와 받은 보상. 없으면 null
              oneOf:
                - type: object
                  required: [stage, cleared, stars, firstClear, capital, diamonds]
                  properties:
                    stage: { type: integer, description: 스테이지 번호. EX 디펜스면 0 }
                    cleared: { type: boolean }
                    stars: { type: integer }
                    firstClear: { type: boolean, description: 이 판에 처음 깼다 }
                    capital: { type: integer, format: int64, description: 받은 자본 }
                    diamonds: { type: integer, format: int64, description: 받은 다이아 (526번) }
                - type: 'null'
        sandbox: { type: boolean, description: 테스트판의 회사다 (decisions.md 499번) }
        sandboxInfinite: { type: boolean, description: 테스트판의 무한 지갑이 켜져 있다. 자본과 다이아가 떨어지지 않는다 }
        idle:
          type: object
          required: [wall, hp, maxHp, dps, earned, boss, skills, cats, fieldSlots, wallDps, income, power]
          properties:
            income:
              type: object
              description: 회사의 수입 (523번). 화면에서 흐르는 실제 1초에 버는 돈이고, 접속해 있는 동안과 자리를 비운 동안이 같다
              required: [perSecond, staffPerSecond, bonusPercent]
              properties:
                perSecond: { type: number, description: '회사의 초당 수입 = (매도벽 돌파의 시간 수입 + 직원 초당 수입의 합) × (1 + 멘탈 보호 보너스)' }
                staffPerSecond: { type: number, description: 그 가운데 직원들의 몫 }
                bonusPercent: { type: integer, description: 멘탈 보호 보너스(%) }
            offline:
              description: 자리를 비운 동안 번 돈 (523번). 마지막으로 받은 것이 남아 있고, 화면은 at이 바뀐 것을 보고 한 번 알려 준다. 받은 적이 없으면 null
              oneOf:
                - type: object
                  required: [at, seconds, earned, capped]
                  properties:
                    at: { type: integer, format: int64, description: 받은 때(서버 시각, ms) }
                    seconds: { type: integer, format: int64, description: 비운 시간(초). 상한(8시간)까지만 센다 }
                    earned: { type: number }
                    capped: { type: boolean, description: 상한보다 오래 비워 상한만큼만 받았다 }
                - type: 'null'
            wall: { type: integer, format: int64 }
            hp: { type: number }
            maxHp: { type: number }
            dps: { type: number }
            earned: { type: number, description: 자동 전투로 번 돈. int64를 넘게 커진다 (505번) }
            boss: { type: boolean }
            circuitSeconds: { type: number, description: 서킷브레이커 잔여 게임 시간. 기본 2배속이며 거래 정지 중에는 공격과 보상이 멈춤 }
            sequence: { type: integer, format: int64, description: 서버가 마지막으로 처리한 접속 신호의 순번. 화면은 이 순번까지 보낸 명중을 hp에 반영된 것으로 본다 }
            upcoming:
              type: array
              description: 뒤쪽 두 매도벽의 체력. 스플래시 피해를 저장하며 보상은 앞에서부터 지급
              items:
                type: object
                required: [wall, hp, maxHp]
                properties:
                  wall: { type: integer, format: int64 }
                  hp: { type: number }
                  maxHp: { type: number }
            lastDraws:
              type: array
              description: 마지막 고양이 뽑기(한 번 또는 10연속, 517번)에서 나온 고양이, 나온 차례대로
              items:
                type: object
                required: [code, level, isNew, grade]
                properties:
                  grade: { type: string, enum: [C, B, A, S], description: 그 고양이의 등급 (539번) }
                  code: { type: string, enum: [sky, mint, lilac, sunset, night, snow, caramel, mocha, peach, silver, panda, biscuit, ocean, lemon, cocoa, rose, tiger, cloud, star, siam, tilt, russet, sage, apricot, plum, patch, drowsy, coral, truffle, frost, butter, terra, wisteria, odd, pistachio, sand, blush, petrol, oat] }
                  level: { type: integer, description: 나온 직후의 레벨. 10연속에서 같은 고양이가 또 나오면 차례로 오른다 }
                  isNew: { type: boolean, description: 처음 얻은 고양이 }
            actives:
              type: array
              description: 액티브 스킬 (decisions.md 503번). 눌러서 쓴다. 시간은 화면에서 흐르는 실제 초다
              items:
                type: object
                required: [code, name, cooldown, seconds, readyIn]
                properties:
                  code: { type: string, enum: [barrage, rally, fortify] }
                  name: { type: string }
                  cooldown: { type: number, description: 한 번 쓰고 다시 쓸 때까지(초) }
                  seconds: { type: number, description: 효과가 이어지는 시간(초) }
                  readyIn: { type: number, description: 다시 쓸 수 있을 때까지 남은 시간(초). 0이면 쓸 수 있다 }
            skills:
              type: array
              description: 스킬 넷(물·메테오·번개·충차). 스킬은 고양이의 고유 능력이다 (decisions.md 501번)
              items:
                type: object
                required: [code, name, owned, level]
                properties:
                  code: { type: string }
                  name: { type: string }
                  owned: { type: boolean, description: 지금 발동 중이다. 이 스킬을 가진 고양이가 출전해 있다 }
                  level: { type: integer, description: 출전한 고양이 가운데 이 스킬의 가장 높은 레벨 (515번). 발동 중이 아니면 0 }
            fieldSlots: { type: integer, description: 한 번에 출전하는 고양이 수 (492·493번, 넷) }
            wallDps: { type: number, description: 최근 벽이 실제로 받은 초당 피해 (492번). dps는 모든 공격이 벽에 맞을 때의 어림값이다 }
            power: { type: number, description: "전투력 (538번). 성장 탭이 보여 주는 숫자 하나: 모든 총·스킬의 초당 피해(치명타 포함)와 매수 주문, 매수벽 체력 강화를 묶었다. 벽 번호는 보지 않는다" }
            cats:
              type: array
              description: 고양이 (488·501번). 뽑기로 얻고, 출전한 고양이만 제 총으로 함께 쏘고 제 스킬을 쓴다
              items:
                type: object
                required: [code, name, level, damagePercent, firePercent, criticalPercent, fielded, weapon, skill, skillName, skillLevel, skillNextLevel, grade]
                properties:
                  code: { type: string, enum: [sky, mint, lilac, sunset, night, snow, caramel, mocha, peach, silver, panda, biscuit, ocean, lemon, cocoa, rose, tiger, cloud, star, siam, tilt, russet, sage, apricot, plum, patch, drowsy, coral, truffle, frost, butter, terra, wisteria, odd, pistachio, sand, blush, petrol, oat] }
                  name: { type: string }
                  level: { type: integer, description: 0이면 아직 없다. 또 뽑을 때마다 하나씩 오른다 }
                  damagePercent: { type: integer, description: 이 고양이 총의 공격력(%). 든 무기 공격력의 이만큼으로 쏜다. 레벨과 특성이 들어 있다 (492번) }
                  firePercent: { type: integer, description: 이 고양이 총의 쏘는 빠르기(%). 특성이 없으면 100 }
                  criticalPercent: { type: integer, description: 이 고양이 총의 치명타 배율(%). 특성이 없으면 100 }
                  fielded: { type: boolean }
                  skill: { type: string, enum: [water, meteor, bolt, ram], description: 이 고양이의 고유 스킬 (501번). 출전해 있는 동안 발동한다 }
                  skillName: { type: string }
                  skillLevel: { type: integer, description: 고유 스킬의 레벨 1~5 (515번). 고양이 Lv.10·20·30·40에 하나씩 오른다 (534번) }
                  skillNextLevel: { type: integer, description: 스킬 레벨이 다음에 오르는 고양이 레벨. 최고 레벨이면 0 }
                  grade: { type: string, enum: [C, B, A, S], description: "등급 (539번). 종마다 정해져 있다. 높을수록 총이 세고(C 1배 · B 1.4배 · A 2배 · S 3배) 뽑기에서 드물다" }
                  weapon:
                    description: 든 무기. 없으면 null(기본 권총을 쏜다)
                    oneOf:
                      - type: object
                        required: [kind, grade]
                        properties:
                          kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                          grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR, LR] }
                      - type: 'null'
        assaults:
          description: 매도벽 돌파 스테이지 (#698). 주 게임. 멘탈 스테이지와 따로 1-1부터 차례로 깬다. 멘탈 보호 보너스에는 들어가지 않는다
          type: object
          required: [best, last, perChapter, stars, lastResult]
          properties:
            best: { type: integer, description: 깬 최고 스테이지(0이면 아직 없다). 다음에 열리는 것은 best + 1 }
            last: { type: integer, description: 마지막 스테이지 }
            perChapter: { type: integer, description: 한 챕터의 스테이지 수. 챕터 마지막은 보스 }
            stars: { type: array, items: { type: integer }, description: 깬 스테이지의 별(1~3), 1번부터 차례로 }
            lastResult:
              description: 마지막으로 보낸 결과와 받은 보상. 없으면 null
              oneOf:
                - type: object
                  required: [stage, cleared, stars, firstClear, capital, diamonds]
                  properties:
                    stage: { type: integer, description: 스테이지 번호 }
                    cleared: { type: boolean }
                    stars: { type: integer }
                    firstClear: { type: boolean, description: 이 판에 처음 깼다 }
                    capital: { type: integer, format: int64, description: 받은 자본 }
                    diamonds: { type: integer, format: int64, description: 받은 다이아. 매도벽 돌파 스테이지는 주지 않아 늘 0이다 (526번) }
                - type: 'null'
        battleUpgrades:
          description: 자본으로 사는 전투 강화 (decisions.md 367·394번). 공격력·연사, 최대 단계 없이 멘탈 전투의 바탕 수치에 영구로 붙는다
          type: array
          items:
            type: object
            required: [kind, level, price, priceGrowthPercent, bonusPercent, nextBonusPercent, maxLevel]
            properties:
              kind: { type: string, enum: [damage, fire, hp, buy, crit], description: 'damage: 공격력, fire: 연사(쏘는 빠르기가 오른다, 100%까지), hp: 매수벽 체력(최대 멘탈과 매수벽이 오른다), buy: 매수벽 공격(매수 주문의 공격력이 오른다), crit: 치명타 피해(치명타 배율이 오른다)' }
              level: { type: integer, description: 지금 단계(0부터) }
              price: { type: number, description: 다음 단계 값. 단계로만 정하고 벽의 물가는 곱하지 않는다 (519번). 수백 단계 뒤에는 int64를 넘게 커진다 }
              priceGrowthPercent: { type: integer, description: 단계마다 값이 오르는 비율(%). 꾹 눌러 연속으로 올릴 때 화면이 다음 값들을 미리 셈한다(정하는 것은 서버) }
              bonusPercent: { type: integer, description: 지금 단계의 효과(%) }
              nextBonusPercent: { type: integer, description: 다음 단계의 효과(%) }
              maxLevel: { type: integer, description: 살 수 있는 마지막 단계 (487번). 0이면 끝없이 산다 }
        armory:
          description: 무기 뽑기 (decisions.md 366번). 무기는 전투에서 떨어지지 않고 다이아로 뽑는다(526번)
          type: object
          required: [mergeCount, lastDraw, lastDraws]
          properties:
            mergeCount: { type: integer, description: 합쳐 한 등급 올리는 데 드는 같은 무기 수 }
            lastDraw:
              description: 마지막으로 뽑은 무기. 뽑은 적이 없으면 null
              oneOf:
                - type: object
                  required: [kind, name, grade, gradeName, isNew]
                  properties:
                    kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                    name: { type: string }
                    grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR, LR] }
                    gradeName: { type: string }
                    isNew: { type: boolean, description: 새로 얻었다. 이미 가진 종류·등급이면 거짓(그 무기의 수가 하나 는다) }
                - type: 'null'
            lastDraws:
              type: array
              description: 마지막 뽑기(한 번 또는 10연속, 517번)에서 나온 무기, 나온 차례대로. 같은 무기가 두 번 나오면 두 번째는 isNew가 거짓
              items:
                type: object
                required: [kind, name, grade, gradeName, isNew]
                properties:
                  kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                  name: { type: string }
                  grade: { type: string, enum: [F, E, D, C, B, A, S, SS, SSS, SR, UR, LR] }
                  gradeName: { type: string }
                  isNew: { type: boolean }
    Finder:
      type: object
      description: 종목을 물어 온 직원 (decisions.md 267번)
      required: [employeeId, name, desk, pitch]
      properties:
        employeeId: { type: integer }
        name: { type: string }
        role: { type: [string, 'null'], description: 직함. 직함이 없는 자리면 null }
        desk: { type: string }
        pitch: { type: string, description: 가져올 때 한마디 }
    Grade:
      type: string
      description: 회사 등급은 F~ZZZ, 직원 등급은 그 위로 XS·XSS·GOD까지 (decisions.md 289번)
      enum: [F, E, D, C, B, A, S, SS, SSS, X, XX, XXX, Z, ZZ, ZZZ, XS, XSS, GOD]
    PlayLog:
      type: object
      required: [sessions, companies]
      properties:
        companies:
          type: array
          description: 회사. 최근에 차린 순 (decisions.md 228번)
          items: { $ref: '#/components/schemas/CompanyPlay' }
        sessions:
          type: array
          description: 마지막 접속이 최근인 순
          items: { $ref: '#/components/schemas/PlaySession' }
    PlaySession:
      type: object
      required: [sessionId, createdAt, lastSeenAt, companies]
      properties:
        sessionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: 처음 온 시각 }
        lastSeenAt: { type: string, format: date-time, description: 마지막 접속 시각 }
        companies: { type: integer, description: 최근 회사 목록(companies) 안에서 센 회사 수 }
        firstIp: { type: [string, 'null'], description: 처음 접속한 IP (프록시 뒤면 X-Forwarded-For의 첫 주소) }
        lastIp: { type: [string, 'null'], description: 마지막 접속 IP }
    CompanyPlay:
      type: object
      required: [companyId, sessionId, status, number, era, capital, grade, employees, sold, createdAt, updatedAt]
      properties:
        companyId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED] }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era: { type: string, description: 시대 코드 }
        capital: { type: integer, format: int64 }
        grade: { $ref: '#/components/schemas/Grade' }
        employees: { type: integer }
        sold: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Named:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SESSION_REQUIRED, NOT_FOUND, INVALID_REQUEST] }
        message: { type: string }
  responses:
    SessionRequired:
      description: 세션이 없거나 만료됨. 새로 태어나야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: 규칙에 맞지 않는 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
