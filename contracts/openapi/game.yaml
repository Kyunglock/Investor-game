openapi: 3.1.0
info:
  title: Investor Game API
  version: 0.2.0
  description: |
    클라이언트와 서버의 계약. 통합 담당만 수정한다 (architecture.md 8절).
    클라이언트 타입은 `web`에서 `pnpm gen:api`로 생성한다.
    규칙 정보(확률, 숨은 방향, 변동 폭, 시드)는 응답에 담지 않는다. 해결된 뉴스의 주가 결과만 보여 준다.
servers:
  - url: /
paths:
  /api/sessions:
    post:
      operationId: ensureSession
      summary: 익명 세션을 확보한다
      description: 유효한 세션 쿠키가 있으면 그대로 두고, 없으면 새 세션을 발급해 `IG_SESSION` 쿠키로 준다.
      responses:
        '204':
          description: 세션이 준비됨
  /api/games:
    post:
      operationId: startGame
      summary: 새 판을 시작한다
      description: 진행 중인 판이 있으면 버리고 새로 시작한다. 1세에 태어나 성장기의 성향 이벤트를 거친 뒤 직업 선택이 온다.
      responses:
        '201':
          description: 새 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /api/games/current:
    get:
      operationId: getCurrentGame
      summary: 가장 최근 판을 가져온다 (이어하기, 끝난 판의 결과 보기)
      responses:
        '200':
          description: 진행 중이거나 끝난 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/advance:
    post:
      operationId: advanceGame
      summary: 게임 시각을 보고한다
      description: |
        그 사이의 월급을 넣고 다음 이벤트가 생기면 만든다. 시각은 거꾸로 갈 수 없고, 한 번에 건너뛸 수 있는 구간에 상한이 있으며,
        대기 중인 이벤트를 지나칠 수 없다. 종료 나이에 도달하면 판이 끝난다.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvanceRequest' }
      responses:
        '200':
          description: 진행된 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/trades:
    post:
      operationId: trade
      summary: 종목을 사거나 판다 (자유 매매)
      description: |
        투자 단계에서 아무 때나 현재가로 사고판다. 뉴스와 달리 "다른 뉴스"가 없어 줏대 판정은 없고 용기 판정만 거친다 (겁나서 주문을 못 낼 수 있다).
        대기 중인 선택형 이벤트가 있으면 먼저 선택해야 한다 (400).
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradeRequest' }
      responses:
        '200':
          description: 판정을 거친 매매 결과와 판 상태. outcome.kind는 TRADE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChoiceOutcome' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/homes/{seq}/listing:
    post:
      operationId: listHome
      summary: 가진 아파트를 매물로 내놓거나 거둔다
      description: |
        내놓아도 바로 팔리지 않는다. 다음 달부터 달마다 매수자가 나와야 팔린다(평소 25%, 집값이 빠질 땐 5%, 뜨거우면 45%).
        대기 중인 선택형 이벤트가 있으면 먼저 선택해야 한다 (400).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: seq
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingRequest' }
      responses:
        '200':
          description: 판 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/stocks/{stockCode}/history:
    get:
      operationId: stockHistory
      summary: 한 종목의 월별 가격 이력 (판 시작부터)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: stockCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 달마다 한 점
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockHistory' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/market/overview:
    get:
      operationId: marketOverview
      summary: 시황 (거시 지표, 경제 신문, 안목 해석)
      description: 이 달의 시황 해석이 없으면 여기서 정해져 저장된다. 같은 달에는 다시 불러도 같다 (매매창 설계 2.2절).
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: 시황
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOverview' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/stocks/{stockCode}/analysis:
    get:
      operationId: stockAnalysis
      summary: 한 종목의 추세 사실과 안목 해석
      description: 숫자는 안목과 상관없이 정확하고 해석만 안목이 읽는다. 이 달의 해석이 없으면 여기서 정해져 저장된다 (매매창 설계 2.1절).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: stockCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 사실과 해석
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAnalysis' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/events/{eventId}/choose:
    post:
      operationId: chooseEvent
      summary: 대기 중인 이벤트에 선택을 제출한다
      description: 뉴스이면 선택이 능력치 판정을 거쳐 실제 행동이 되고, 매매와 주가 변동이 반영된다.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChoiceRequest' }
      responses:
        '200':
          description: 선택 결과와 판 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChoiceOutcome' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/plays:
    get:
      operationId: getPlayLog
      summary: 관리자 플레이 기록 — 누가(익명 세션) 언제 몇 판을 했는지
      description: |
        서버에 `ADMIN_TOKEN`이 설정되어 있고 `X-Admin-Token` 헤더가 같을 때만 연다 (decisions.md 46번).
        최근 접속 세션 500개와 최근에 시작한 판 500개. 숨은 값(시드, 능력치)은 없다.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 플레이 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayLog' }
        '403':
          description: 관리자 토큰이 없거나 틀림 (`ADMIN_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PlayLog:
      type: object
      required: [sessions, plays]
      properties:
        sessions:
          type: array
          description: 마지막 접속이 최근인 순
          items: { $ref: '#/components/schemas/PlaySession' }
        plays:
          type: array
          description: 최근에 시작한 판 순
          items: { $ref: '#/components/schemas/Play' }
    PlaySession:
      type: object
      required: [sessionId, createdAt, lastSeenAt, games]
      properties:
        sessionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: 처음 온 시각 }
        lastSeenAt: { type: string, format: date-time, description: 마지막 접속 시각 }
        games: { type: integer, description: 최근 판 목록(plays) 안에서 센 판 수 }
    Play:
      type: object
      required: [gameId, sessionId, status, startAge, age, startedAt, updatedAt]
      properties:
        gameId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED, ABANDONED] }
        startAge: { type: integer }
        age: { type: integer, description: 끝난 판이면 끝난 나이, 아니면 마지막으로 보고된 나이 }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        initialAsset: { type: [integer, 'null'], format: int64, description: 끝난 판만 }
        finalAsset: { type: [integer, 'null'], format: int64, description: 끝난 판만. 파산이면 음수 }
        ending: { type: [string, 'null'], enum: [NORMAL, BANKRUPT, null], description: 끝난 판만 }
    Phase:
      type: string
      enum: [CHILDHOOD, SAVING, INVESTING, ENDED]
      description: 성장기(성향 이벤트) → 저축기(취업 후) → 투자기 → 종료
    Stats:
      type: object
      required: [insight, patience, courage, conviction, luck]
      properties:
        insight: { type: integer, description: 안목 }
        patience: { type: integer, description: 인내심 }
        courage: { type: integer, description: 용기 }
        conviction: { type: integer, description: 줏대 }
        luck: { type: integer, description: 운 }
    Named:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    InvestorType:
      type: object
      description: 성장기 선택으로 정해지는 투자자 유형. 기간 × 위험 × 소신 조합 8종
      required: [code, name, description]
      properties:
        code: { type: string, description: '"{기간}-{위험}-{소신}" 예 long-safe-own' }
        name: { type: string }
        description: { type: string }
    Holding:
      type: object
      description: 보유 종목. 평가는 현재가 기준이고 가격은 매달 바뀐다
      required: [stockCode, stockName, sectorCode, sectorName, quantity, avgCost, price, value, pnl, pnlBp]
      properties:
        stockCode: { type: string }
        stockName: { type: string }
        sectorCode: { type: string }
        sectorName: { type: string }
        quantity: { type: integer, format: int64, description: 보유 수량(주) }
        avgCost: { type: integer, format: int64, description: 평단(원) }
        price: { type: integer, format: int64, description: 현재가(원) }
        value: { type: integer, format: int64, description: 평가액 = 수량 × 현재가 }
        pnl: { type: integer, format: int64, description: 평가 손익 = 평가액 − 원가 }
        pnlBp: { type: integer, description: 수익률(만분율) }
    StockQuote:
      type: object
      description: 종목 시세. 숨은 값(다음 달 변동)은 없다
      required: [code, name, sectorCode, sectorName, price, change1mBp, change12mBp, spark]
      properties:
        code: { type: string }
        name: { type: string }
        sectorCode: { type: string }
        sectorName: { type: string }
        price: { type: integer, format: int64 }
        change1mBp: { type: integer, description: 1개월 변화율(만분율) }
        change12mBp: { type: integer, description: 12개월 변화율(만분율) }
        spark:
          type: array
          description: 최근 12달 가격(이번 달 포함, 오래된 것부터). 이력이 짧으면 있는 만큼
          items: { type: integer, format: int64 }
    Market:
      type: object
      required: [month, stocks]
      properties:
        month: { type: integer, description: 게임 달 번호 (판 시작 = 0) }
        stocks:
          type: array
          items: { $ref: '#/components/schemas/StockQuote' }
    Household:
      type: object
      description: 가계부. 금액은 이번 달 기준(원)
      required: [married, children, monthlyIncome, spouseIncome, monthlyExpense, retired, pension]
      properties:
        married: { type: boolean }
        marriedAge: { type: [integer, 'null'] }
        children:
          type: array
          items:
            type: object
            required: [age]
            properties:
              age: { type: integer }
        monthlyIncome: { type: integer, format: int64, description: 월급. 은퇴 뒤 0 }
        spouseIncome: { type: integer, format: int64 }
        monthlyExpense: { type: integer, format: int64, description: 생활비 + 자녀 비용 }
        retired: { type: boolean }
        pension: { type: integer, format: int64, description: 은퇴 뒤 매달 들어오는 연금. 은퇴 전 0 }
    TradeRequest:
      type: object
      required: [stockCode, side, quantity]
      properties:
        stockCode: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        quantity: { type: integer, format: int64, minimum: 1, maximum: 1000000000 }
    StockHistory:
      type: object
      required: [stockCode, points]
      properties:
        stockCode: { type: string }
        points:
          type: array
          items:
            type: object
            required: [month, price]
            properties:
              month: { type: integer }
              price: { type: integer, format: int64 }
    Analysis:
      type: object
      description: 안목 해석 (매매창 설계 4절). 확률과 정답은 내려가지 않는다
      required: [month, insight, reading, text]
      properties:
        month: { type: integer, description: 해석한 달. 같은 달에는 다시 열어도 같다 }
        insight: { type: integer, description: 해석한 때의 안목 }
        reading: { type: string, description: 읽은 결론. 추세는 UP·DOWN·FLAT, 시황은 HOT·STABLE·COLD }
        text: { type: string }
        remark:
          oneOf:
            - type: object
              required: [correct, text]
              properties:
                correct: { type: boolean, description: 지난 해석이 맞았는가 }
                text: { type: string }
            - type: 'null'
          description: 지난 해석이 드러나며 붙는 한마디. 지난 해석이 없으면 null
    StockAnalysis:
      type: object
      description: 한 종목의 추세 사실과 안목 해석. 사실은 안목과 상관없이 정확하다
      required: [stockCode, facts, analysis]
      properties:
        stockCode: { type: string }
        facts:
          type: object
          required: [ma6, ma12, high12, low12, dropFromHighBp, riseFromLowBp, change3mBp, change12mBp, sectorChange12mBp, monthsVsMa12]
          properties:
            ma6: { type: integer, format: int64, description: 6개월 이동평균(이번 달 포함) }
            ma12: { type: integer, format: int64, description: 12개월 이동평균 }
            high12: { type: integer, format: int64, description: 최근 12달 최고가 }
            low12: { type: integer, format: int64, description: 최근 12달 최저가 }
            dropFromHighBp: { type: integer, description: 고점 대비 하락률(만분율, 양수) }
            riseFromLowBp: { type: integer, description: 저점 대비 상승률(만분율, 양수) }
            change3mBp: { type: integer }
            change12mBp: { type: integer }
            sectorChange12mBp: { type: integer, description: 같은 섹터 종목들의 12달 변화율 평균 }
            monthsVsMa12: { type: integer, description: 12개월선 위(양수)·아래(음수)로 이어진 달 수 }
        analysis: { $ref: '#/components/schemas/Analysis' }
    MarketOverview:
      type: object
      description: 시황 (매매창 설계 2.2절)
      required: [month, indicators, newspaper, analysis]
      properties:
        month: { type: integer }
        indicators:
          type: array
          description: 순서 고정. 종합주가지수, 주담대 금리, 서울·경기 아파트, 물가, 환율, 가계부채 증가율, 투자 심리, 거래대금
          items:
            type: object
            required: [code, name, unit, value, yearAgo, points]
            properties:
              code: { type: string }
              name: { type: string }
              unit: { type: string, enum: [index, bp, won, score, ratio], description: index는 판 시작 = 1000, bp는 연 만분율, score는 0~100, ratio는 평소 = 10000 }
              value: { type: integer, format: int64 }
              yearAgo: { type: integer, format: int64, description: 12달 전 값. 이력이 짧으면 가장 오래된 값 }
              points:
                type: array
                description: 최근 5년(60달)
                items:
                  type: object
                  required: [month, value]
                  properties:
                    month: { type: integer }
                    value: { type: integer, format: int64 }
        newspaper:
          type: array
          description: 전조·헛소문·평범한 기사·위기 회고를 구분 없이 날짜순으로. 최근 것이 뒤다
          items:
            type: object
            required: [day, kind, text]
            properties:
              day: { type: integer }
              kind: { type: string, enum: [OMEN, ARTICLE, CRISIS] }
              text: { type: string }
        analysis: { $ref: '#/components/schemas/Analysis' }
    Job:
      type: object
      required: [code, title, monthlySalary, tenureYears]
      properties:
        code: { type: string }
        title: { type: string }
        monthlySalary: { type: integer, format: int64, description: 연차 인상과 협상·승진 인상분을 더한 지금 월급(원) }
        tenureYears: { type: integer, description: 지금 직장의 연차(년). 이직하면 0부터 다시 }
    Option:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
        detail: { type: [string, 'null'], description: 이 선택에 드는 돈(주거 선택지만). 필요한 현금·대출·월 부담 }
        blocked: { type: [string, 'null'], description: 고를 수 없는 이유(현금 부족·DSR 초과). 고를 수 있으면 null }
    Housing:
      type: object
      description: 주거 (주거 설계). 총자산에는 집 시세 + 보증금 − 주담대 − 전세대출 − 세입자 보증금이 들어간다
      required: [tenure, deposit, monthlyRent, jeonseLoan, insured, mortgageRateBp, monthlyCost, homes, quotes]
      properties:
        tenure: { type: string, enum: [PARENTS, MONTHLY, VILLA_JEONSE, APT_JEONSE, OWN] }
        regionName: { type: [string, 'null'] }
        deposit: { type: integer, format: int64, description: 지금 사는 집에 맡긴 보증금 }
        monthlyRent: { type: integer, format: int64 }
        jeonseLoan: { type: integer, format: int64 }
        insured: { type: boolean, description: 전세보증보험 }
        leaseEndAge: { type: [integer, 'null'], description: 세 만기 나이 }
        mortgageRateBp: { type: integer, description: 지금 주담대 금리(연, 만분율) }
        monthlyCost: { type: integer, format: int64, description: 한 달 주거비(월세 + 주담대 원리금 + 전세대출 이자 + 보증료) }
        homes:
          type: array
          items: { $ref: '#/components/schemas/Home' }
        quotes:
          type: array
          items: { $ref: '#/components/schemas/HomeQuote' }
    Home:
      type: object
      required: [seq, regionName, price, purchasePrice, mortgage, monthlyPayment, residence, tenantDeposit, listed]
      properties:
        seq: { type: integer }
        regionName: { type: string }
        price: { type: integer, format: int64, description: 지금 시세 }
        purchasePrice: { type: integer, format: int64 }
        mortgage: { type: integer, format: int64 }
        monthlyPayment: { type: integer, format: int64 }
        residence: { type: boolean, description: 내가 사는 집. 아니면 세입자가 사는 갭투자 집 }
        tenantDeposit: { type: integer, format: int64 }
        listed: { type: boolean, description: 매물로 내놓아 매수자를 기다리는 중 }
    HomeQuote:
      type: object
      required: [region, name, price, change12mBp, last12]
      properties:
        region: { type: string }
        name: { type: string }
        price: { type: integer, format: int64 }
        change12mBp: { type: integer }
        last12:
          type: array
          items: { type: integer, format: int64 }
    ListingRequest:
      type: object
      required: [listed]
      properties:
        listed: { type: boolean }
    PendingEvent:
      type: object
      required: [eventId, kind, occursDay, sectorWide, title, body, options]
      properties:
        eventId: { type: string, format: uuid }
        kind: { type: string, enum: [JOB, TRAIT, OFFER, LIFE, CAREER, NEWS, SHAKE, LEVERAGE, HOUSING] }
        occursDay: { type: integer }
        sectorCode: { type: [string, 'null'] }
        sectorName: { type: [string, 'null'] }
        stockCode: { type: [string, 'null'], description: 뉴스의 매매 대상 종목 }
        stockName: { type: [string, 'null'] }
        sectorWide: { type: boolean, description: 뉴스 충격이 섹터 전체인가 }
        spark:
          type: [array, 'null']
          description: 뉴스 종목의 최근 12달 가격
          items: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        hint: { type: [string, 'null'], description: 안목에 따른 힌트. 뉴스는 방향 힌트(안목이 높을수록 종목·섹터·폭을 짚는다), 빚투 제안은 그 종목의 안목 해석 }
        sway: { type: [string, 'null'], description: 줏대를 흔드는 다른 뉴스. 뉴스일 때 }
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }
    Result:
      type: object
      required: [initialAsset, finalAsset, returnBp, finalAge, ending, deviationCounts]
      properties:
        initialAsset: { type: integer, format: int64 }
        finalAsset: { type: integer, format: int64, description: 파산이면 음수 }
        returnBp: { type: integer, description: 수익률(만분율) }
        finalAge: { type: integer, description: 끝난 나이. 파산이면 파산한 나이 }
        ending:
          type: string
          enum: [NORMAL, BANKRUPT]
          description: NORMAL은 종료 나이 도달, BANKRUPT는 총자산이 0 아래로 떨어진 달의 파산 (decisions.md 27번)
        deviationCounts:
          type: object
          additionalProperties: { type: integer }
          description: 능력치 코드별 이탈 횟수
    LogEntry:
      type: object
      description: 인생 기록 한 줄. 문구는 클라이언트가 만들고 서버는 코드와 숫자만 준다. 숨은 값은 없다
      required: [seq, day, kind, payload]
      properties:
        seq: { type: integer, format: int64 }
        day: { type: integer, description: 사건이 일어난 게임 일수 }
        kind:
          type: string
          enum: [BIRTH, TRAIT, JOB, JOB_WAIT, CAREER, STYLE, OFFER, NEWS, SHAKE, PRICE, GROWTH, TRADE, LIFE, MARRIAGE, CHILD, RETIRE, LEVERAGE, OMEN, ARTICLE, CRISIS, HOUSING, HOME_SOLD, TENANT, END]
        payload:
          type: object
          additionalProperties: true
          description: 종류별 필드 (docs/superpowers/specs/2026-10-18-ui-redesign-design.md 6.3절)
    Yearly:
      type: object
      description: 한 해를 마친 시점의 자산
      required: [age, totalAsset, cash]
      properties:
        age: { type: integer, description: 마친 나이 }
        totalAsset: { type: integer, format: int64 }
        cash: { type: integer, format: int64 }
    Game:
      type: object
      required:
        [gameId, status, phase, day, startAge, endAge, daysPerYear, stats, initialStats, cash, totalAsset, initialAsset, invested, debt, holdings, fullTimeInvestor, market, household, housing, log, yearly]
      properties:
        gameId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED] }
        phase: { $ref: '#/components/schemas/Phase' }
        day: { type: integer, description: 서버가 마지막으로 확인한 게임 일수 }
        startAge: { type: integer }
        endAge: { type: integer }
        daysPerYear: { type: integer }
        stats: { $ref: '#/components/schemas/Stats' }
        initialStats:
          allOf: [{ $ref: '#/components/schemas/Stats' }]
          description: 태어날 때의 능력치. 별명은 이 값으로 정해서 게임 중에 바뀌지 않는다
        cash: { type: integer, format: int64 }
        totalAsset: { type: integer, format: int64, description: 현금 + 평가액 − 빚 }
        initialAsset: { type: integer, format: int64 }
        invested: { type: integer, format: int64, description: 보유 평가액 합 }
        debt: { type: integer, format: int64, description: 빚(마이너스 통장). 매월 이자가 붙는다 }
        lastMonthTotalAsset:
          type: [integer, 'null']
          format: int64
          description: 전월 말 총자산. 첫 달이면 null
        holdings:
          type: array
          items: { $ref: '#/components/schemas/Holding' }
        market: { $ref: '#/components/schemas/Market' }
        household: { $ref: '#/components/schemas/Household' }
        housing: { $ref: '#/components/schemas/Housing' }
        job:
          oneOf: [{ $ref: '#/components/schemas/Job' }, { type: 'null' }]
        fullTimeInvestor: { type: boolean, description: 직업 대신 전업투자자를 골랐는가. 그러면 job은 언제나 null이다 }
        investmentStyle:
          oneOf: [{ $ref: '#/components/schemas/Named' }, { type: 'null' }]
        riskProfile:
          oneOf: [{ $ref: '#/components/schemas/Named' }, { type: 'null' }]
          description: 위험 축 (공격/안정). 성향 확정 전 null
        mindProfile:
          oneOf: [{ $ref: '#/components/schemas/Named' }, { type: 'null' }]
          description: 소신 축 (소신/추종). 성향 확정 전 null
        interestSector:
          oneOf: [{ $ref: '#/components/schemas/Named' }, { type: 'null' }]
        investorType:
          oneOf: [{ $ref: '#/components/schemas/InvestorType' }, { type: 'null' }]
        pendingEvent:
          oneOf: [{ $ref: '#/components/schemas/PendingEvent' }, { type: 'null' }]
        nextEventDay:
          type: [integer, 'null']
          description: 다음 이벤트가 생길 게임 일수. 클라이언트는 이 시각까지만 시계를 보낸다
        result:
          oneOf: [{ $ref: '#/components/schemas/Result' }, { type: 'null' }]
        log:
          type: array
          description: 인생 기록. 시간순(오래된 것 먼저)
          items: { $ref: '#/components/schemas/LogEntry' }
        yearly:
          type: array
          description: 마친 나이별 자산. 나이 오름차순
          items: { $ref: '#/components/schemas/Yearly' }
    AdvanceRequest:
      type: object
      required: [day]
      properties:
        day: { type: integer, minimum: 0 }
    ChoiceRequest:
      type: object
      required: [option]
      properties:
        option: { type: string }
        quantity:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000
          description: 뉴스의 매수·매도 수량. 생략하면 매수는 현금의 일정 비율, 매도는 전량. 매도는 보유 수량에서 잘리고, 매수는 현금이 모자라면 INSUFFICIENT_CASH. 뉴스가 아니면 무시
    ChoiceOutcome:
      type: object
      required: [game, outcome]
      properties:
        game: { $ref: '#/components/schemas/Game' }
        outcome: { $ref: '#/components/schemas/Outcome' }
    Outcome:
      type: object
      required: [kind, chosen, actual, deviations, growth]
      properties:
        kind: { type: string, enum: [JOB, TRAIT, OFFER, LIFE, CAREER, NEWS, SHAKE, LEVERAGE, HOUSING, TRADE] }
        chosen: { type: string, description: 사용자가 누른 선택 }
        actual: { type: string, description: 판정을 거친 실제 행동 }
        deviations:
          type: array
          items:
            type: object
            required: [statCode, from, to]
            properties:
              statCode: { type: string }
              from: { type: string }
              to: { type: string }
              source:
                type: [string, 'null']
                enum: [youtuber, friend, community, broadcast, relative, null]
                description: 줏대 이탈일 때 누구의 꼬드김이었는지. 다른 이탈이면 없다
        trade:
          oneOf:
            - type: object
              required: [status, quantity, price, amount]
              properties:
                status: { type: string, enum: [EXECUTED, HELD, NOTHING_TO_SELL, INSUFFICIENT_CASH] }
                quantity: { type: integer, format: int64 }
                price: { type: integer, format: int64 }
                amount: { type: integer, format: int64 }
                realizedPnl: { type: [integer, 'null'], format: int64, description: 매도의 실현 손익 }
            - type: 'null'
        price:
          oneOf:
            - type: object
              required: [sectorCode, sectorName, direction, changeBp, pnl, lossSoftened]
              properties:
                sectorCode: { type: string }
                sectorName: { type: string }
                stockCode: { type: [string, 'null'] }
                stockName: { type: [string, 'null'] }
                direction: { type: string, enum: [UP, DOWN] }
                changeBp: { type: integer }
                pnl: { type: integer, format: int64 }
                lossSoftened: { type: boolean }
            - type: 'null'
        growth:
          type: array
          items:
            type: object
            required: [statCode, before, after, reason]
            properties:
              statCode: { type: string }
              before: { type: integer }
              after: { type: integer }
              reason:
                type: string
                enum: [DEVIATION, TRAIT, CAREER]
                description: DEVIATION은 이탈 경험, TRAIT은 성장기 선택으로 움직인 것
        message: { type: [string, 'null'] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SESSION_REQUIRED, NOT_FOUND, INVALID_REQUEST] }
        message: { type: string }
  responses:
    SessionRequired:
      description: 세션이 없거나 만료됨. 새로 태어나야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: 규칙에 맞지 않는 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
