openapi: 3.1.0
info:
  title: Investor Game API
  version: 0.2.0
  description: |
    클라이언트와 서버의 계약. 통합 담당만 수정한다 (architecture.md 8절).
    클라이언트 타입은 `web`에서 `pnpm gen:api`로 생성한다.
    규칙 정보(확률, 숨은 방향, 변동 폭, 시드)는 응답에 담지 않는다. 증권사 육성(3분 육성 한 판과 회사)의 API다.
servers:
  - url: /
paths:
  /api/sessions:
    post:
      operationId: ensureSession
      summary: 익명 세션을 확보한다
      description: 유효한 세션 쿠키가 있으면 그대로 두고, 없으면 새 세션을 발급해 `IG_SESSION` 쿠키로 준다.
      responses:
        '204':
          description: 세션이 준비됨
  /api/runs:
    post:
      operationId: startRun
      summary: 3분 육성 한 판을 시작한다
      description: |
        진행 중인 판이 있으면 버리고 새로 시작한다. 나이도 시계도 없고 카드 수(12장 안팎)가 판의 끝이다 (증권사 육성 설계 3절).
        세션의 첫 판은 처음 온 사람을 위한 짜인 판이다 (11.2절). 회사가 돌고 있으면 공채 육성이다: 회사가 자본의 10%를 운용금으로 내준다.
        공채는 한 해에 한 번이고, 지난 공채 판의 등록을 정하지 않았으면 400.
      responses:
        '201':
          description: 새 판. 첫 카드가 펼쳐져 있다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /api/runs/current:
    get:
      operationId: getCurrentRun
      summary: 가장 최근 육성 판 (이어하기, 끝난 판의 결과 보기)
      responses:
        '200':
          description: 진행 중이거나 끝난 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runs/{runId}/choose:
    post:
      operationId: chooseRunCard
      summary: 펼쳐진 카드에 선택을 낸다
      description: card는 화면이 본 카드 번호다. 지금 카드와 다르거나(두 번 누름) 고를 수 없는 선택이면 400.
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card, option]
              properties:
                card: { type: integer, minimum: 0 }
                option: { type: string, minLength: 1 }
      responses:
        '200':
          description: 고른 결과와 그 뒤의 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunChoice' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company:
    get:
      operationId: getCompany
      summary: 세션의 가장 최근 회사 (증권사 육성 설계 4·6절)
      responses:
        '200':
          description: 돌고 있거나 끝난 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/hires:
    post:
      operationId: hireFromRun
      summary: 끝난 육성 판의 사람을 등록하거나 돌려보낸다
      description: |
        회사가 없으면 등록하며 회사가 열린다(1호 직원, 그 판의 돈이 시작 자본). 자리가 꽉 찼으면 replace의 직원과 바꾼다.
        돌려보내도 그 판의 돈은 회사 자본으로 들어간다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId, register]
              properties:
                runId: { type: string, format: uuid }
                register: { type: boolean, description: 거짓이면 돌려보낸다 }
                replace: { type: [integer, 'null'], description: 자리가 꽉 찼을 때 바꿀 직원 ID }
      responses:
        '200':
          description: 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/placement:
    post:
      operationId: placeEmployees
      summary: 직원을 자리에 앉힌다. 사장은 배치만 한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: array
                  items:
                    type: object
                    required: [employeeId]
                    properties:
                      employeeId: { type: integer }
                      desk: { type: [string, 'null'], description: 자리 코드. null이면 쉰다 }
      responses:
        '200':
          description: 배치한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/settle:
    post:
      operationId: settleYear
      summary: 올해 결산을 하고 다음 해 연초 회의로 간다
      description: 직원들이 배치대로 1년을 굴린 결과가 lastSettlement에 실린다. 마지막 해면 회사가 끝난다. 공채 판이 남아 있으면 400.
      responses:
        '200':
          description: 결산한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/hr-recruit:
    post:
      operationId: hrRecruit
      summary: 인사팀이 올해 공채를 맡아 신입을 데려온다 (6.3절)
      description: 3분 육성 없이 신입이 들어온다. 인사팀에 아무도 없거나 올해 공채를 했으면 400.
      responses:
        '200':
          description: 신입이 candidate에 실린 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/candidate:
    post:
      operationId: decideCandidate
      summary: 인사팀이 데려온 신입을 등록하거나 돌려보낸다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [register]
              properties:
                register: { type: boolean }
                replace: { type: [integer, 'null'], description: 자리가 꽉 찼을 때 바꿀 직원 ID }
      responses:
        '200':
          description: 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/sale:
    post:
      operationId: sellCompany
      summary: 회사를 팔고 다음 회사를 F에서 차린다 (9절)
      description: 시대가 끝났거나 등급이 매각 조건 이상이어야 한다. 공동창업자 수를 넘게 고르면 400. 응답은 새 회사다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cofounders]
              properties:
                cofounders: { type: array, items: { type: integer }, description: 데려갈 직원 ID }
      responses:
        '200':
          description: 새 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/plays:
    get:
      operationId: getPlayLog
      summary: 관리자 플레이 기록 — 누가(익명 세션) 언제 몇 판을 했는지
      description: |
        서버에 `ADMIN_TOKEN`이 설정되어 있고 `X-Admin-Token` 헤더가 같을 때만 연다 (decisions.md 46번).
        최근 접속 세션 500개와 최근에 시작한 판 500개. 숨은 값(시드, 능력치)은 없다.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 플레이 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayLog' }
        '403':
          description: 관리자 토큰이 없거나 틀림 (`ADMIN_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Run:
      type: object
      description: |
        육성 한 판의 화면 값. 능력치는 등급(F~SSS)만 담는다 (증권사 육성 설계 2.2절). 뉴스의 숨은 방향과 결정적 문장은 없다.
      required: [runId, status, card, cardCount, scripted, recruit, fund, cash, debt, totalAsset, holdings, grades, overallGrade, devices, unlocked]
      properties:
        runId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED] }
        card: { type: integer, description: 지금 카드 번호(0부터) }
        cardCount: { type: integer }
        scripted: { type: boolean, description: 처음 온 사람의 짜인 첫 판인가 (11.2절) }
        recruit: { type: boolean, description: 회사가 공채로 내준 판인가. 아니면 사장의 사재로 하는 판 (6.5절) }
        fund: { type: integer, format: int64, description: 이 판의 운용금 }
        cash: { type: integer, format: int64 }
        debt: { type: integer, format: int64 }
        totalAsset: { type: integer, format: int64, description: 현금 + 보유 평가액 − 빚 }
        holdings:
          type: array
          items: { $ref: '#/components/schemas/RunHolding' }
        grades:
          type: object
          description: 능력치 코드(insight, patience, courage, conviction, luck) → 등급
          additionalProperties: { $ref: '#/components/schemas/Grade' }
        overallGrade: { $ref: '#/components/schemas/Grade' }
        style: { oneOf: [{ $ref: '#/components/schemas/Named' }, { type: 'null' }] }
        sector: { oneOf: [{ $ref: '#/components/schemas/Named' }, { type: 'null' }] }
        devices:
          type: array
          description: 걸어 둔 투자 원칙 장치
          items:
            type: object
            required: [code, statCode, name, cost]
            properties:
              code: { type: string }
              statCode: { type: string }
              name: { type: string }
              cost: { type: string, description: 대가 한 줄. 장치를 건 동안 늘 보인다 }
        unlocked:
          type: array
          description: 처음 온 사람에게 하나씩 열린 기능 (sell, highlighter, size, principle)
          items: { type: string }
        current: { oneOf: [{ $ref: '#/components/schemas/RunCard' }, { type: 'null' }] }
        result: { oneOf: [{ $ref: '#/components/schemas/RunResult' }, { type: 'null' }] }
    Company:
      type: object
      description: 회사 화면의 값. 올해 시장 갈래는 숨은 값이라 조짐만 담는다. 직원 능력치는 등급만.
      required: [companyId, status, number, era, owner, year, turns, capital, grade, seats, employees, desks]
      properties:
        companyId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED], description: ENDED는 시대가 끝났거나 팔린 회사 }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era:
          type: object
          description: 이 회사의 시대 (9.4절)
          required: [code, name, description]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string }
        opening: { type: [string, 'null'], description: 회사를 차릴 때의 한 줄 }
        owner:
          type: object
          description: 사장의 명성 (9.2절)
          required: [fameGrade, famePoints, sales, cofounderSlots]
          properties:
            fameGrade: { $ref: '#/components/schemas/Grade' }
            famePoints: { type: integer }
            sales: { type: integer }
            cofounderSlots: { type: integer, description: 다음 회사에 데려갈 수 있는 공동창업자 수 }
        sale:
          description: 지금 팔 수 있으면 매각 조건. 못 팔면 null (9.1절)
          oneOf:
            - type: object
              required: [forced, note, price, fameAfter, cofounderSlots]
              properties:
                forced: { type: boolean, description: 시대가 끝나 반드시 판다 }
                note: { type: string }
                price: { type: integer, format: int64 }
                fameAfter: { $ref: '#/components/schemas/Grade' }
                cofounderSlots: { type: integer }
            - type: 'null'
        year: { type: integer, description: 지금 해(1부터). 끝났으면 turns + 1 }
        turns: { type: integer }
        capital: { type: integer, format: int64 }
        grade: { $ref: '#/components/schemas/Grade' }
        nextGradeCapital: { type: [integer, 'null'], format: int64 }
        seats: { type: integer }
        employees:
          type: array
          items:
            type: object
            required: [id, name, overallGrade, grades, experience, effects, salary]
            properties:
              id: { type: integer }
              name: { type: string }
              overallGrade:
                $ref: '#/components/schemas/Grade'
                description: SSS면 실전 경험으로 X~ZZZ까지 오른다 (2.3절)
              experience: { type: integer, description: 실전 경험. 폭락장을 손실 없이 버틸 때 쌓인다 }
              experienceNeeded: { type: [integer, 'null'], description: 다음 단계까지 드는 실전 경험. SSS가 아니면 null }
              effects:
                type: array
                description: X 이상 등급의 효과 이름(확신·경보·역발상·리더·사수·선견). 쌓인다 (2.4절)
                items: { type: string }
              salary: { type: integer, format: int64, description: 연봉. 인사 직원이 뽑은 신입만 받는다 (6.3절) }
              sector: { type: [string, 'null'], description: 육성의 성향 카드로 정해진 관심 섹터 코드. 같은 섹터 데스크에 앉으면 조금 더 번다 }
              sectorName: { type: [string, 'null'] }
              grades: { type: object, additionalProperties: { $ref: '#/components/schemas/Grade' } }
              desk: { type: [string, 'null'] }
        desks:
          type: array
          items:
            type: object
            required: [code, name, statCode, trades, hot, description]
            properties:
              code: { type: string }
              name: { type: string }
              statCode: { type: string }
              trades: { type: boolean, description: 거짓이면 돈을 굴리지 않고 다른 자리를 돕는다 }
              sector: { type: [string, 'null'], description: 섹터 데스크면 그 섹터 코드. 섹터를 가리지 않는 자리면 null }
              hot: { type: boolean, description: 이 시대에 뜨는 자리(시대 보너스가 붙는다, 9.4절) }
              description: { type: string }
        meeting:
          oneOf:
            - type: object
              required: [wanted, wantedBonus, recruitFund, recruitOpen]
              properties:
                omen: { type: [string, 'null'], description: 폭락 조짐. 헛조짐일 수도 있다 }
                hot: { type: [string, 'null'], description: 이번 시대에 뜨는 섹터 한 줄. 뜨는 섹터가 없는 시대면 null (9.4절) }
                hrCap:
                  description: 인사팀이 공채를 맡을 수 있으면 뽑는 신입의 종합 등급 상한. 인사팀에 아무도 없으면 null (6.3절)
                  oneOf: [{ $ref: '#/components/schemas/Grade' }, { type: 'null' }]
                earlyOmen: { type: [string, 'null'], description: XX 경보. 내년 폭락 조짐 한 줄 }
                forecast: { type: [string, 'null'], description: ZZZ 선견. 내년 시장 한 줄 }
                wanted: { type: string }
                wantedBonus: { type: string, description: 그 인재에 맞춰 공채 신입을 키우면 받는 보너스 한 줄 (5절 3번) }
                recruitFund: { type: integer, format: int64 }
                recruitOpen: { type: boolean }
                pendingRunId: { type: [string, 'null'], format: uuid }
            - type: 'null'
        candidate:
          description: 인사팀이 데려와 등록을 기다리는 신입 (6.3절)
          oneOf:
            - type: object
              required: [overallGrade, grades]
              properties:
                overallGrade: { $ref: '#/components/schemas/Grade' }
                grades: { type: object, additionalProperties: { $ref: '#/components/schemas/Grade' } }
                line: { type: [string, 'null'] }
            - type: 'null'
        lastSettlement:
          oneOf:
            - type: object
              required: [year, phase, capitalBefore, capitalAfter, fee, gradeBefore, gradeAfter, results, lines]
              properties:
                year: { type: integer }
                phase: { type: string, enum: [boom, normal, crash] }
                omen: { type: [string, 'null'] }
                capitalBefore: { type: integer, format: int64 }
                capitalAfter: { type: integer, format: int64 }
                fee: { type: integer, format: int64 }
                gradeBefore: { $ref: '#/components/schemas/Grade' }
                gradeAfter: { $ref: '#/components/schemas/Grade' }
                results:
                  type: array
                  items:
                    type: object
                    required: [employeeId, name, desk, stake, pnl, flips]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      stake: { type: integer, format: int64 }
                      pnl: { type: integer, format: int64 }
                      flips: { type: object, additionalProperties: { type: integer } }
                lines: { type: array, items: { type: string } }
            - type: 'null'
    Grade:
      type: string
      enum: [F, E, D, C, B, A, S, SS, SSS, X, XX, XXX, Z, ZZ, ZZZ]
    RunHolding:
      type: object
      required: [stockCode, stockName, sectorName, quantity, avgCost, price, value, pnl, pnlBp]
      properties:
        stockCode: { type: string }
        stockName: { type: string }
        sectorName: { type: string }
        quantity: { type: integer, format: int64 }
        avgCost: { type: integer, format: int64 }
        price: { type: integer, format: int64 }
        value: { type: integer, format: int64 }
        pnl: { type: integer, format: int64 }
        pnlBp: { type: integer }
    RunCard:
      type: object
      required: [kind, title, body, sentences, options, tips]
      properties:
        kind: { type: string, enum: [TRAIT, NEWS, PRINCIPLE, RELEASE, BIG, LEVERAGE, EXAM] }
        title: { type: string }
        body: { type: [string, 'null'] }
        stock:
          oneOf:
            - type: object
              required: [code, name, sectorName, price, changeBp, held]
              properties:
                code: { type: string }
                name: { type: string }
                sectorName: { type: string }
                price: { type: integer, format: int64 }
                changeBp: { type: integer, description: 판 시작 가격 대비 }
                held: { type: integer, format: int64 }
            - type: 'null'
        sentences:
          type: array
          description: 단서 기사 문장. 형광펜이 그어진 문장은 highlighted (투자 원칙 장치 설계 3.1절)
          items:
            type: object
            required: [text, highlighted]
            properties:
              text: { type: string }
              highlighted: { type: boolean }
        memo: { type: [string, 'null'], description: 형광펜 옆 여백의 캐릭터 메모 }
        sway:
          oneOf:
            - type: object
              required: [who, text]
              properties:
                who: { type: string, description: 단골 꼬드김 인물 }
                text: { type: string }
            - type: 'null'
        omen: { type: [string, 'null'], description: 폭락 조짐(빨간 글씨) }
        options:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string }
              label: { type: string }
              detail: { type: [string, 'null'] }
        tips:
          type: array
          description: 이 카드에서 처음 열린 기능의 한 줄 설명 (11.1절)
          items: { type: string }
    RunResult:
      type: object
      required: [decided, overallGrade, fund, totalAsset, returnBp, flips, highlights]
      properties:
        decided: { type: boolean, description: 회사에 등록할지 정했는가 }
        overallGrade: { $ref: '#/components/schemas/Grade' }
        fund: { type: integer, format: int64 }
        totalAsset: { type: integer, format: int64 }
        returnBp: { type: integer }
        flips: { type: integer, description: 이 판에서 손이 뒤집힌 횟수 }
        highlights: { type: array, items: { type: string } }
        wanted:
          description: 공채 육성이면 연초 회의가 말한 인재에 맞췄는가 (5절 3번). 아니면 null
          oneOf:
            - type: object
              required: [stat, met, line]
              properties:
                stat: { type: string, description: 올해 필요한 자리가 원하는 능력치 코드 }
                met: { type: boolean, description: 맞췄다. 등록하면 그 능력치가 한 띠 오른다 }
                line: { type: string }
            - type: 'null'
    RunChoice:
      type: object
      required: [outcome, run]
      properties:
        outcome: { $ref: '#/components/schemas/RunOutcome' }
        run: { $ref: '#/components/schemas/Run' }
    RunOutcome:
      type: object
      required: [kind, chosen, actual, flips, lines, growth]
      properties:
        kind: { type: string, enum: [TRAIT, NEWS, PRINCIPLE, RELEASE, BIG, LEVERAGE, EXAM] }
        chosen: { type: string }
        actual: { type: string, description: 판정을 거친 실제 선택. chosen과 다르면 손이 뒤집혔다 }
        flips:
          type: array
          items:
            type: object
            required: [statCode, from, to]
            properties:
              statCode: { type: string }
              from: { type: string }
              to: { type: string }
              who: { type: [string, 'null'], description: 꼬드긴 단골 인물 이름 }
        trade:
          oneOf:
            - type: object
              required: [side, quantity, price, amount, deferred]
              properties:
                side: { type: string, enum: [BUY, SELL] }
                quantity: { type: integer, format: int64 }
                price: { type: integer, format: int64 }
                amount: { type: integer, format: int64 }
                deferred: { type: boolean, description: 증권 앱을 지워 다음 장 가격에 체결됐다 }
            - type: 'null'
        price:
          oneOf:
            - type: object
              required: [changeBp, up]
              properties:
                changeBp: { type: integer }
                up: { type: boolean }
            - type: 'null'
        ifChosen: { type: [integer, 'null'], format: int64, description: 고른 대로 했다면 이 카드에서 생겼을 손익 }
        actualPnl: { type: [integer, 'null'], format: int64 }
        decisive: { type: [string, 'null'], description: 복기. 결정적 문장 }
        lines: { type: array, items: { type: string } }
        growth:
          type: array
          items:
            type: object
            required: [statCode, delta, before, after]
            properties:
              statCode: { type: string }
              delta: { type: integer }
              before: { $ref: '#/components/schemas/Grade' }
              after: { $ref: '#/components/schemas/Grade' }
        tip: { type: [string, 'null'], description: 처음 손이 뒤집혔을 때 한 줄 설명 }
    PlayLog:
      type: object
      required: [sessions, runs]
      properties:
        runs:
          type: array
          description: 3분 육성 판. 최근에 시작한 순 (증권사 육성 설계 11.5절)
          items: { $ref: '#/components/schemas/RunPlay' }
        sessions:
          type: array
          description: 마지막 접속이 최근인 순
          items: { $ref: '#/components/schemas/PlaySession' }
    PlaySession:
      type: object
      required: [sessionId, createdAt, lastSeenAt, runs]
      properties:
        sessionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: 처음 온 시각 }
        lastSeenAt: { type: string, format: date-time, description: 마지막 접속 시각 }
        runs: { type: integer, description: 최근 육성 판 목록(runs) 안에서 센 판 수 }
        firstIp: { type: [string, 'null'], description: 처음 접속한 IP (프록시 뒤면 X-Forwarded-For의 첫 주소) }
        lastIp: { type: [string, 'null'], description: 마지막 접속 IP }
    RunPlay:
      type: object
      required: [runId, sessionId, status, scripted, recruit, card, cardCount, fund, totalAsset, flips, startedAt, updatedAt]
      properties:
        runId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED, ABANDONED] }
        scripted: { type: boolean }
        recruit: { type: boolean }
        card: { type: integer, description: 닿은 카드 번호(0부터). 끝난 판이면 카드 수 }
        cardCount: { type: integer }
        kind:
          type: [string, 'null']
          enum: [TRAIT, NEWS, PRINCIPLE, RELEASE, BIG, LEVERAGE, EXAM, null]
          description: 멈춘 카드의 종류. 끝난 판이면 null
        overallGrade: { oneOf: [{ $ref: '#/components/schemas/Grade' }, { type: 'null' }] }
        fund: { type: integer, format: int64 }
        totalAsset: { type: integer, format: int64 }
        flips: { type: integer }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Named:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SESSION_REQUIRED, NOT_FOUND, INVALID_REQUEST] }
        message: { type: string }
  responses:
    SessionRequired:
      description: 세션이 없거나 만료됨. 새로 태어나야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: 규칙에 맞지 않는 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
