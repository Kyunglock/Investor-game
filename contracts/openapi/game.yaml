openapi: 3.1.0
info:
  title: Investor Game API
  version: 0.3.0
  description: |
    클라이언트와 서버의 계약. 통합 담당만 수정한다 (architecture.md 8절).
    클라이언트 타입은 `web`에서 `pnpm gen:api`로 생성한다.
    규칙 정보(확률, 숨은 방향, 변동 폭, 시드)는 응답에 담지 않는다. 증권사(회사·공채 시장·배치·투자 회의·결산)의 API다.
    회사 매각은 뺐다 (decisions.md 236번).
    3분 육성 판은 없앴다 (decisions.md 228번).
servers:
  - url: /
paths:
  /api/sessions:
    post:
      operationId: ensureSession
      summary: 익명 세션을 확보한다
      description: 유효한 세션 쿠키가 있으면 그대로 두고, 없으면 새 세션을 발급해 `IG_SESSION` 쿠키로 준다.
      responses:
        '204':
          description: 세션이 준비됨
  /api/company:
    get:
      operationId: getCompany
      summary: 세션의 가장 최근 회사 (증권사 육성 설계 4·6절)
      responses:
        '200':
          description: 돌고 있거나 끝난 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: openCompany
      summary: 사장의 사재로 회사를 차린다 (decisions.md 228·246번)
      description: |
        직원 없이 열리고 첫 해 공채 시장에 지원자가 와 있다. 이미 회사가 있으면 400(회사는 세션마다 하나).
        가장 최근 회사가 망했으면(broke가 있으면) 그 회사를 닫고 다음 번호의 회사를 새로 차린다.
      responses:
        '201':
          description: 새 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /api/company/hires:
    post:
      operationId: hireApplicant
      summary: 계약금을 내고 공채 시장의 지원자를 뽑는다
      description: |
        뽑은 직원은 쉬는 채로 들어온다. 자리가 꽉 찼으면 replace의 직원을 내보낸다.
        없는 지원자, 모자란 계약금, 꽉 찬 자리에 replace가 없으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicantId]
              properties:
                applicantId: { type: integer }
                replace: { type: [integer, 'null'], description: 자리가 꽉 찼을 때 내보낼 직원 ID }
      responses:
        '200':
          description: 뽑은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/placement:
    post:
      operationId: placeEmployees
      summary: 직원을 자리에 앉힌다. 사장은 배치만 한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: array
                  items:
                    type: object
                    required: [employeeId]
                    properties:
                      employeeId: { type: integer }
                      desk: { type: [string, 'null'], description: 자리 코드. null이면 쉰다 }
      responses:
        '200':
          description: 배치한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/settle:
    post:
      operationId: settleYear
      summary: 올해 결산을 하고 다음 해 연초 회의로 간다
      description: |
        직원들이 배치대로 1년을 굴린 결과가 lastSettlement에 실린다. 다음 해 지원자와 투자 회의가 새로 온다. 회사는 끝나지 않는다(236번).
        투자 회의를 열 수 있는데(invest.ready) 안 했으면 400.
        결산할 해(year)를 싣는다. 이미 결산한 해면 아무것도 하지 않고 지금 회사를 200으로 돌려준다(같은 요청이 두 번 와도 한 해만 넘어간다).
        아직 오지 않은 해면 400 (decisions.md 234번).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year: { type: integer, minimum: 1, description: 결산할 해. 보통 지금 해(Company.year) }
      responses:
        '200':
          description: 결산한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest/open:
    post:
      operationId: conveneInvestMeeting
      summary: 올해 투자 회의를 연다 (decisions.md 248번)
      description: |
        지금 배치로 직원 한마디(invest.remarks)와 리서치 팀 형광펜을 굳힌다. 그 뒤로 배치를 바꿔도 그대로라 배치를 바꿔 가며 정답을 알아낼 수 없다.
        열기 전에는 remarks가 비어 있고 형광펜도 없다. 이미 열었으면 지금 회사를 그대로 돌려준다.
        열 수 없는 회의(정했거나 돈을 굴리는 자리에 아무도 없다)면 400.
      responses:
        '200':
          description: 회의를 연 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest:
    post:
      operationId: holdInvestMeeting
      summary: 올해 투자 회의에서 고른다 (decisions.md 229번)
      description: |
        돈을 굴리는 직원마다 사장 말대로 하거나, 꼬드김에 넘어가거나, "제가 알아서 할게요" 하고 제 판단대로 한다.
        아직 회의를 열지 않았으면 지금 배치로 연 셈 친다(/api/company/invest/open).
        손익은 바로 자본에 들어가고 invest.outcome에 실린다. 이미 했거나 돈을 굴리는 자리에 아무도 없거나 고를 수 없는 것이면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [BUY, SELL, HOLD] }
      responses:
        '200':
          description: 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/applicants/refresh:
    post:
      operationId: refreshApplicants
      summary: 값(refreshCost)을 내고 올해 지원자를 새로 받는다
      description: 돈이 모자라면 400.
      responses:
        '200':
          description: 새 지원자가 온 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/plays:
    get:
      operationId: getPlayLog
      summary: 관리자 플레이 기록 — 누가(익명 세션) 언제 회사를 차려 어디까지 갔는지
      description: |
        서버에 `ADMIN_TOKEN`이 설정되어 있고 `X-Admin-Token` 헤더가 같을 때만 연다 (decisions.md 46번).
        최근 접속 세션 500개와 최근에 차린 회사 500곳. 숨은 값(시드, 능력치)은 없다.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 플레이 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayLog' }
        '403':
          description: 관리자 토큰이 없거나 틀림 (`ADMIN_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Company:
      type: object
      description: 회사 화면의 값. 올해 시장 갈래는 숨은 값이라 조짐만 담는다. 직원 능력치는 등급만.
      required: [companyId, status, number, era, year, capital, grade, seats, employees, desks, applicants, refreshCost]
      properties:
        companyId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED], description: ENDED는 매각을 빼기 전(236번)에 팔린 회사. 시대가 끝나 멈췄던 회사는 다시 열면 ACTIVE로 이어진다 }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era:
          type: object
          description: 지금 시대 (9.4절). 시대는 세 해마다 다른 시대로 바뀐다 (decisions.md 249번)
          required: [code, name, description]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string }
        opening: { type: [string, 'null'], description: 회사를 차릴 때의 한 줄 }
        year: { type: integer, description: 지금 해(1부터). 회사는 끝나지 않고 해마다 이어진다 (decisions.md 236번) }
        capital: { type: integer, format: int64 }
        grade: { $ref: '#/components/schemas/Grade' }
        nextGradeCapital: { type: [integer, 'null'], format: int64 }
        broke: { type: [string, 'null'], description: 망한 회사의 한 줄. 자본이 0이거나 직원 없이 가장 싼 계약금도 못 내면 있고, 그때 사재로 다음 회사를 차릴 수 있다 (decisions.md 246번) }
        seats: { type: integer }
        employees:
          type: array
          items:
            type: object
            required: [id, name, overallGrade, grades, experience, effects]
            properties:
              id: { type: integer }
              name: { type: string }
              overallGrade:
                $ref: '#/components/schemas/Grade'
                description: SSS면 실전 경험으로 X~ZZZ까지 오른다 (2.3절)
              experience: { type: integer, description: 실전 경험. 폭락장을 손실 없이 버틸 때 쌓인다 }
              experienceNeeded: { type: [integer, 'null'], description: 다음 단계까지 드는 실전 경험. SSS가 아니면 null }
              effects:
                type: array
                description: X 이상 등급의 효과 이름(확신·경보·역발상·리더·사수·선견). 쌓인다 (2.4절)
                items: { type: string }
              grades: { type: object, additionalProperties: { $ref: '#/components/schemas/Grade' } }
              desk: { type: [string, 'null'] }
              sector: { type: [string, 'null'], description: 관심 섹터 코드. 같은 섹터 데스크에 앉으면 조금 더 번다 }
              sectorName: { type: [string, 'null'] }
        desks:
          type: array
          items:
            type: object
            required: [code, name, statCode, trades, hot, description]
            properties:
              code: { type: string }
              name: { type: string }
              statCode: { type: string }
              trades: { type: boolean, description: 거짓이면 돈을 굴리지 않고 다른 자리를 돕는다 }
              sector: { type: [string, 'null'], description: 섹터 데스크면 그 섹터 코드. 섹터를 가리지 않는 자리면 null }
              hot: { type: boolean, description: 이 시대에 뜨는 자리(시대 보너스가 붙는다, 9.4절) }
              description: { type: string }
        meeting:
          oneOf:
            - type: object
              required: [wanted]
              properties:
                omen: { type: [string, 'null'], description: 폭락 조짐. 헛조짐일 수도 있다 }
                hrCap:
                  description: 인사팀에 사람이 있으면 지원자 등급의 중심이 오를 수 있는 곳(인사 직원보다 두 단계 아래). 없으면 null (6.3절)
                  oneOf: [{ $ref: '#/components/schemas/Grade' }, { type: 'null' }]
                earlyOmen: { type: [string, 'null'], description: XX 경보. 내년 폭락 조짐 한 줄 }
                forecast: { type: [string, 'null'], description: ZZZ 선견. 내년 시장 한 줄 }
                wanted: { type: string }
                hot: { type: [string, 'null'], description: 이번 시대에 뜨는 섹터 한 줄. 뜨는 섹터가 없는 시대면 null (9.4절) }
                eraEnding: { type: [string, 'null'], description: 지금 시대의 마지막 해면 "내년에는 시대가 바뀐다" 한 줄. 아니면 null (decisions.md 249번) }
            - type: 'null'
        applicants:
          type: array
          description: 올해 공채 시장의 지원자 (decisions.md 228번). 끝난 회사면 비어 있다
          items:
            type: object
            required: [id, name, overallGrade, grades, fee]
            properties:
              id: { type: integer }
              name: { type: string }
              overallGrade: { $ref: '#/components/schemas/Grade' }
              grades: { type: object, additionalProperties: { $ref: '#/components/schemas/Grade' } }
              fee: { type: integer, format: int64, description: 계약금. 뽑으면 회사 자본에서 나간다 }
              line: { type: [string, 'null'], description: 올해 필요한 인재, 사수가 붙음, 인사팀이 데려옴 }
              sector: { type: [string, 'null'], description: 관심 섹터 코드. 뽑으면 직원이 안고 들어온다 }
              sectorName: { type: [string, 'null'] }
        refreshCost: { type: integer, format: int64, description: 지원자를 새로 받는 값 }
        invest:
          description: 올해 투자 회의 (decisions.md 229번). 끝난 회사나 옛 회사면 null. 숨은 방향은 정한 뒤 outcome에만 있다
          oneOf:
            - type: object
              required: [title, stockName, sectorName, sentences, sway, remarks, options, ready, convened]
              properties:
                title: { type: string }
                stockName: { type: string }
                sectorName: { type: string }
                sentences:
                  type: array
                  description: 단서 기사 문장. 리서치 팀이 형광펜을 그은 문장은 highlighted
                  items:
                    type: object
                    required: [text, highlighted]
                    properties:
                      text: { type: string }
                      highlighted: { type: boolean }
                highlightBy: { type: [string, 'null'], description: 형광펜을 그은 리서치 팀 직원 }
                sway:
                  type: object
                  required: [who, text]
                  properties:
                    who: { type: string, description: 꼬드기는 단골 인물 }
                    text: { type: string }
                remarks:
                  type: array
                  description: 자리에 앉은 직원의 한마디. 회의를 열기 전에는 비어 있다
                  items:
                    type: object
                    required: [employeeId, name, desk, read, text]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      read: { type: string, enum: [UP, DOWN, NEUTRAL] }
                      text: { type: string }
                      stubborn:
                        type: [string, 'null']
                        enum: [LOW, MID, HIGH, null]
                        description: 돈을 굴리는 직원이 제멋대로 할 낌새. 돈을 굴리지 않으면 null
                options:
                  type: array
                  items:
                    type: object
                    required: [code, label]
                    properties:
                      code: { type: string, enum: [BUY, SELL, HOLD] }
                      label: { type: string }
                ready: { type: boolean, description: 지금 정할 수 있다(정하지 않았고 돈을 굴리는 자리에 사람이 있다) }
                convened: { type: boolean, description: 회의를 열어 한마디와 형광펜을 굳혔다. 그 뒤로 배치를 바꿔도 그대로다 (decisions.md 248번) }
                outcome:
                  oneOf:
                    - type: object
                      required: [choice, up, reveal, decisive, total, results]
                      properties:
                        choice: { type: string, enum: [BUY, SELL, HOLD] }
                        up: { type: boolean }
                        reveal: { type: string }
                        decisive: { type: integer, description: 결정적 문장의 번호(sentences 안) }
                        total: { type: integer, format: int64, description: 회의 손익. 이미 자본에 들어갔다 }
                        results:
                          type: array
                          items:
                            type: object
                            required: [employeeId, name, desk, action, follow, pnl, line]
                            properties:
                              employeeId: { type: integer }
                              name: { type: string }
                              desk: { type: string }
                              action: { type: string, enum: [BUY, SELL, HOLD] }
                              follow:
                                type: string
                                enum: [BOSS, OWN, SWAY]
                                description: 사장 말대로·제 판단대로("제가 알아서 할게요")·꼬드김
                              pnl: { type: integer, format: int64 }
                              line: { type: string }
                              rival:
                                description: |
                                  사장 말과 맞붙은 행동: 일어난 쪽(꼬드김·제 판단), 사장 말대로 했으면 먼저 굴린 꼬드김부터 사장과 다른 것.
                                  맞붙을 것이 없었으면 null. 회의 창의 맞대결 막대가 쓴다 (decisions.md 235번)
                                oneOf:
                                  - type: object
                                    required: [kind, action, stat]
                                    properties:
                                      kind: { type: string, enum: [SWAY, OWN], description: 꼬드김·제 판단 }
                                      action: { type: string, enum: [BUY, SELL, HOLD] }
                                      stat: { type: string, description: 사장 쪽을 지킨 능력치 코드(꼬드김이면 conviction) }
                                  - type: 'null'
                    - type: 'null'
            - type: 'null'
        lastSettlement:
          oneOf:
            - type: object
              required: [year, phase, capitalBefore, capitalAfter, fee, gradeBefore, gradeAfter, results, lines]
              properties:
                year: { type: integer }
                phase: { type: string, enum: [boom, normal, crash] }
                omen: { type: [string, 'null'] }
                capitalBefore: { type: integer, format: int64 }
                capitalAfter: { type: integer, format: int64 }
                fee: { type: integer, format: int64 }
                invest:
                  description: 그해 투자 회의(기사 제목과 손익, 이미 자본에 들어갔다). 회의를 안 했거나 옛 결산이면 null (decisions.md 240번)
                  oneOf:
                    - type: object
                      required: [title, total]
                      properties:
                        title: { type: string }
                        total: { type: integer, format: int64 }
                    - type: 'null'
                gradeBefore: { $ref: '#/components/schemas/Grade' }
                gradeAfter: { $ref: '#/components/schemas/Grade' }
                results:
                  type: array
                  items:
                    type: object
                    required: [employeeId, name, desk, stake, pnl, flips]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      stake: { type: integer, format: int64 }
                      pnl: { type: integer, format: int64 }
                      flips: { type: object, additionalProperties: { type: integer } }
                lines: { type: array, items: { type: string } }
            - type: 'null'
    Grade:
      type: string
      enum: [F, E, D, C, B, A, S, SS, SSS, X, XX, XXX, Z, ZZ, ZZZ]
    PlayLog:
      type: object
      required: [sessions, companies]
      properties:
        companies:
          type: array
          description: 회사. 최근에 차린 순 (decisions.md 228번)
          items: { $ref: '#/components/schemas/CompanyPlay' }
        sessions:
          type: array
          description: 마지막 접속이 최근인 순
          items: { $ref: '#/components/schemas/PlaySession' }
    PlaySession:
      type: object
      required: [sessionId, createdAt, lastSeenAt, companies]
      properties:
        sessionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: 처음 온 시각 }
        lastSeenAt: { type: string, format: date-time, description: 마지막 접속 시각 }
        companies: { type: integer, description: 최근 회사 목록(companies) 안에서 센 회사 수 }
        firstIp: { type: [string, 'null'], description: 처음 접속한 IP (프록시 뒤면 X-Forwarded-For의 첫 주소) }
        lastIp: { type: [string, 'null'], description: 마지막 접속 IP }
    CompanyPlay:
      type: object
      required: [companyId, sessionId, status, number, era, year, settled, capital, grade, employees, sold, createdAt, updatedAt]
      properties:
        companyId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED] }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era: { type: string, description: 시대 코드 }
        year: { type: integer, description: 지금 해. 시대가 끝났으면 turns + 1 }
        settled: { type: integer, description: 결산한 해의 수 }
        capital: { type: integer, format: int64 }
        grade: { $ref: '#/components/schemas/Grade' }
        employees: { type: integer }
        sold: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Named:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SESSION_REQUIRED, NOT_FOUND, INVALID_REQUEST] }
        message: { type: string }
  responses:
    SessionRequired:
      description: 세션이 없거나 만료됨. 새로 태어나야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: 규칙에 맞지 않는 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
