                          items: { $ref: '#/components/schemas/Target' }
                        chosen:
                          description: 고른 라이벌. 아직이면 null
                          oneOf:
                            - $ref: '#/components/schemas/Target'
                            - type: 'null'
                    - type: 'null'
            - type: 'null'
        applicants:
          type: array
          description: 올해 공채 시장의 지원자 (decisions.md 228번). 끝난 회사면 비어 있다
          items:
            type: object
            required: [id, name, overallGrade, grades, fee]
