openapi: 3.1.0
info:
  title: Investor Game API
  version: 0.3.0
  description: |
    클라이언트와 서버의 계약. 통합 담당만 수정한다 (architecture.md 8절).
    클라이언트 타입은 `web`에서 `pnpm gen:api`로 생성한다.
    규칙 정보(확률, 숨은 방향, 변동 폭, 시드)는 응답에 담지 않는다. 증권사(회사·공채 시장·배치·투자 회의·결산)의 API다.
    회사 매각은 뺐다 (decisions.md 236번).
    3분 육성 판은 없앴다 (decisions.md 228번).
servers:
  - url: /
paths:
  /api/sessions:
    post:
      operationId: ensureSession
      summary: 익명 세션을 확보한다
      description: 유효한 세션 쿠키가 있으면 그대로 두고, 없으면 새 세션을 발급해 `IG_SESSION` 쿠키로 준다.
      responses:
        '204':
          description: 세션이 준비됨
  /api/company:
    get:
      operationId: getCompany
      summary: 세션의 가장 최근 회사 (증권사 육성 설계 4·6절)
      responses:
        '200':
          description: 돌고 있거나 끝난 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: openCompany
      summary: 사장의 사재로 회사를 차린다 (decisions.md 228·247번)
      description: |
        직원 없이 열리고 첫 해 공채 시장에 지원자가 와 있다. 이미 회사가 있으면 400(회사는 세션마다 하나).
        가장 최근 회사가 망했으면(broke가 있으면) 그 회사를 닫고 다음 번호의 회사를 새로 차린다. 직원은 쉬는 채로 모두 따라온다 (decisions.md 265번).
      responses:
        '201':
          description: 새 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /api/company/hires:
    post:
      operationId: hireApplicant
      summary: 계약금을 내고 공채 시장의 지원자를 뽑는다
      description: |
        뽑은 직원은 쉬는 채로 들어온다. 자리가 꽉 찼으면 replace의 직원을 내보낸다.
        없는 지원자, 모자란 계약금, 꽉 찬 자리에 replace가 없으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicantId]
              properties:
                applicantId: { type: integer }
                replace: { type: [integer, 'null'], description: 자리가 꽉 찼을 때 내보낼 직원 ID }
      responses:
        '200':
          description: 뽑은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/placement:
    post:
      operationId: placeEmployees
      summary: 직원을 자리에 앉힌다. 사장은 배치만 한다
      description: 자리 수를 넘거나, 없는 직원·자리이거나, 같은 직원이 두 번 오면 400 (decisions.md 254번).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: array
                  items:
                    type: object
                    required: [employeeId]
                    properties:
                      employeeId: { type: integer }
                      desk: { type: [string, 'null'], description: 자리 코드. null이면 쉰다 }
      responses:
        '200':
          description: 배치한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/settle:
    post:
      operationId: settleQuarter
      summary: 한 분기를 넘긴다. 4분기면 연말 결산을 하고 다음 해 연초 회의로 간다 (decisions.md 268번)
      description: |
        직원들이 배치대로 한 분기를 굴린 결과가 lastQuarter에 실리고, 다음 분기의 거시경제 회의가 새로 온다.
        4분기를 넘기면 네 분기를 모은 연말 결산서가 lastSettlement에 실리고 다음 해 지원자가 온다. 회사는 끝나지 않는다(236번).
        종목 회의를 열 수 있는데(invest.ready) 안 했으면 400.
        넘길 해와 분기를 싣는다. 이미 넘긴 분기면 아무것도 하지 않고 지금 회사를 200으로 돌려준다(같은 요청이 두 번 와도 한 분기만 넘어간다).
        아직 오지 않은 분기면 400 (decisions.md 234번).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, quarter]
              properties:
                year: { type: integer, minimum: 1, description: 넘길 해. 보통 지금 해(Company.year) }
                quarter: { type: integer, minimum: 1, maximum: 4, description: 넘길 분기. 보통 지금 분기(Company.quarter) }
      responses:
        '200':
          description: 결산한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/poach:
    post:
      operationId: answerPoach
      summary: 올해 이직 제안에 답한다 (decisions.md 262번)
      description: |
        keep이 참이면 남긴다(돈이 들지 않는다). 거짓이면 이적료(transferFee)를 받고 보낸다.
        답하지 않은 채 결산해도 직원은 남는다: 직원은 사장이 보낼 때만 떠난다 (decisions.md 265번). 제안이 없으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { type: boolean }
      responses:
        '200':
          description: 답한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/raise:
    post:
      operationId: answerRaise
      summary: 올해 연봉 협상에 답한다 (decisions.md 270번)
      description: |
        accept가 참이면 연봉을 올려 준다(사기 +1), 거짓이면 동결한다(사기 −2). 답하지 않은 채 연말이 오면 흐지부지되고 사기가 조금 내린다.
        협상이 없으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        '200':
          description: 답한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/target:
    post:
      operationId: pickTarget
      summary: 연초 회의에서 올해의 라이벌을 고른다 (decisions.md 275번)
      description: |
        difficulty는 EASY·MEDIUM·HARD. 후보는 실제 다른 사장의 회사(없으면 지어낸 회사)이고, 연말 결산에서 한 번 견준다.
        이기면 자본이 bonusBp만큼 는다. 이미 골랐거나 후보가 아니거나 1분기를 넘겼으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [difficulty]
              properties:
                difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
      responses:
        '200':
          description: 고른 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/resign:
    post:
      operationId: answerResign
      summary: 연봉 때문에 사표를 들고 온 직원에게 답한다 (decisions.md 282번)
      description: |
        keep이 참이면 연봉을 두 번 올려 준 만큼(약 +21%) 올려 주고 붙잡는다(사기 +1). 거짓이면 지금 떠난다.
        답하지 않고 다음 분기를 넘기면 떠난다. 사표가 없으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { type: boolean }
      responses:
        '200':
          description: 답한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest/open:
    post:
      operationId: conveneInvestMeeting
      summary: 올해 투자 회의를 연다 (decisions.md 249번)
      description: |
        지금 배치로 직원 한마디(invest.remarks)와 리서치 팀 형광펜을 굳힌다. 그 뒤로 배치를 바꿔도 그대로라 배치를 바꿔 가며 정답을 알아낼 수 없다.
        열기 전에는 remarks가 비어 있고 형광펜도 없다. 이미 열었으면 지금 회사를 그대로 돌려준다.
        열 수 없는 회의(정했거나 돈을 굴리는 자리에 아무도 없다)면 400.
      responses:
        '200':
          description: 회의를 연 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest:
    post:
      operationId: holdInvestMeeting
      summary: 올해 투자 회의에서 고른다 (decisions.md 229번)
      description: |
        돈을 굴리는 직원마다 사장 말대로 하거나, 꼬드김에 넘어가거나, "제가 알아서 할게요" 하고 제 판단대로 한다.
        아직 회의를 열지 않았으면 지금 배치로 연 셈 친다(/api/company/invest/open).
        손익은 바로 자본에 들어가고 invest.outcome에 실린다. 이미 했거나 돈을 굴리는 자리에 아무도 없거나 고를 수 없는 것이면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [BUY, SELL, HOLD, TEAM], description: 'TEAM은 "너희가 알아서 해": 직원 한마디를 안목만큼 저울질해 사거나 판다 (decisions.md 279번)' }
                big: { type: [boolean, 'null'], description: 크게 한다(화면에서는 뺐다, 279번). 판돈 두 배, 직원이 사장 말을 안 들을 확률 1.5배. 지켜보기는 크게 할 수 없다(400) (decisions.md 260번) }
      responses:
        '200':
          description: 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/macro/open:
    post:
      operationId: conveneMacroMeeting
      summary: 올해 거시경제 회의를 연다 (decisions.md 266번)
      description: |
        지금 배치로 직원 한마디(macro.remarks)와 리서치 팀 형광펜을 굳힌다(249번과 같다). 이미 열었으면 지금 회사를 그대로 돌려준다.
        열 수 없는 회의(골랐거나 돈을 굴리는 자리에 아무도 없다)면 400.
      responses:
        '200':
          description: 회의를 연 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/macro:
    post:
      operationId: holdMacroMeeting
      summary: 올해 거시경제 회의에서 회사의 태도를 고른다 (decisions.md 266·267번)
      description: |
        공격은 그해 결산 판돈을 키우고 방어는 줄인다(폭락장에 덜 빠진다). 고르지 않고 결산하면 중립이다.
        고르면 회의가 끝나고 종목 발굴팀(낮은 확률로 섹터 데스크) 직원이 종목을 물어 올 수 있다: 물어 오면 invest.ready가 참이 되고 종목 회의가 열린다.
        아직 회의를 열지 않았으면 지금 배치로 연 셈 친다. 이미 골랐거나 없는 태도면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stance]
              properties:
                stance: { type: string, enum: [AGGRESSIVE, NEUTRAL, DEFENSIVE] }
      responses:
        '200':
          description: 고른 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/leader:
    post:
      operationId: appointLeader
      summary: 그 자리의 팀장을 정한다 (decisions.md 269번)
      description: |
        사람이 앉은 자리마다 팀장이 한 명 있다. 정하지 않았으면 그 자리에서 종합 등급이 가장 높은 사람이다.
        정한 팀장이 자리를 떠나면 지정이 풀린다. 그 자리에 앉은 직원이 아니면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desk, employeeId]
              properties:
                desk: { type: string }
                employeeId: { type: integer }
      responses:
        '200':
          description: 팀장을 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/applicants/refresh:
    post:
      operationId: refreshApplicants
      summary: 값(refreshCost)을 내고 올해 지원자를 새로 받는다
      description: |
        지금 해(year)와 올해 지금까지 새로 받은 횟수(Company.refreshes)를 싣는다.
        이미 한 새로 받기면 아무것도 하지 않고 지금 회사를 200으로 돌려준다(같은 요청이 두 번 와도 한 번만 낸다).
        아직 오지 않은 것이면 400. 돈이 모자라면 400 (decisions.md 254번).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, refreshes]
              properties:
                year: { type: integer, minimum: 1 }
                refreshes: { type: integer, minimum: 0, description: 올해 지금까지 새로 받은 횟수(Company.refreshes) }
      responses:
        '200':
          description: 새 지원자가 온 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/plays:
    get:
      operationId: getPlayLog
      summary: 관리자 플레이 기록 — 누가(익명 세션) 언제 회사를 차려 어디까지 갔는지
      description: |
        서버에 `ADMIN_TOKEN`이 설정되어 있고 `X-Admin-Token` 헤더가 같을 때만 연다 (decisions.md 46번).
        최근 접속 세션 500개와 최근에 차린 회사 500곳. 숨은 값(시드, 능력치)은 없다.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 플레이 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayLog' }
        '403':
          description: 관리자 토큰이 없거나 틀림 (`ADMIN_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Company:
      type: object
      description: 회사 화면의 값. 올해 시장 갈래는 숨은 값이라 조짐만 담는다. 직원 능력치는 등급만.
      required: [companyId, status, number, era, year, quarter, capital, grade, seats, employees, desks, applicants, refreshCost, refreshes, history]
      properties:
        companyId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED], description: ENDED는 매각을 빼기 전(236번)에 팔린 회사. 시대가 끝나 멈췄던 회사는 다시 열면 ACTIVE로 이어진다 }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era:
          type: object
          description: 지금 시대 (9.4절). 시대는 세 해마다 다른 시대로 바뀐다 (decisions.md 250번)
          required: [code, name, description]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string }
        opening: { type: [string, 'null'], description: 회사를 차릴 때의 한 줄 }
        year: { type: integer, description: 지금 해(1부터). 회사는 끝나지 않고 해마다 이어진다 (decisions.md 236번) }
        quarter: { type: integer, minimum: 1, maximum: 4, description: 지금 분기. 턴 하나가 한 분기다 (decisions.md 268번) }
        lastQuarter:
          description: 올해 마지막으로 넘긴 분기의 실적. 1분기를 넘기기 전이면 null (268번)
          oneOf:
