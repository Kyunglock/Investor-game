openapi: 3.1.0
info:
  title: Investor Game API
  version: 0.3.0
  description: |
    클라이언트와 서버의 계약. 통합 담당만 수정한다 (architecture.md 8절).
    클라이언트 타입은 `web`에서 `pnpm gen:api`로 생성한다.
    규칙 정보(확률, 숨은 방향, 변동 폭, 시드)는 응답에 담지 않는다. 증권사(회사·공채 시장·배치·투자 회의·결산)의 API다.
    회사 매각은 뺐다 (decisions.md 236번).
    3분 육성 판은 없앴다 (decisions.md 228번).
servers:
  - url: /
paths:
  /api/sessions:
    post:
      operationId: ensureSession
      summary: 익명 세션을 확보한다
      description: 유효한 세션 쿠키가 있으면 그대로 두고, 없으면 새 세션을 발급해 `IG_SESSION` 쿠키로 준다.
      responses:
        '204':
          description: 세션이 준비됨
  /api/company:
    get:
      operationId: getCompany
      summary: 세션의 가장 최근 회사 (증권사 육성 설계 4·6절)
      responses:
        '200':
          description: 돌고 있거나 끝난 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: openCompany
      summary: 사장의 사재로 회사를 차린다 (decisions.md 228·247번)
      description: |
        직원 없이 열리고 첫 해 공채 시장에 지원자가 와 있다. 이미 회사가 있으면 400(회사는 세션마다 하나).
        가장 최근 회사가 망했으면(broke가 있으면) 그 회사를 닫고 다음 번호의 회사를 새로 차린다. 직원은 쉬는 채로 모두 따라온다 (decisions.md 265번).
      responses:
        '201':
          description: 새 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /api/company/draws:
    post:
      operationId: drawEmployees
      summary: 채용권으로 count명을 뽑는다 (decisions.md 312번)
      description: |
        채용권 한 장에 한 명이 쉬는 채로 온다. 돈은 들지 않는다. 등급은 회사 등급(인사팀이 있으면 더 높게)을 중심으로 한 확률표대로다.
        요청에 지금까지 뽑은 횟수(draws)를 싣는다: 이미 한 뽑기면 아무것도 하지 않고 지금 회사를 돌려주고, 아직 오지 않은 것이면 400.
        채용권이나 데리고 있을 자리(100명)가 모자라거나 한 번에 maxDraws를 넘으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count, draws]
              properties:
                count: { type: integer, minimum: 1 }
                draws: { type: integer, minimum: 0, description: 지금까지 뽑은 횟수(Company.gacha.draws) }
      responses:
        '200':
          description: 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/release:
    post:
      operationId: releaseEmployee
      summary: 직원을 내보낸다 (decisions.md 312번)
      description: 데리고 있을 자리를 비운다. 명예의 전당과 연표에 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId: { type: integer }
      responses:
        '200':
          description: 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/placement:
    post:
      operationId: placeEmployees
      summary: 직원을 자리에 앉힌다. 사장은 배치만 한다
      description: 자리 수를 넘거나, 없는 직원·자리이거나, 같은 직원이 두 번 오면 400 (decisions.md 254번).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: array
                  items:
                    type: object
                    required: [employeeId]
                    properties:
                      employeeId: { type: integer }
                      desk: { type: [string, 'null'], description: 자리 코드. null이면 쉰다 }
      responses:
        '200':
          description: 배치한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/settle:
    post:
      operationId: settleQuarter
      summary: 한 분기를 넘긴다. 4분기면 연말 결산을 하고 다음 해 연초 회의로 간다 (decisions.md 268번)
      description: |
        직원들이 배치대로 한 분기를 굴린 결과가 lastQuarter에 실린다.
        4분기를 넘기면 네 분기를 모은 연말 결산서가 lastSettlement에 실리고 다음 해 지원자가 온다. 회사는 끝나지 않는다(236번).
        종목 회의를 열 수 있는데(invest.ready) 안 했으면 400.
        넘길 해와 분기를 싣는다. 이미 넘긴 분기면 아무것도 하지 않고 지금 회사를 200으로 돌려준다(같은 요청이 두 번 와도 한 분기만 넘어간다).
        아직 오지 않은 분기면 400 (decisions.md 234번).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, quarter]
              properties:
                year: { type: integer, minimum: 1, description: 넘길 해. 보통 지금 해(Company.year) }
                quarter: { type: integer, minimum: 1, maximum: 4, description: 넘길 분기. 보통 지금 분기(Company.quarter) }
      responses:
        '200':
          description: 결산한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest/open:
    post:
      operationId: conveneInvestMeeting
      summary: 올해 투자 회의를 연다 (decisions.md 249번)
      description: |
        지금 배치로 직원 한마디(invest.remarks)와 리서치 팀 형광펜을 굳힌다. 그 뒤로 배치를 바꿔도 그대로라 배치를 바꿔 가며 정답을 알아낼 수 없다.
        열기 전에는 remarks가 비어 있고 형광펜도 없다. 이미 열었으면 지금 회사를 그대로 돌려준다.
        열 수 없는 회의(정했거나 돈을 굴리는 자리에 아무도 없다)면 400.
      responses:
        '200':
          description: 회의를 연 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/invest:
    post:
      operationId: holdInvestMeeting
      summary: 올해 투자 회의에서 고른다 (decisions.md 229번)
      description: |
        돈을 굴리는 직원마다 사장 말대로 하거나, 꼬드김에 넘어가거나, "제가 알아서 할게요" 하고 제 판단대로 한다.
        아직 회의를 열지 않았으면 지금 배치로 연 셈 친다(/api/company/invest/open).
        손익은 바로 자본에 들어가고 invest.outcome에 실린다. 이미 했거나 돈을 굴리는 자리에 아무도 없거나 고를 수 없는 것이면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { type: string, enum: [BUY, SELL, HOLD, TEAM], description: 'TEAM은 "너희가 알아서 해": 직원 한마디를 안목만큼 저울질해 사거나 판다 (decisions.md 279번)' }
                big: { type: [boolean, 'null'], description: 크게 한다(화면에서는 뺐다, 279번). 판돈 두 배, 직원이 사장 말을 안 들을 확률 1.5배. 지켜보기는 크게 할 수 없다(400) (decisions.md 260번) }
      responses:
        '200':
          description: 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/mental:
    post:
      operationId: reportMentalBattle
      summary: 이번 분기 멘탈 전투의 결과를 보낸다 (decisions.md 328번)
      description: |
        분기마다 결산 직전에 멘탈 카드를 고르고 나쁜 투자 습관(패닉셀·투매·투기·손절매)을 쏘아 물리치는 한 판(4분)을 치른다(앱). 레벨이 오를 때마다 카드를 한 장 더 고른다(330번). 한 판은 화면이 돌리고,
        서버는 물리친 적과 남은 멘탈을 상한으로 잘라 강화율을 매긴다. 강화율만큼 그 분기 돈을 굴리는 직원 모두 더 벌고 손이 덜 뒤집힌다.
        이미 보냈으면 아무것도 하지 않고 지금 회사를 돌려준다(같은 요청이 두 번 와도 한 번만). 이번 분기가 아니거나 없는 카드면 400.
        치르지 않고 분기를 넘겨도 된다: 강화가 없을 뿐이다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, quarter, cards, kills, mentalLeft]
              properties:
                year: { type: integer, minimum: 1, description: 지금 해(Company.year) }
                quarter: { type: integer, minimum: 1, maximum: 4, description: 지금 분기(Company.quarter) }
                cards:
                  type: array
                  minItems: 1
                  description: 고른 멘탈 카드, 고른 순서대로. 처음 한 장 + 레벨이 오를 때마다 한 장 (330번)
                  items: { type: string, enum: [hold, split, rule, steel, calm, heal], description: 존버 정신·총알 강화·원칙 매매·강철 멘탈·냉정함·심호흡 }
                kills: { type: integer, minimum: 0, description: 물리친 적 수 }
                mentalLeft: { type: integer, minimum: 0, description: 끝날 때 남은 멘탈 }
      responses:
        '200':
          description: 결과를 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/weapon:
    post:
      operationId: equipWeapon
      summary: 가진 무기 가운데 하나를 든다 (decisions.md 346번)
      description: |
        무기는 멘탈 전투에서 드는 총이다. 종류(권총·리볼버·기관단총·산탄총·소총)와 등급(N·R·SR·UR)이 있고, 무기 뽑기로 얻는다(366번).
        든 무기의 수치가 다음 판의 바탕 수치(공격력·연사·탄 강화 단계·탄 속도)가 된다. 없는 종류·등급이거나 안 가진 무기면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, grade]
              properties:
                kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                grade: { type: string, enum: [N, R, SR, UR] }
      responses:
        '200':
          description: 무기를 든 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/stage:
    post:
      operationId: reportStage
      summary: 멘탈 스테이지 한 판의 결과를 보낸다 (decisions.md 369번)
      description: |
        열린 스테이지(1 ~ 깬 최고 + 1)만 받는다. 깼으면 처음이면 자본(번호 × 1b)과 무기 뽑기권(보스면 3장), 별을 처음 얻을 때마다 뽑기권 한 장.
        못 깼으면 보상 없이 결과만 남는다. 결과는 stages.lastResult에 담긴다. 아직 안 열린 스테이지면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, cleared, stars]
              properties:
                stage: { type: integer, minimum: 1 }
                cleared: { type: boolean }
                stars: { type: integer, minimum: 0, maximum: 3 }
      responses:
        '200':
          description: 결과를 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/ex:
    post:
      operationId: reportEx
      summary: EX 디펜스 한 판의 결과를 보낸다 (decisions.md 369번)
      description: 분기에 한 번 무기 뽑기권 1 + 물리친 적 40마다 한 장(최대 3장). 이번 분기에 이미 했으면 그대로 둔다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kills]
              properties:
                kills: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 결과를 받은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/battle-upgrade:
    post:
      operationId: buyBattleUpgrade
      summary: 자본으로 전투 강화 한 단계를 산다 (decisions.md 367번)
      description: |
        데미지(+10%)·연사(쏘는 간격 −5%)·고양이 속도(+8%)를 한 단계씩, 10단계까지. 값은 1b부터 단계마다 2배.
        쓴 돈은 분기 실적·결산서에 전투 강화 비용으로 따로 적는다. 자본이 모자라거나 다 올렸으면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [damage, fire, speed] }
      responses:
        '200':
          description: 산 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/weapon/draw:
    post:
      operationId: drawWeapon
      summary: 무기 뽑기권 한 장으로 무기 하나를 뽑는다 (decisions.md 366번)
      description: |
        등급은 N 60·R 30·SR 9·UR 1의 가중치로, 종류는 고르게 뽑는다. 이미 가진 종류·등급이면 그 무기의 수가 하나 늘어 무기 합성 재료가 된다.
        결과는 armory.lastDraw에 담긴다. 뽑기권이 없으면 400.
      responses:
        '200':
          description: 뽑은 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/weapon/merge:
    post:
      operationId: mergeWeapon
      summary: 같은 무기 여럿을 합쳐 한 등급 올린다 (decisions.md 366번)
      description: |
        같은 종류·등급의 무기 armory.mergeCount개를 합쳐 한 등급 위의 같은 종류 하나로 만든다. 들고 있던 무기를 다 썼으면 합친 무기를 든다.
        모자라거나 가장 높은 등급(UR)이면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, grade]
              properties:
                kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                grade: { type: string, enum: [N, R, SR] }
      responses:
        '200':
          description: 합친 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/scout:
    post:
      operationId: scoutStock
      summary: 분기 넘기기를 누르면 직원이 종목을 물어 온다 (decisions.md 267·382번)
      description: |
        지금 배치로 한 분기에 한 번 굴린다: 종목 발굴팀(낮은 확률로 섹터 데스크) 직원이 종목을 물어 오면 invest.ready가 참이 되고 종목 회의가 열린다.
        아무도 안 왔으면 그대로 분기를 넘기면 된다. 이미 굴렸거나 돈을 굴리는 자리에 아무도 없으면 아무것도 하지 않고 지금 회사를 돌려준다.
        거시경제 회의(266번)는 382번에서 뺐다.
      responses:
        '200':
          description: 굴린 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/company/upgrade:
    post:
      operationId: upgradeBuilding
      summary: 이사 비용을 내고 다음 건물로 간다 (decisions.md 296번)
      description: |
        건물(회사 등급)은 저절로 오르지 않는다. 자본이 다음 띠 + 이사 비용(다음 띠 자본의 25%) 이상이면 비용을 내고 올라간다. 자리 수와 규모의 벽은 바로
        새 건물로 바뀐다. 랜드마크 타워에 오르면 엔딩이다. 돈이 모자라거나 끝 등급이면 400.
      responses:
        '200':
          description: 이사한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400':
          description: 돈이 모자라거나 끝 등급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 세션 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/company/leader:
    post:
      operationId: appointLeader
      summary: 그 자리의 팀장을 정한다 (decisions.md 269번)
      description: |
        사람이 앉은 자리마다 팀장이 한 명 있다. 정하지 않았으면 그 자리에서 종합 등급이 가장 높은 사람이다.
        정한 팀장이 자리를 떠나면 지정이 풀린다. 그 자리에 앉은 직원이 아니면 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desk, employeeId]
              properties:
                desk: { type: string }
                employeeId: { type: integer }
      responses:
        '200':
          description: 팀장을 정한 뒤의 회사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/plays:
    get:
      operationId: getPlayLog
      summary: 관리자 플레이 기록 — 누가(익명 세션) 언제 회사를 차려 어디까지 갔는지
      description: |
        서버에 `ADMIN_TOKEN`이 설정되어 있고 `X-Admin-Token` 헤더가 같을 때만 연다 (decisions.md 46번).
        최근 접속 세션 500개와 최근에 차린 회사 500곳. 숨은 값(시드, 능력치)은 없다.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 플레이 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayLog' }
        '403':
          description: 관리자 토큰이 없거나 틀림 (`ADMIN_REQUIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Company:
      type: object
      description: 회사 화면의 값. 올해 시장 갈래는 숨은 값이라 조짐만 담는다. 직원 능력치는 등급만.
      required: [companyId, status, number, era, year, quarter, capital, grade, seats, employees, desks, gacha, history]
      properties:
        companyId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED], description: ENDED는 매각을 빼기 전(236번)에 팔린 회사. 시대가 끝나 멈췄던 회사는 다시 열면 ACTIVE로 이어진다 }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era:
          type: object
          description: 지금 시대 (9.4절). 시대는 세 해마다 다른 시대로 바뀐다 (decisions.md 250번)
          required: [code, name, description]
          properties:
            code: { type: string }
            name: { type: string }
            description: { type: string }
        opening: { type: [string, 'null'], description: 회사를 차릴 때의 한 줄 }
        year: { type: integer, description: 지금 해(1부터). 회사는 끝나지 않고 해마다 이어진다 (decisions.md 236번) }
        quarter: { type: integer, minimum: 1, maximum: 4, description: 지금 분기. 턴 하나가 한 분기다 (decisions.md 268번) }
        lastQuarter:
          description: 올해 마지막으로 넘긴 분기의 실적. 1분기를 넘기기 전이면 null (268번)
          oneOf:
            - $ref: '#/components/schemas/Quarter'
            - type: 'null'
        capital: { type: integer, format: int64 }
        grade: { $ref: '#/components/schemas/Grade' }
        nextGradeCapital: { type: [integer, 'null'], format: int64, description: 다음 띠의 자본. 끝 등급이면 null }
        upgrade:
          description: 건물 이사 (decisions.md 296번). 다음 건물로 가는 데 드는 돈. 끝 등급이거나 끝난 회사면 null
          oneOf:
            - type: object
              required: [to, cost, needed, affordable, years, left]
              properties:
                to: { $ref: '#/components/schemas/Grade' }
                cost: { type: integer, format: int64, description: 이사 비용(다음 띠 자본의 15%). 공사 중이면 0 }
                needed: { type: integer, format: int64, description: 이사하려면 있어야 하는 자본(다음 띠 + 이사 비용). 공사 중이면 0 }
                affordable: { type: boolean }
                years: { type: integer, description: 그 건물을 짓는 데 걸리는 해 (#347). 같은 건물 안에서 책상만 늘면 0(바로 된다) }
                left: { type: [integer, 'null'], description: 공사 중이면 남은 해, 아니면 null (#347) }
            - type: 'null'
        broke: { type: [string, 'null'], description: 망한 회사의 한 줄. 자본이 0이면 있고, 그때 사재로 다음 회사를 차릴 수 있다 (decisions.md 247번) }
        seats: { type: integer }
        employees:
          type: array
          items:
            type: object
            required: [id, name, overallGrade, grades, experience, effects, perk, deskYears, settled, leader, morale]
            properties:
              id: { type: integer }
              name: { type: string }
              overallGrade:
                $ref: '#/components/schemas/Grade'
                description: SSS면 실전 경험으로 X~ZZZ, 그 위 XS·XSS·GOD까지 오른다 (2.3절, decisions.md 289번)
              experience: { type: integer, description: 실전 경험. 폭락장을 손실 없이 버틸 때 쌓인다 }
              experienceNeeded: { type: [integer, 'null'], description: 다음 단계까지 드는 실전 경험. SSS가 아니면 null }
              effects:
                type: array
                description: X 이상 등급의 효과 이름(확신·경보·역발상·리더·사수·선견·큰손·철벽·신의 손). 쌓인다 (2.4절)
                items: { type: string }
              perk: { type: string, description: '등급 효과 한 줄: 이름·맞혔을 때 더 버는 몫·자랄 확률 (decisions.md 289번)' }
              grades: { type: object, additionalProperties: { $ref: '#/components/schemas/Grade' } }
              desk: { type: [string, 'null'] }
              sector: { type: [string, 'null'], description: 관심 섹터 코드. 같은 섹터 데스크에 앉으면 조금 더 번다 }
              sectorName: { type: [string, 'null'] }
              deskYears: { type: integer, description: 지금 자리에서 결산을 맞은 해 수 (decisions.md 262번) }
              settled: { type: boolean, description: 올해 결산이 같은 자리 세 해째 이상이라 손이 덜 뒤집힌다 }
              leader: { type: boolean, description: 앉은 자리의 팀장이다 (decisions.md 269번) }
              morale: { type: integer, minimum: -2, maximum: 2, description: 사기. 낮으면 손이 더 뒤집힌다 (270번) }
              quirk: { type: string, enum: [gut, chat, chart, news, coffee], description: 버릇 (decisions.md 349번). 번호로 정해져 바뀌지 않고 첫인사 문구가 이를 따른다 }
              quirkName: { type: string, description: 버릇 이름(촉파·단톡방파·차트파·뉴스파·커피파) }
              role: { type: [string, 'null'], description: 앉은 자리의 직함(애널리스트·종목 발굴 담당…). 직함이 없는 자리거나 쉬면 null (decisions.md 267번) }
        desks:
          type: array
          items:
            type: object
            required: [code, name, statCode, trades, hot, description]
            properties:
              code: { type: string }
              name: { type: string }
              statCode: { type: string }
              trades: { type: boolean, description: 거짓이면 돈을 굴리지 않고 다른 자리를 돕는다 }
              sector: { type: [string, 'null'], description: 섹터 데스크면 그 섹터 코드. 섹터를 가리지 않는 자리면 null }
              hot: { type: boolean, description: 이 시대에 뜨는 자리(시대 보너스가 붙는다, 9.4절) }
              description: { type: string }
              gainBp: { type: [integer, 'null'], description: 맞혔을 때 버는 몫(만분율, 시대 보너스 포함). 돈을 굴리지 않으면 null (decisions.md 259번) }
              missBp: { type: [integer, 'null'], description: 틀렸을 때 잃는 몫(만분율). 돈을 굴리지 않으면 null }
              crashPercent: { type: [integer, 'null'], description: 폭락장의 시장 손익에 곱하는 비율. 100보다 작으면 폭락장에 덜 빠진다. 돈을 굴리지 않으면 null }
              unlockGrade: { type: [string, 'null'], description: 이 자리가 열린 회사 등급 (#393). 처음부터 열려 있었으면 null }
        lockedDesks:
          description: 아직 닫힌 돕는 자리 (#393). 회사가 unlockGrade가 되면 열려 desks에 들어간다
          type: array
          items:
            type: object
            required: [code, name, description, unlockGrade]
            properties:
              code: { type: string }
              name: { type: string }
              description: { type: string }
              unlockGrade: { $ref: '#/components/schemas/Grade' }
        meeting:
          oneOf:
            - type: object
              required: [wanted]
              properties:
                omen: { type: [string, 'null'], description: 폭락 조짐. 헛조짐일 수도 있다 }
                hrCap:
                  description: 인사팀에 사람이 있으면 지원자 등급의 중심이 오를 수 있는 곳(인사 직원보다 두 단계 아래). 없으면 null (6.3절)
                  oneOf: [{ $ref: '#/components/schemas/Grade' }, { type: 'null' }]
                earlyOmen: { type: [string, 'null'], description: XX 경보. 내년 폭락 조짐 한 줄 }
                forecast: { type: [string, 'null'], description: ZZZ 선견. 내년 시장 한 줄 }
                wanted: { type: string }
                hot: { type: [string, 'null'], description: 이번 시대에 뜨는 섹터 한 줄. 뜨는 섹터가 없는 시대면 null (9.4절) }
                eraEnding: { type: [string, 'null'], description: 지금 시대의 마지막 해면 "내년에는 시대가 바뀐다" 한 줄. 아니면 null (decisions.md 250번) }
            - type: 'null'
        gacha:
          type: object
          description: 채용 뽑기 (decisions.md 312번). 공채 시장(지원자를 골라 계약금을 내고 뽑던 것, 228번)을 대신한다
          required: [tickets, roster, rosterMax, draws, maxDraws, rates, drawn, collection]
          properties:
            tickets: { type: integer, description: 가진 채용권. 한 장에 한 명. 회사를 차릴 때·분기·연말·업적·이사로 받고 다음 회사로 이어진다 }
            roster: { type: integer, description: 데리고 있는 사람 수(쉬는 사람 포함) }
            rosterMax: { type: integer, description: 데리고 있을 수 있는 사람 수(100명). 넘으면 내보내야 더 뽑는다 }
            draws: { type: integer, description: 지금까지 뽑은 횟수. 뽑기 요청에 싣는다 }
            maxDraws: { type: integer, description: 한 번에 뽑을 수 있는 최대 수 }
            rates:
              type: array
              description: 이 회사의 확률표. 칸마다 나오는 종합 등급과 확률. star면 특급
              items:
                type: object
                required: [grade, percent, star]
                properties:
                  grade: { $ref: '#/components/schemas/Grade' }
                  percent: { type: integer }
                  star: { type: boolean }
            drawn:
              type: array
              description: 마지막 뽑기에서 온 사람. 분기를 넘기면 비운다. 화면이 카드를 뒤집어 보인다
              items:
                type: object
                required: [employeeId, name, grade, star, fresh]
                properties:
                  employeeId: { type: integer }
                  name: { type: string }
                  grade: { $ref: '#/components/schemas/Grade' }
                  star: { type: boolean, description: 특급 칸에서 나왔다 }
                  fresh: { type: boolean, description: 도감에 처음 오른 등급이다 }
                  hello: { type: [string, 'null'], description: 첫인사 (349번). 버릇대로 한마디. 옛 뽑기면 null }
            collection:
              type: array
              description: 도감. 등급(F~GOD)마다 뽑아서 얻은 사람 수. 사장의 것이라 다음 회사로 이어진다
              items:
                type: object
                required: [grade, count]
                properties:
                  grade: { $ref: '#/components/schemas/Grade' }
                  count: { type: integer }
        history:
          type: object
          description: 회사 연표·업적·명예의 전당 (decisions.md 263번)
          required: [timeline, achievements, hall]
          properties:
            timeline:
              type: array
              description: 큰 일, 오래된 것부터
              items:
                type: object
                required: [year, kind]
                properties:
                  year: { type: integer }
                  kind: { type: string, enum: [open, grow, shrink, era, overtake, rise, left, best, worst, target, ending] }
                  text: { type: [string, 'null'] }
                  grade:
                    description: grow·shrink의 새 등급. 화면이 건물 이름으로 바꾼다
                    oneOf: [{ $ref: '#/components/schemas/Grade' }, { type: 'null' }]
            achievements:
              type: array
              description: 모든 업적. year가 없으면 아직 못 열었다
              items:
                type: object
                required: [code, name, description, fail]
                properties:
                  code: { type: string }
                  name: { type: string }
                  description: { type: string }
                  year: { type: [integer, 'null'] }
                  fail: { type: boolean, description: 실패 업적 (decisions.md 351번). 망한 판도 즐겁게. 열리면 채용권은 위로 보상 한 장 }
            hall:
              type: array
              description: 이 회사에서 가장 많이 번 사람부터(지금 직원과 떠난 직원), 다섯까지
              items:
                type: object
                required: [name, from, totalPnl, grade]
                properties:
                  name: { type: string }
                  from: { type: integer, description: 들어온 해. 이 기록 전에 들어왔으면 0 }
                  to: { type: [integer, 'null'], description: 떠난 해. 아직 일하면 null }
                  totalPnl: { type: integer, format: int64 }
                  grade: { $ref: '#/components/schemas/Grade' }
        invest:
          description: |
            올해 종목 회의 (decisions.md 229번). 끝난 회사나 옛 회사면 null. 숨은 방향은 정한 뒤 outcome에만 있다.
            직원이 종목을 물어 와야(finder) 열린다: 그 전에는 ready가 거짓이다 (267번). 분기 넘기기를 누르면 /api/company/scout로 물어 온다(382번)
          oneOf:
            - type: object
              required: [title, stockName, sectorName, sentences, sway, remarks, options, ready, convened, scouted]
              properties:
                title: { type: string }
                scouted: { type: boolean, description: 이번 분기에 이미 직원이 종목을 물어 왔거나 발굴을 굴렸다 (267·382번) }
                stockName: { type: string }
                sectorName: { type: string }
                sentences:
                  type: array
                  description: 단서 기사 문장. 리서치 팀이 형광펜을 그은 문장은 highlighted
                  items:
                    type: object
                    required: [text, highlighted]
                    properties:
                      text: { type: string }
                      highlighted: { type: boolean }
                highlightBy: { type: [string, 'null'], description: 형광펜을 그은 리서치 팀 직원 }
                sway:
                  type: object
                  required: [who, text]
                  properties:
                    who: { type: string, description: 꼬드기는 단골 인물 }
                    text: { type: string }
                remarks:
                  type: array
                  description: 자리에 앉은 직원의 한마디. 회의를 열기 전에는 비어 있다
                  items:
                    type: object
                    required: [employeeId, name, desk, read, text]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      read: { type: string, enum: [UP, DOWN, NEUTRAL] }
                      text: { type: string }
                      stubborn:
                        type: [string, 'null']
                        enum: [LOW, MID, HIGH, null]
                        description: 돈을 굴리는 직원이 제멋대로 할 낌새. 돈을 굴리지 않으면 null
                options:
                  type: array
                  items:
                    type: object
                    required: [code, label]
                    properties:
                      code: { type: string, enum: [BUY, SELL, HOLD, TEAM] }
                      label: { type: string }
                ready: { type: boolean, description: 지금 정할 수 있다(정하지 않았고 돈을 굴리는 자리에 사람이 있다) }
                convened: { type: boolean, description: 회의를 열어 한마디와 형광펜을 굳혔다. 그 뒤로 배치를 바꿔도 그대로다 (decisions.md 249번) }
                team:
                  description: 회의에 앉은 팀의 합산 등급 (decisions.md 353번). 앉은 사람이 없으면 null
                  oneOf:
                    - type: object
                      required: [grade, score, hint, members]
                      properties:
                        grade: { $ref: '#/components/schemas/Grade' }
                        score: { type: integer, description: 0~100 }
                        hint: { type: string, description: 한 줄 풀이 }
                        members: { type: integer, description: 앉은 사람 수 }
                    - type: 'null'
                teamBuy: { type: [integer, 'null'], description: 토론에서 매수 쪽에 얹힌 무게(직원 안목, 352번). 회의를 열기 전이면 null }
                teamSell: { type: [integer, 'null'], description: 토론에서 매도 쪽에 얹힌 무게. 회의를 열기 전이면 null }
                teamCall: { type: [string, 'null'], enum: [BUY, SELL, null], description: 토론 뒤 직원들이 기운 쪽 (decisions.md 352번). 사장은 그 뒤에 고른다. 회의를 열기 전이면 null }
                debate:
                  type: array
                  description: 회의를 열면 먼저 오가는 매수파·매도파의 토론 (352번). 결정 전에 본다. 회의를 열기 전이면 비어 있다
                  items:
                    type: object
                    required: [name, side, text, last, kind]
                    properties:
                      name: { type: string }
                      side: { type: string, enum: [BUY, SELL] }
                      text: { type: string }
                      last: { type: boolean }
                      kind: { type: string, enum: [TALK, TALLY, WIN, LOSE] }
                finder:
                  description: 이 종목을 물어 온 직원 (267번). 아직 아무도 안 가져왔거나 옛 회의면 null
                  oneOf:
                    - $ref: '#/components/schemas/Finder'
                    - type: 'null'
                outcome:
                  oneOf:
                    - type: object
                      required: [choice, big, delegated, teamBuy, teamSell, debate, up, reveal, decisive, total, results]
                      properties:
                        choice: { type: string, enum: [BUY, SELL, HOLD], description: 정한 것. 맡겼으면 직원들이 정한 쪽 }
                        big: { type: boolean, description: 크게 했다 (decisions.md 260번) }
                        delegated: { type: boolean, description: 사장이 "너희가 알아서 해" 하고 맡겼다 (decisions.md 279번) }
                        teamBuy: { type: integer, description: 맡겼을 때 매수 쪽에 얹힌 무게(직원 안목). 맡기지 않았으면 0 }
                        teamSell: { type: integer, description: 매도 쪽 무게 }
                        debate:
                          type: array
                          description: 맡겼을 때 매수파·매도파가 주고받은 말 (decisions.md 285번). 맡기지 않았으면 비었다
                          items:
                            type: object
                            required: [name, side, text, last, kind]
                            properties:
                              name: { type: string }
                              side: { type: string, enum: [BUY, SELL] }
                              text: { type: string }
                              last: { type: boolean, description: 결판의 세 박자(표결·선언·승복)면 참 (295번) }
                              kind: { type: string, enum: [TALK, TALLY, WIN, LOSE], description: 'TALK: 토론, TALLY: 사회가 무게를 읽으며 표결을 부른다, WIN: 이긴 쪽 선언, LOSE: 진 쪽이 토를 달고 물러난다 (295번)' }
                        missed: { type: [integer, 'null'], format: int64, description: 지켜봤을 때 맞는 쪽으로 했으면 벌었을 돈(뒤집힘 없이). 지켜보지 않았으면 null }
                        up: { type: boolean }
                        reveal: { type: string }
                        decisive: { type: integer, description: 결정적 문장의 번호(sentences 안) }
                        total: { type: integer, format: int64, description: 회의 손익. 이미 자본에 들어갔다 }
                        reactions:
                          type: array
                          description: 결과가 드러난 뒤 양쪽의 반응 (decisions.md 358번). 맞힌 쪽(kind WIN)과 틀린 쪽(LOSE)이 한마디씩. 토론이 없던 옛 회의면 비어 있다
                          items:
                            type: object
                            required: [name, side, text, last, kind]
                            properties:
                              name: { type: string }
                              side: { type: string, enum: [BUY, SELL] }
                              text: { type: string }
                              last: { type: boolean }
                              kind: { type: string, enum: [TALK, TALLY, WIN, LOSE] }
                        credit: { type: [string, 'null'], description: 물어 온 직원을 칭찬하거나 탓하는 한 줄 (267번). 옛 회의면 null }
                        results:
                          type: array
                          items:
                            type: object
                            required: [employeeId, name, desk, action, follow, pnl, line]
                            properties:
                              employeeId: { type: integer }
                              name: { type: string }
                              desk: { type: string }
                              action: { type: string, enum: [BUY, SELL, HOLD] }
                              follow:
                                type: string
                                enum: [BOSS, OWN, SWAY]
                                description: 사장 말대로·제 판단대로("제가 알아서 할게요")·꼬드김
                              pnl: { type: integer, format: int64 }
                              line: { type: string }
                              rival:
                                description: |
                                  사장 말과 맞붙은 행동: 일어난 쪽(꼬드김·제 판단), 사장 말대로 했으면 먼저 굴린 꼬드김부터 사장과 다른 것.
                                  맞붙을 것이 없었으면 null. 회의 창의 맞대결 막대가 쓴다 (decisions.md 235번)
                                oneOf:
                                  - type: object
                                    required: [kind, action, stat]
                                    properties:
                                      kind: { type: string, enum: [SWAY, OWN], description: 꼬드김·제 판단 }
                                      action: { type: string, enum: [BUY, SELL, HOLD] }
                                      stat: { type: string, description: 사장 쪽을 지킨 능력치 코드(꼬드김이면 conviction) }
                                  - type: 'null'
                    - type: 'null'
            - type: 'null'
        lastSettlement:
          oneOf:
            - type: object
              required: [year, phase, capitalBefore, capitalAfter, fee, hiring, moving, upgrades, rewards, quarters, gradeBefore, gradeAfter, achieved, results, lines, reports]
              properties:
                year: { type: integer }
                phase: { type: string, enum: [boom, normal, crash] }
                omen: { type: [string, 'null'] }
                capitalBefore: { type: integer, format: int64, description: 연초 회의 때의 자본 (decisions.md 251번) }
                capitalAfter: { type: integer, format: int64 }
                fee: { type: integer, format: int64, description: 수수료 매출 }
                hiring: { type: integer, format: int64, description: 그해 인사 비용(계약금·새로 받기 값. 이적료는 385번에서 이직 제안과 함께 뺐다). 연초 자본 + 회의 + 직원들 + 수수료 − 인사 비용 − 이사 비용 = 연말 자본 (251·296번) }
                moving: { type: integer, format: int64, description: 그해 낸 이사 비용 (296번) }
                upgrades: { type: integer, format: int64, description: 그해 전투 강화에 쓴 돈 (decisions.md 367번) }
                rewards: { type: integer, format: int64, description: 그해 스테이지 보상으로 받은 자본 (decisions.md 369번) }
                invest:
                  description: 그해 투자 회의(기사 제목과 손익, 이미 자본에 들어갔다). 회의를 안 했거나 옛 결산이면 null (decisions.md 240번)
                  oneOf:
                    - type: object
                      required: [title, total]
                      properties:
                        title: { type: string }
                        total: { type: integer, format: int64 }
                    - type: 'null'
                quarters:
                  type: array
                  description: 그해 네 분기의 실적 (decisions.md 268번). 분기 결산 전의 옛 결산이면 비어 있다
                  items: { $ref: '#/components/schemas/Quarter' }
                gradeBefore: { $ref: '#/components/schemas/Grade' }
                gradeAfter: { $ref: '#/components/schemas/Grade' }
                achieved:
                  type: array
                  description: 그해 연 업적 이름 (decisions.md 263번)
                  items: { type: string }
                results:
                  type: array
                  items:
                    type: object
                    required: [employeeId, name, desk, stake, pnl, flips]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      stake: { type: integer, format: int64 }
                      pnl: { type: integer, format: int64 }
                      flips: { type: object, additionalProperties: { type: integer } }
                lines: { type: array, items: { type: string } }
                reports:
                  type: array
                  description: 팀장들의 한 해 보고 (decisions.md 269번)
                  items: { $ref: '#/components/schemas/Report' }
            - type: 'null'
        industry:
          description: 업계 순위 (#351). 실제 유저 회사끼리 같은 연차의 연말 자본으로 견준다. 이름은 없다. 한 해도 마치지 않았으면 null
          oneOf:
            - type: object
              required: [year, rank, total]
              properties:
                year: { type: integer, description: 견준 연차(지난 연말) }
                rank: { type: integer, description: 그 연차를 마친 회사 가운데 자리(1이 맨 위) }
                total: { type: integer, description: 그 연차를 마친 회사 수 }
        mental:
          description: 이번 분기의 멘탈 전투 (decisions.md 328번). 그 분기 이벤트가 장르를 정한다. 끝난 회사나 이 칸이 생기기 전의 분기면 null
          oneOf:
            - type: object
              required: [genre, headline, done]
              properties:
                genre: { type: string, enum: [ASSAULT, DEFENSE], description: 'ASSAULT: 공격(적이 위에서 내려온다), DEFENSE: 디펜스(금고를 지킨다)' }
                headline: { type: string, description: 이벤트 머리글 }
                done: { type: boolean, description: 이번 분기 결과를 이미 보냈다 }
            - type: 'null'
        weapons:
          description: 가진 무기 (decisions.md 346번). 수치는 등급을 더한 최종값으로 한 판의 바탕 수치다. 처음엔 일반 권총 하나
          type: array
          items:
            type: object
            required: [kind, name, grade, gradeName, damagePercent, fireMs, power, bulletSpeed, equipped, count]
            properties:
              kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
              name: { type: string }
              grade: { type: string, enum: [N, R, SR, UR] }
              gradeName: { type: string }
              damagePercent: { type: integer, description: 탄 하나의 공격력(%). 100이 적 체력 1 }
              fireMs: { type: integer, description: 연사 간격(ms) }
              power: { type: integer, description: "탄 강화 단계(0~3). 탄은 항상 한 줄이고, 2단계부터 맞으면 주변 적도 휘말린다 (decisions.md 362번)" }
              bulletSpeed: { type: integer, description: 탄 속도(px/s) }
              equipped: { type: boolean, description: 지금 든 무기 }
              count: { type: integer, description: "가진 수 (decisions.md 366번). 같은 무기를 또 뽑으면 늘고, armory.mergeCount개면 합쳐 한 등급 올린다" }
        stages:
          description: 멘탈 스테이지 (decisions.md 369번). 번호 스테이지를 골라 전진 모드로 깬다. 분기 강화율은 깬 최고 스테이지로 매 분기 저절로 붙는다
          type: object
          required: [best, last, perChapter, stars, bonusPercent, exAvailable, lastResult]
          properties:
            best: { type: integer, description: 깬 최고 스테이지(0이면 아직 없다). 다음에 열리는 것은 best + 1 }
            last: { type: integer, description: 마지막 스테이지(지금은 챕터 하나) }
            perChapter: { type: integer, description: 한 챕터의 스테이지 수. 챕터 마지막은 보스 }
            stars: { type: array, items: { type: integer }, description: 깬 스테이지의 별(1~3), 1번부터 차례로 }
            bonusPercent: { type: integer, description: 이번 분기 강화율(%) }
            exAvailable: { type: boolean, description: 이번 분기 EX 디펜스를 아직 안 했다 }
            lastResult:
              description: 마지막으로 보낸 스테이지·EX 결과와 받은 보상. 없으면 null
              oneOf:
                - type: object
                  required: [stage, cleared, stars, firstClear, capital, tickets]
                  properties:
                    stage: { type: integer, description: 스테이지 번호. EX 디펜스면 0 }
                    cleared: { type: boolean }
                    stars: { type: integer }
                    firstClear: { type: boolean, description: 이 판에 처음 깼다 }
                    capital: { type: integer, format: int64, description: 받은 자본 }
                    tickets: { type: integer, description: 받은 무기 뽑기권 }
                - type: 'null'
        battleUpgrades:
          description: 자본으로 사는 전투 강화 (decisions.md 367번). 데미지·연사·고양이 속도, 멘탈 전투의 바탕 수치에 영구로 붙는다
          type: array
          items:
            type: object
            required: [kind, level, maxLevel, price, bonusPercent, nextBonusPercent]
            properties:
              kind: { type: string, enum: [damage, fire, speed], description: 'damage: 데미지, fire: 연사(쏘는 간격이 준다), speed: 고양이 이동 속도' }
              level: { type: integer, description: 지금 단계(0부터) }
              maxLevel: { type: integer }
              price: { type: [integer, 'null'], format: int64, description: 다음 단계 값. 다 올렸으면 null }
              bonusPercent: { type: integer, description: 지금 단계의 효과(%) }
              nextBonusPercent: { type: [integer, 'null'], description: 다음 단계의 효과(%). 다 올렸으면 null }
        armory:
          description: 무기 뽑기 (decisions.md 366번). 무기는 전투에서 떨어지지 않고 무기 뽑기권으로 뽑는다
          type: object
          required: [tickets, mergeCount, lastDraw]
          properties:
            tickets: { type: integer, description: 가진 무기 뽑기권 }
            mergeCount: { type: integer, description: 합쳐 한 등급 올리는 데 드는 같은 무기 수 }
            lastDraw:
              description: 마지막으로 뽑은 무기. 뽑은 적이 없으면 null
              oneOf:
                - type: object
                  required: [kind, name, grade, gradeName, isNew]
                  properties:
                    kind: { type: string, enum: [pistol, revolver, smg, shotgun, rifle] }
                    name: { type: string }
                    grade: { type: string, enum: [N, R, SR, UR] }
                    gradeName: { type: string }
                    isNew: { type: boolean, description: 새로 얻었다. 이미 가진 종류·등급이면 거짓(그 무기의 수가 하나 는다) }
                - type: 'null'
    Quarter:
      type: object
      description: 분기 하나의 실적 (decisions.md 268번)
      required: [year, quarter, capitalBefore, capitalAfter, fee, staff, hiring, moving, upgrades, rewards, crash, lines, reports]
      properties:
        year: { type: integer }
        quarter: { type: integer }
        capitalBefore: { type: integer, format: int64 }
        capitalAfter: { type: integer, format: int64 }
        fee: { type: integer, format: int64, description: 수수료 매출(한 해 몫의 4분의 1) }
        staff: { type: integer, format: int64, description: 직원들이 이 분기에 굴린 몫 }
        hiring: { type: integer, format: int64, description: 이 분기에 낸 인사 비용(계약금·새로 받기 값). 시작 자본 + 회의 + 직원들 + 수수료 − 인사 비용 − 이사 비용 = 끝 자본 }
        moving: { type: integer, format: int64, description: 이 분기에 낸 이사 비용 (296번) }
        upgrades: { type: integer, format: int64, description: 이 분기에 전투 강화에 쓴 돈 (decisions.md 367번) }
        rewards: { type: integer, format: int64, description: 이 분기에 스테이지 보상으로 받은 자본 (decisions.md 369번) }
        invest:
          description: 이 분기 종목 회의(기사 제목과 손익). 안 열렸으면 null
          oneOf:
            - type: object
              required: [title, total]
              properties:
                title: { type: string }
                total: { type: integer, format: int64 }
            - type: 'null'
        crash: { type: boolean, description: 이 분기에 폭락이 터졌다 }
        lines: { type: array, items: { type: string } }
        reports:
          type: array
          description: 팀장 보고. 사람이 앉은 자리마다 한 줄 (decisions.md 269번)
          items: { $ref: '#/components/schemas/Report' }
    Report:
      type: object
      description: 팀장 보고 한 줄 (decisions.md 269번)
      required: [desk, deskName, leaderId, leader, head, text]
      properties:
        desk: { type: string }
        deskName: { type: string }
        leaderId: { type: integer }
        leader: { type: string }
        head: { type: string, description: '보고자: "반도체 데스크 팀장 박한결"' }
        pnl: { type: [integer, 'null'], format: int64, description: 돈을 굴리는 팀의 손익. 돕는 팀이면 null }
        text: { type: string }
    Finder:
      type: object
      description: 종목을 물어 온 직원 (decisions.md 267번)
      required: [employeeId, name, desk, pitch]
      properties:
        employeeId: { type: integer }
        name: { type: string }
        role: { type: [string, 'null'], description: 직함. 직함이 없는 자리면 null }
        desk: { type: string }
        pitch: { type: string, description: 가져올 때 한마디 }
    Grade:
      type: string
      description: 회사 등급은 F~ZZZ, 직원 등급은 그 위로 XS·XSS·GOD까지 (decisions.md 289번)
      enum: [F, E, D, C, B, A, S, SS, SSS, X, XX, XXX, Z, ZZ, ZZZ, XS, XSS, GOD]
    PlayLog:
      type: object
      required: [sessions, companies]
      properties:
        companies:
          type: array
          description: 회사. 최근에 차린 순 (decisions.md 228번)
          items: { $ref: '#/components/schemas/CompanyPlay' }
        sessions:
          type: array
          description: 마지막 접속이 최근인 순
          items: { $ref: '#/components/schemas/PlaySession' }
    PlaySession:
      type: object
      required: [sessionId, createdAt, lastSeenAt, companies]
      properties:
        sessionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: 처음 온 시각 }
        lastSeenAt: { type: string, format: date-time, description: 마지막 접속 시각 }
        companies: { type: integer, description: 최근 회사 목록(companies) 안에서 센 회사 수 }
        firstIp: { type: [string, 'null'], description: 처음 접속한 IP (프록시 뒤면 X-Forwarded-For의 첫 주소) }
        lastIp: { type: [string, 'null'], description: 마지막 접속 IP }
    CompanyPlay:
      type: object
      required: [companyId, sessionId, status, number, era, year, settled, capital, grade, employees, sold, createdAt, updatedAt]
      properties:
        companyId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED] }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era: { type: string, description: 시대 코드 }
        year: { type: integer, description: 지금 해. 시대가 끝났으면 turns + 1 }
        settled: { type: integer, description: 결산한 해의 수 }
        capital: { type: integer, format: int64 }
        grade: { $ref: '#/components/schemas/Grade' }
        employees: { type: integer }
        sold: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Named:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SESSION_REQUIRED, NOT_FOUND, INVALID_REQUEST] }
        message: { type: string }
  responses:
    SessionRequired:
      description: 세션이 없거나 만료됨. 새로 태어나야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: 규칙에 맞지 않는 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
