              grades: { type: object, additionalProperties: { $ref: '#/components/schemas/Grade' } }
              fee: { type: integer, format: int64, description: 계약금. 뽑으면 회사 자본에서 나간다 }
              line: { type: [string, 'null'], description: 올해 필요한 인재, 사수가 붙음, 인사팀이 데려옴 }
              sector: { type: [string, 'null'], description: 관심 섹터 코드. 뽑으면 직원이 안고 들어온다 }
              sectorName: { type: [string, 'null'] }
        refreshCost: { type: integer, format: int64, description: 지원자를 새로 받는 값 }
        refreshes: { type: integer, description: 올해 지원자를 새로 받은 횟수. 새로 받기 요청에 싣는다 (decisions.md 254번) }
        history:
          type: object
          description: 회사 연표·업적·명예의 전당 (decisions.md 263번)
          required: [timeline, achievements, hall]
