openapi: 3.1.0
info:
  title: Investor Game API
  version: 0.1.0
  description: |
    클라이언트와 서버의 계약. 통합 담당만 수정한다 (architecture.md 8절).
    클라이언트 타입은 `web`에서 `pnpm gen:api`로 생성한다.
    규칙 정보(확률, 숨은 방향, 시드)는 응답에 담지 않는다.
servers:
  - url: /
paths:
  /api/sessions:
    post:
      operationId: ensureSession
      summary: 익명 세션을 확보한다
      description: 유효한 세션 쿠키가 있으면 그대로 두고, 없으면 새 세션을 발급해 `IG_SESSION` 쿠키로 준다.
      responses:
        '204':
          description: 세션이 준비됨
  /api/games:
    post:
      operationId: startGame
      summary: 새 판을 시작한다
      description: 진행 중인 판이 있으면 버리고 새로 시작한다 (다시 시작하기).
      responses:
        '201':
          description: 새 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/SessionRequired' }
  /api/games/current:
    get:
      operationId: getCurrentGame
      summary: 진행 중인 판을 가져온다 (이어하기)
      responses:
        '200':
          description: 진행 중인 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/games/{gameId}/advance:
    post:
      operationId: advanceGame
      summary: 게임 시각을 보고한다
      description: 시각은 거꾸로 갈 수 없고, 한 번에 건너뛸 수 있는 구간에 상한이 있다.
      parameters:
        - name: gameId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvanceRequest' }
      responses:
        '200':
          description: 진행된 판
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/SessionRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    Phase:
      type: string
      enum: [SAVING, INVESTING, ENDED]
    Stats:
      type: object
      required: [insight, patience, courage, conviction, luck]
      properties:
        insight: { type: integer, minimum: 0, maximum: 100, description: 안목 }
        patience: { type: integer, minimum: 0, maximum: 100, description: 인내심 }
        courage: { type: integer, minimum: 0, maximum: 100, description: 용기 }
        conviction: { type: integer, minimum: 0, maximum: 100, description: 줏대 }
        luck: { type: integer, minimum: 0, maximum: 100, description: 운 }
    Game:
      type: object
      required: [gameId, phase, lastReportedDay, startAge, endAge, daysPerYear, stats, cash]
      properties:
        gameId: { type: string, format: uuid }
        phase: { $ref: '#/components/schemas/Phase' }
        lastReportedDay: { type: integer, minimum: 0, description: 서버가 마지막으로 받은 게임 일수 }
        startAge: { type: integer }
        endAge: { type: integer }
        daysPerYear: { type: integer, description: 게임 달력의 1년 일수 }
        stats: { $ref: '#/components/schemas/Stats' }
        cash: { type: integer, format: int64, description: 현금(원) }
    AdvanceRequest:
      type: object
      required: [day]
      properties:
        day: { type: integer, minimum: 0, description: 클라이언트가 보고하는 게임 일수 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SESSION_REQUIRED, NOT_FOUND, INVALID_REQUEST] }
        message: { type: string }
  responses:
    SessionRequired:
      description: 세션이 없거나 만료됨. 새로 태어나야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: 규칙에 맞지 않는 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
