                  items:
                    type: object
                    required: [employeeId, name, desk, read, text]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      read: { type: string, enum: [UP, DOWN, NEUTRAL] }
                      text: { type: string }
                      stubborn:
                        type: [string, 'null']
                        enum: [LOW, MID, HIGH, null]
                        description: 돈을 굴리는 직원이 제멋대로 할 낌새. 돈을 굴리지 않으면 null
                options:
                  type: array
                  items:
                    type: object
                    required: [code, label]
                    properties:
                      code: { type: string, enum: [BUY, SELL, HOLD, TEAM] }
                      label: { type: string }
                ready: { type: boolean, description: 지금 정할 수 있다(정하지 않았고 돈을 굴리는 자리에 사람이 있다) }
                convened: { type: boolean, description: 회의를 열어 한마디와 형광펜을 굳혔다. 그 뒤로 배치를 바꿔도 그대로다 (decisions.md 249번) }
                finder:
                  description: 이 종목을 물어 온 직원 (267번). 아직 아무도 안 가져왔거나 옛 회의면 null
                  oneOf:
                    - $ref: '#/components/schemas/Finder'
                    - type: 'null'
                outcome:
                  oneOf:
                    - type: object
                      required: [choice, big, delegated, teamBuy, teamSell, up, reveal, decisive, total, results]
                      properties:
                        choice: { type: string, enum: [BUY, SELL, HOLD], description: 정한 것. 맡겼으면 직원들이 정한 쪽 }
                        big: { type: boolean, description: 크게 했다 (decisions.md 260번) }
                        delegated: { type: boolean, description: 사장이 "너희가 알아서 해" 하고 맡겼다 (decisions.md 279번) }
                        teamBuy: { type: integer, description: 맡겼을 때 매수 쪽에 얹힌 무게(직원 안목). 맡기지 않았으면 0 }
                        teamSell: { type: integer, description: 매도 쪽 무게 }
                        missed: { type: [integer, 'null'], format: int64, description: 지켜봤을 때 맞는 쪽으로 했으면 벌었을 돈(뒤집힘 없이). 지켜보지 않았으면 null }
                        up: { type: boolean }
                        reveal: { type: string }
                        decisive: { type: integer, description: 결정적 문장의 번호(sentences 안) }
                        total: { type: integer, format: int64, description: 회의 손익. 이미 자본에 들어갔다 }
                        credit: { type: [string, 'null'], description: 물어 온 직원을 칭찬하거나 탓하는 한 줄 (267번). 옛 회의면 null }
                        results:
                          type: array
                          items:
                            type: object
                            required: [employeeId, name, desk, action, follow, pnl, line]
                            properties:
                              employeeId: { type: integer }
                              name: { type: string }
                              desk: { type: string }
                              action: { type: string, enum: [BUY, SELL, HOLD] }
                              follow:
                                type: string
                                enum: [BOSS, OWN, SWAY]
                                description: 사장 말대로·제 판단대로("제가 알아서 할게요")·꼬드김
                              pnl: { type: integer, format: int64 }
                              line: { type: string }
                              rival:
                                description: |
                                  사장 말과 맞붙은 행동: 일어난 쪽(꼬드김·제 판단), 사장 말대로 했으면 먼저 굴린 꼬드김부터 사장과 다른 것.
                                  맞붙을 것이 없었으면 null. 회의 창의 맞대결 막대가 쓴다 (decisions.md 235번)
                                oneOf:
                                  - type: object
                                    required: [kind, action, stat]
                                    properties:
                                      kind: { type: string, enum: [SWAY, OWN], description: 꼬드김·제 판단 }
                                      action: { type: string, enum: [BUY, SELL, HOLD] }
                                      stat: { type: string, description: 사장 쪽을 지킨 능력치 코드(꼬드김이면 conviction) }
                                  - type: 'null'
                    - type: 'null'
            - type: 'null'
        macro:
          description: 이번 분기의 거시경제 회의 (decisions.md 266·268번). 끝난 회사나 이 회의가 생기기 전의 해면 null. 숨은 방향은 분기 실적의 섹터 바람으로 드러난다
          oneOf:
            - type: object
              required: [topic, title, sentences, remarks, stances, ready, convened]
              properties:
                topic: { type: string, description: 주제 이름(기준금리·환율·유가·물가·경기) }
                title: { type: string }
                sentences:
                  type: array
                  description: 기사 문장. 리서치 팀이 형광펜을 그은 문장은 highlighted, 연초 회의의 폭락 조짐을 옮긴 문장은 omen(헛조짐일 수도 있다)
                  items:
                    type: object
                    required: [text, highlighted, omen]
                    properties:
                      text: { type: string }
                      highlighted: { type: boolean }
                      omen: { type: boolean }
                highlightBy: { type: [string, 'null'] }
                remarks:
                  type: array
                  description: 자리에 앉은 직원의 한마디. 회의를 열기 전에는 비어 있다. read UP은 공격, DOWN은 방어 쪽
                  items:
                    type: object
                    required: [employeeId, name, desk, read, text]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      read: { type: string, enum: [UP, DOWN, NEUTRAL] }
                      text: { type: string }
                      stubborn: { type: 'null' }
                stances:
                  type: array
                  items:
                    type: object
                    required: [code, label, note, stakePercent]
                    properties:
                      code: { type: string, enum: [AGGRESSIVE, NEUTRAL, DEFENSIVE] }
                      label: { type: string }
                      note: { type: string }
                      stakePercent: { type: integer, description: 그해 결산 판돈 비율(%) }
                ready: { type: boolean, description: 지금 고를 수 있다(안 골랐고 돈을 굴리는 자리에 사람이 있다) }
                convened: { type: boolean }
                outcome:
                  oneOf:
                    - type: object
                      required: [stance]
                      properties:
                        stance: { type: string, enum: [AGGRESSIVE, NEUTRAL, DEFENSIVE] }
                        finder:
                          description: 회의가 끝나고 종목을 물어 온 직원. 아무도 안 왔으면 null
                          oneOf:
                            - $ref: '#/components/schemas/Finder'
                            - type: 'null'
                        none: { type: [string, 'null'], description: 아무도 안 왔을 때 한 줄 }
                    - type: 'null'
            - type: 'null'
        lastSettlement:
          oneOf:
            - type: object
              required: [year, phase, capitalBefore, capitalAfter, fee, hiring, salary, quarters, gradeBefore, gradeAfter, overtook, achieved, results, lines, reports]
              properties:
                year: { type: integer }
                phase: { type: string, enum: [boom, normal, crash] }
                omen: { type: [string, 'null'] }
                capitalBefore: { type: integer, format: int64, description: 연초 회의 때의 자본 (decisions.md 251번) }
                capitalAfter: { type: integer, format: int64 }
                fee: { type: integer, format: int64, description: 수수료 매출 }
                hiring: { type: integer, format: int64, description: 그해 인사 비용(계약금·새로 받기·붙잡는 값 − 받은 이적료, 음수일 수 있다). 연초 자본 + 회의 + 직원들 + 수수료 − 인사 비용 − 인건비 = 연말 자본 (251·262번) }
                salary: { type: integer, format: int64, description: 그해 나간 연봉의 합(인건비, decisions.md 270번) }
                invest:
                  description: 그해 투자 회의(기사 제목과 손익, 이미 자본에 들어갔다). 회의를 안 했거나 옛 결산이면 null (decisions.md 240번)
                  oneOf:
                    - type: object
                      required: [title, total]
                      properties:
                        title: { type: string }
                        total: { type: integer, format: int64 }
                    - type: 'null'
                quarters:
                  type: array
                  description: 그해 네 분기의 실적 (decisions.md 268번). 분기 결산 전의 옛 결산이면 비어 있다
                  items: { $ref: '#/components/schemas/Quarter' }
                gradeBefore: { $ref: '#/components/schemas/Grade' }
                gradeAfter: { $ref: '#/components/schemas/Grade' }
                overtook:
                  type: array
                  description: 그해 앞지른 라이벌 증권사 (decisions.md 261번)
                  items: { type: string }
                achieved:
                  type: array
                  description: 그해 연 업적 이름 (decisions.md 263번)
                  items: { type: string }
                results:
                  type: array
                  items:
                    type: object
                    required: [employeeId, name, desk, stake, pnl, flips]
                    properties:
                      employeeId: { type: integer }
                      name: { type: string }
                      desk: { type: string }
                      stake: { type: integer, format: int64 }
                      pnl: { type: integer, format: int64 }
                      flips: { type: object, additionalProperties: { type: integer } }
                lines: { type: array, items: { type: string } }
                reports:
                  type: array
                  description: 팀장들의 한 해 보고 (decisions.md 269번)
                  items: { $ref: '#/components/schemas/Report' }
                target:
                  description: 올해의 라이벌과 견준 결과 (decisions.md 275번). 고르지 않았으면 null
                  oneOf:
                    - type: object
                      required: [difficulty, difficultyName, name, real, theirCapital, ourCapital, won, bonus, theirGrade]
                      properties:
                        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
                        difficultyName: { type: string }
                        name: { type: string }
                        real: { type: boolean, description: 실제 다른 사장의 회사면 true }
                        theirCapital: { type: integer, format: int64 }
                        ourCapital: { type: integer, format: int64 }
                        won: { type: boolean }
                        bonus: { type: integer, format: int64, description: 이겨서 넘어온 고객 몫(이미 자본에 들어갔다) }
                        theirGrade: { $ref: '#/components/schemas/Grade' }
                    - type: 'null'
                finished: { type: boolean, description: 이 결산으로 랜드마크 타워에 올라 엔딩을 봤다 (decisions.md 276번) }
            - type: 'null'
        resign:
          description: 연봉 때문에 사표를 들고 온 직원 (decisions.md 282번). 붙잡거나 보내지 않고 다음 분기를 넘기면 떠난다. 없으면 null
          oneOf:
            - type: object
              required: [employeeId, name, reason, line, before, after]
              properties:
                employeeId: { type: integer }
                name: { type: string }
                reason: { type: string, enum: [IGNORED, FROZEN], description: 'IGNORED: 연봉 답을 기다리다 지쳤다, FROZEN: 동결에 실망했다' }
                line: { type: string }
                before: { type: integer, format: int64, description: 지금 연봉 }
                after: { type: integer, format: int64, description: 붙잡으면 오를 연봉 }
            - type: 'null'
        ending:
          description: 엔딩 (decisions.md 276번). 랜드마크 타워에 오르면 회사가 멈추고 사장이 다음 회사를 차린다. 아직이면 null
          oneOf:
            - type: object
              required: [year, capital, grade]
              properties:
                year: { type: integer, description: 엔딩을 본 해 }
                capital: { type: integer, format: int64 }
                grade: { $ref: '#/components/schemas/Grade' }
            - type: 'null'
    Target:
      type: object
      description: 올해의 라이벌 한 곳 (decisions.md 275번)
      required: [difficulty, difficultyName, name, real, capital, grade, bonusBp]
      properties:
        difficulty: { type: string, enum: [EASY, MEDIUM, HARD] }
        difficultyName: { type: string }
        name: { type: string }
        real: { type: boolean, description: 실제 다른 사장의 회사면 true, 모자라 지어낸 회사면 false }
        capital: { type: integer, format: int64, description: 뽑을 때의 자본 }
        grade: { $ref: '#/components/schemas/Grade' }
        bonusBp: { type: integer, description: 이기면 우리 자본이 느는 몫(만분율) }
    Quarter:
      type: object
      description: 분기 하나의 실적 (decisions.md 268번)
      required: [year, quarter, capitalBefore, capitalAfter, fee, staff, hiring, salary, crash, lines, reports]
      properties:
        year: { type: integer }
        quarter: { type: integer }
        capitalBefore: { type: integer, format: int64 }
        capitalAfter: { type: integer, format: int64 }
        fee: { type: integer, format: int64, description: 수수료 매출(한 해 몫의 4분의 1) }
        staff: { type: integer, format: int64, description: 직원들이 이 분기에 굴린 몫 }
        hiring: { type: integer, format: int64, description: 이 분기에 낸 인사 비용(계약금·새로 받기 값 − 받은 이적료). 시작 자본 + 회의 + 직원들 + 수수료 − 인사 비용 − 인건비 = 끝 자본 }
        salary: { type: integer, format: int64, description: 이 분기에 나간 연봉(인건비, decisions.md 270번) }
        invest:
          description: 이 분기 종목 회의(기사 제목과 손익). 안 열렸으면 null
          oneOf:
            - type: object
              required: [title, total]
              properties:
                title: { type: string }
                total: { type: integer, format: int64 }
            - type: 'null'
        topic: { type: [string, 'null'], description: 이 분기 거시경제 회의의 주제 }
        stance: { type: [string, 'null'], enum: [AGGRESSIVE, NEUTRAL, DEFENSIVE, null] }
        crash: { type: boolean, description: 이 분기에 폭락이 터졌다 }
        lines: { type: array, items: { type: string } }
        reports:
          type: array
          description: 팀장 보고. 사람이 앉은 자리마다 한 줄 (decisions.md 269번)
          items: { $ref: '#/components/schemas/Report' }
    Report:
      type: object
      description: 팀장 보고 한 줄 (decisions.md 269번)
      required: [desk, deskName, leaderId, leader, head, text]
      properties:
        desk: { type: string }
        deskName: { type: string }
        leaderId: { type: integer }
        leader: { type: string }
        head: { type: string, description: '보고자: "반도체 데스크 팀장 박한결"' }
        pnl: { type: [integer, 'null'], format: int64, description: 돈을 굴리는 팀의 손익. 돕는 팀이면 null }
        text: { type: string }
    Finder:
      type: object
      description: 종목을 물어 온 직원 (decisions.md 267번)
      required: [employeeId, name, desk, pitch]
      properties:
        employeeId: { type: integer }
        name: { type: string }
        role: { type: [string, 'null'], description: 직함. 직함이 없는 자리면 null }
        desk: { type: string }
        pitch: { type: string, description: 가져올 때 한마디 }
    Grade:
      type: string
      enum: [F, E, D, C, B, A, S, SS, SSS, X, XX, XXX, Z, ZZ, ZZZ]
    PlayLog:
      type: object
      required: [sessions, companies]
      properties:
        companies:
          type: array
          description: 회사. 최근에 차린 순 (decisions.md 228번)
          items: { $ref: '#/components/schemas/CompanyPlay' }
        sessions:
          type: array
          description: 마지막 접속이 최근인 순
          items: { $ref: '#/components/schemas/PlaySession' }
    PlaySession:
      type: object
      required: [sessionId, createdAt, lastSeenAt, companies]
      properties:
        sessionId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time, description: 처음 온 시각 }
        lastSeenAt: { type: string, format: date-time, description: 마지막 접속 시각 }
        companies: { type: integer, description: 최근 회사 목록(companies) 안에서 센 회사 수 }
        firstIp: { type: [string, 'null'], description: 처음 접속한 IP (프록시 뒤면 X-Forwarded-For의 첫 주소) }
        lastIp: { type: [string, 'null'], description: 마지막 접속 IP }
    CompanyPlay:
      type: object
      required: [companyId, sessionId, status, number, era, year, settled, capital, grade, employees, sold, createdAt, updatedAt]
      properties:
        companyId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, ENDED] }
        number: { type: integer, description: 사장이 차린 몇 번째 회사인가 }
        era: { type: string, description: 시대 코드 }
        year: { type: integer, description: 지금 해. 시대가 끝났으면 turns + 1 }
        settled: { type: integer, description: 결산한 해의 수 }
        capital: { type: integer, format: int64 }
        grade: { $ref: '#/components/schemas/Grade' }
        employees: { type: integer }
        sold: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Named:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [SESSION_REQUIRED, NOT_FOUND, INVALID_REQUEST] }
        message: { type: string }
  responses:
    SessionRequired:
      description: 세션이 없거나 만료됨. 새로 태어나야 한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: 규칙에 맞지 않는 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
