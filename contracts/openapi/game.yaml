              type: array
              description: 이 회사에서 가장 많이 번 사람부터(지금 직원과 떠난 직원), 다섯까지
              items:
                type: object
                required: [name, from, totalPnl, grade]
                properties:
                  name: { type: string }
                  from: { type: integer, description: 들어온 해. 이 기록 전에 들어왔으면 0 }
                  to: { type: [integer, 'null'], description: 떠난 해. 아직 일하면 null }
                  totalPnl: { type: integer, format: int64 }
                  grade: { $ref: '#/components/schemas/Grade' }
        industry:
          description: 업계 순위와 바로 위 라이벌 증권사 (decisions.md 261번). 라이벌이 없는 옛 회사면 null
          oneOf:
            - type: object
              required: [rank, total]
              properties:
                rank: { type: integer, description: 우리 순위(1부터) }
                total: { type: integer, description: 우리를 넣은 회사 수 }
                aboveName: { type: [string, 'null'], description: 바로 위 라이벌. 1위면 null }
                aboveCapital: { type: [integer, 'null'], format: int64 }
            - type: 'null'
        invest:
          description: |
            올해 종목 회의 (decisions.md 229번). 끝난 회사나 옛 회사면 null. 숨은 방향은 정한 뒤 outcome에만 있다.
            직원이 종목을 물어 와야(finder) 열린다: 그 전에는 ready가 거짓이다 (267번)
          oneOf:
            - type: object
              required: [title, stockName, sectorName, sentences, sway, remarks, options, ready, convened]
              properties:
                title: { type: string }
                stockName: { type: string }
                sectorName: { type: string }
                sentences:
                  type: array
                  description: 단서 기사 문장. 리서치 팀이 형광펜을 그은 문장은 highlighted
                  items:
                    type: object
                    required: [text, highlighted]
                    properties:
                      text: { type: string }
                      highlighted: { type: boolean }
                highlightBy: { type: [string, 'null'], description: 형광펜을 그은 리서치 팀 직원 }
                sway:
                  type: object
                  required: [who, text]
                  properties:
                    who: { type: string, description: 꼬드기는 단골 인물 }
                    text: { type: string }
