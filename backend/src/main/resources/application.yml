spring:
  application:
    name: investor-game
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investor}
    username: ${DB_USER:investor}
    password: ${DB_PASSWORD:investor}
  flyway:
    # 에이전트들이 병렬로 추가한 마이그레이션의 병합 순서가 번호 순서와 어긋날 수 있다. 운영은 끈다 (db.md 6절).
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

game:
  days-per-month: 30
  days-per-year: 360

progress:
  # 15세에 시작해 성장기(15~24세) 10장면으로 성향이 정해지고, 취업 후 투자한다 (decisions.md 23번). 70세에 끝난다 (27번)
  start-age: 15
  end-age: 70
  max-skip-days: 360
  # 뉴스 선택의 매수가 쓰는 현금 비율(만분율). 수량은 진행이 현재가로 계산한다. 자유 매매는 사용자가 수량을 정한다
  news-buy-ratio-bp: 3000
  # 빚투를 고르면 총자산의 절반을 빌려 그 종목을 산다 (decisions.md 39번)
  leverage-loan-bp: 5000

content:
  # 콘텐츠 JSON 디렉터리 후보(작업 디렉터리 기준). 있으면 클래스 경로보다 먼저 읽어 IDE 실행에서도 콘텐츠가 보인다. 운영은 클래스 경로만 쓴다
  dirs: ../content, content
  # 성향 선택지가 능력치를 움직이는 최대 폭과 선택지 개수. 초기 능력치가 낮은 대신 선택 한 번이 크게 움직인다 (decisions.md 23번)
  trait-stat-max-delta: 8
  trait-options:
    min: 3
    max: 4

character:
  # 능력치마다 등급을 먼저 뽑고(확률 %), 그 등급의 점수 띠 안에서 균등하게 점수를 뽑는다 (decisions.md 24번).
  # 띠: SSS 90~100, SS 80~89, S 70~79, A 60~69, B 50~59, C 40~49, D 30~39, E 20~29, F 0~19 (StatGrade)
  initial-stat:
    # F 등급도 이 점수 아래로는 태어나지 않는다
    floor: 10
    grade-percent: { SSS: 1, SS: 3, S: 5, A: 10, B: 16, C: 25, D: 20, E: 12, F: 8 }
  growth:
    # 이탈 한 번 = 경험치 5 = 능력치 +1
    deviation-exp: 5
    exp-per-point: 5
    # SSS 띠 끝까지 오를 수 있다
    max-stat: 100
  trait-stat:
    # 성향 선택으로 내려갈 수 있는 하한. 상한은 growth.max-stat (경제 개편 설계 4.3절)
    min: 1

market:
  # 월 단위 가격 변동 (경제 개편 설계 5.3절). 섹터 공통 잡음 ±4%, 종목 등급별 ±4/8/12%, 종목 뉴스의 섹터 파급 30%, 바닥 100원
  sector-volatility-bp: 400
  volatility-bp:
    low: 400
    mid: 800
    high: 1200
  spillover-percent: 30
  min-price: 100
  # 경기 흐름 (decisions.md 38번). 한 판에 불안한 시기가 1~3번. 위기 시작은 26세(132달)~60세(540달) 사이.
  # 시기마다 25%는 전조 없이 오는 위기(그중 40%가 대공황). 나머지는 위기 12~30달 전부터 전조를 2~4개 흘린 뒤
  # 대공황 20% / 불황 25% / 조정 25% / 아무 일 없음 30%. 전조가 나와도 위기가 꼭 오지는 않는다.
  cycle:
    windows: { min: 1, max: 3 }
    first-month: 132
    last-month: 540
    omens: { min: 2, max: 4 }
    omen-lead-months: { min: 12, max: 30 }
    silent-percent: 25
    silent-depression-percent: 40
    outcome-percent:
      depression: 20
      recession: 25
      correction: 25
    # 빠지는 동안 다달이 더하는 하락(bp)에 갈래의 섹터 비율을 곱한다. 대공황 12~24달 × 3.5~5.5% ≈ 반토막 이상
    shapes:
      depression:
        fall-months: { min: 12, max: 24 }
        fall-bp: { min: 350, max: 550 }
        recovery-months: { min: 18, max: 36 }
        recovery-bp: { min: 150, max: 300 }
      recession:
        fall-months: { min: 6, max: 12 }
        fall-bp: { min: 200, max: 350 }
        recovery-months: { min: 12, max: 24 }
        recovery-bp: { min: 100, max: 200 }
      correction:
        fall-months: { min: 3, max: 6 }
        fall-bp: { min: 150, max: 250 }
        recovery-months: { min: 0, max: 0 }
        recovery-bp: { min: 0, max: 0 }

asset:
  initial-cash:
    min-unit: 1
    max-unit: 50
    unit: 1000000
  # 빚(마이너스 통장) 월 이자 1% (경제 개편 설계 6.4절)
  debt-interest-bp: 100

household:
  # 가계 (경제 개편 설계 7.2절·13절). 금액은 원. 물가는 취업 나이(24)부터 연 2% 복리. 60세 은퇴
  living-single: 1400000
  living-couple: 2200000
  child-cost:
    to-age6: 600000
    to-age12: 800000
    to-age18: 1000000
    to-age22: 1300000
  wedding-cost: 30000000
  childbirth-cost: 3000000
  spouse-income: 1800000
  # 은퇴 뒤 매달 연금. 1인/부부. 생활비보다 작아 노후 자금이 천천히 준다 (decisions.md 27번)
  pension-single: 1000000
  pension-couple: 1600000
  inflation-percent: 2
  inflation-base-age: 25
  retire-age: 60
  # progress.start-age와 같은 값. 도메인이 진행 설정을 읽지 않으므로 따로 둔다
  start-age: 15

behavior:
  # 능력치에 따른 편차를 크게: 능력치 0이면 이탈 80%, 100이면 0% (decisions.md 23번)
  deviation-cap-bp: 8000
  hint:
    # 안목 0이면 정답률 40%(믿으면 조금 손해), 100이면 95%. 강한 힌트("아주 좋다!")는 안목과 무관하게 50%로 나와
    # 낮은 안목에서는 자신만만한 헛소리가 된다 (decisions.md 28번)
    accuracy-base-bp: 4000
    accuracy-per-point-bp: 55
    neutral-below-insight: 40
    neutral-percent: 30
    strong-percent: 50
  luck:
    # 운 100이면 손실 완화 50%
    chance-per-point-bp: 50
    loss-factor-percent: 30

event:
  job:
    # 성향이 다 정해진 뒤, 이 나이에 첫 직장을 고른다. "더 나은 자리를 기다린다"는 wait-days 뒤 다시 오고 max-waits번까지 (decisions.md 26번)
    age: 25
    option-count: 3
    wait-days: 180
    max-waits: 3
    # 실직한 뒤 다시 직업 선택이 오기까지
    rehire-days: 150
  career:
    # 직업이 있는 동안 직장 장면(연봉 협상·승진·이직 제안·구조조정·번아웃)이 이 간격으로 온다. last-age를 넘으면 직업·직장 이벤트가 없다
    gap-days: { min: 540, max: 1080 }
    last-age: 57
  trait:
    # 취업 뒤에도 일상 장면(콘텐츠의 adult 장면)이 이 간격으로 와서 능력치를 움직인다. 풀을 다 쓰면 끝
    adult-gap-days: { min: 540, max: 900 }
  news:
    interest-weight-percent: 300
    no-repeat-window: 5
  # 결혼·자녀 선택형 이벤트 시점 (경제 개편 설계 7.3절)
  life:
    marriage-age: { min: 27, max: 31 }
    marriage-retry-years: 2
    marriage-last-age: 35
    child-first-gap-years: { min: 1, max: 2 }
    child-gap-years: { min: 2, max: 3 }
    max-children: 3
    child-last-age: 42
  # 알림성 지출·수입 이벤트 간격 (직업이 생긴 뒤부터)
  notice:
    gap-days: { min: 240, max: 600 }
  # 보유 종목 흔들림: 버틸지 팔지 묻고 인내심·용기로 뒤집힌다. 그 뒤 55%로 오르고 10~25% 움직인다 (decisions.md 33번)
  shake:
    gap-days: { min: 300, max: 600 }
    up-bp: 5500
    magnitude-bp: { min: 1000, max: 2500 }
  # 빚투: 든 종목이 12달 고점보다 30% 넘게 빠지면 대출받아 더 살지 묻는다. 최소 2년 간격 (decisions.md 39번)
  leverage:
    drop-bp: 3000
    gap-days: 720
  # 40년 동안 뉴스마다 선택해야 하므로 단기 약 80번, 장기 약 40번이 되도록 잡았다 (specs/event.md 7절).
  styles:
    short:
      # 뉴스(매수·매도 선택)는 1년에 한 번꼴 (decisions.md 30번). 단기는 조금 잦다
      news-gap-days: { min: 300, max: 390 }
      magnitude-percent: 150
    long:
      news-gap-days: { min: 330, max: 420 }
      magnitude-percent: 100
    default:
      news-gap-days: { min: 330, max: 420 }
      magnitude-percent: 100

session:
  ttl: 1d
  cookie-secure: true
