spring:
  application:
    name: investor-game
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investor}
    username: ${DB_USER:investor}
    password: ${DB_PASSWORD:investor}
  flyway:
    # 에이전트들이 병렬로 추가한 마이그레이션의 병합 순서가 번호 순서와 어긋날 수 있다. 운영은 끈다 (db.md 6절).
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

# 관리자 플레이 기록(/api/admin/plays)을 여는 토큰. 비워 두면 관리자 API는 꺼진다 (decisions.md 46번)
admin:
  token: ${ADMIN_TOKEN:}

content:
  # 콘텐츠 JSON 디렉터리 후보(작업 디렉터리 기준). 있으면 클래스 경로보다 먼저 읽어 IDE 실행에서도 콘텐츠가 보인다. 운영은 클래스 경로만 쓴다
  dirs: ../content, content

behavior:
  # 능력치 0이면 판정마다 이탈 40%, 100이면 0%. 줏대 판정 뒤 용기·인내 판정이 한 번 더 붙어 겹치므로 80%에서 30%로 낮췄다가
  # 너무 안 흔들려 40%로 올렸다 (decisions.md 23·179·184번)
  deviation-cap-bp: 4000
  hint:
    # 안목 0이면 정답률 40%(믿으면 조금 손해), 100이면 95%. 강한 힌트("아주 좋다!")는 안목과 무관하게 50%로 나와
    # 낮은 안목에서는 자신만만한 헛소리가 된다 (decisions.md 28번)
    accuracy-base-bp: 4000
    accuracy-per-point-bp: 55
    neutral-below-insight: 40
    neutral-percent: 30
    strong-percent: 50
  luck:
    # 운 100이면 50% 확률로 운이 따른다: 내릴 뉴스면 손실이 30%로 줄고, 오를 뉴스면 이득이 1.5배 (decisions.md 78번)
    chance-per-point-bp: 50
    loss-factor-percent: 30
    gain-bonus-percent: 150

session:
  ttl: 1d
  cookie-secure: true

# 증권사 육성 (증권사 육성 설계). 3분 육성 판은 없앴다: 직원은 회사의 공채 시장에서 뽑는다 (decisions.md 228번)
raising:
  # 아주 작은 회사 (증권사 육성 설계 4·6절, 2단계). (제안) 수치를 구현하며 정한 초기값 (decisions.md 208번~)
  company:
    # 한 시대의 길이(해). 세 해마다 다른 시대가 온다 (decisions.md 249번). 회사는 끝나지 않는다(236번)
    turns: 3
    # 회사 등급의 자본 띠: F 0, E 2억, D 6억, C 20억, B 100억 … ZZZ 1천조. 처음 세 띠는 4.5절 표(3억·10억·30억)보다 좁혔다:
    # 첫 이사까지 16년쯤 걸려 초반이 지루했다 (decisions.md 256번)
    grade-capital:
      [0, 200000000, 600000000, 2000000000, 10000000000, 30000000000, 100000000000, 300000000000,
       1000000000000, 3000000000000, 10000000000000, 30000000000000, 100000000000000,
       300000000000000, 1000000000000000]
    # 자리 수: F 2 … SSS 10, 그 위는 한 단계마다 +1 (4.5절 표 그대로)
    seats: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    # 규모의 벽 (decisions.md 244번): 등급 단계(F = 0)마다 맞혀서 버는 몫 ×gain, 잃는 몫 ×miss, 폭락장 손익 ×crash.
    # 전에는 등급마다 수수료·판돈 ×1.5라 B부터 잃는 해가 없고 SSS면 수수료만으로 자본이 두 배가 됐다
    scale:
      gain-percent: 92
      miss-percent: 108
      crash-percent: 118
    # 수수료 매출 자본의 3%, 판돈은 자본 전부(자본을 넘지 않음). 경제 맞춤 (decisions.md 226·244번, EconomySimulationTest)
    fee-bp: 300
    stake-percent: 100
    decisions: 4
    omen-percent: 75
    false-omen-percent: 15
    # 맞히면 +28%·틀리면 −10%·손이 뒤집히면 −14%(바이오), 단타는 +22%·−8%·−10%. C 직원 둘이면 한 시대(세 해)에 자본이 1.5~2배,
    # A 직원이면 셋에 하나쯤 E(3억)에 닿는다 (decisions.md 226번).
    # 섹터 데스크 (decisions.md 233번): 섹터마다 변동이 다르다. crash-percent는 폭락장의 시장 손익(−5%)에 곱한다.
    # 게임·반도체는 크게 벌고 크게 잃고, 식품·금융은 덜 벌지만 폭락장에 덜 빠진다
    desks:
      semiconductor: { gain-bp: 2700, miss-bp: 1000, flip-bp: 1300, crash-percent: 130 }
      bio: { gain-bp: 2800, miss-bp: 1000, flip-bp: 1400, crash-percent: 100 }
      energy: { gain-bp: 2600, miss-bp: 900, flip-bp: 1200, crash-percent: 100 }
      game: { gain-bp: 2900, miss-bp: 1200, flip-bp: 1500, crash-percent: 100 }
      food: { gain-bp: 1800, miss-bp: 600, flip-bp: 800, crash-percent: 30 }
      finance: { gain-bp: 2000, miss-bp: 700, flip-bp: 900, crash-percent: 50 }
      day: { gain-bp: 2200, miss-bp: 800, flip-bp: 1000, crash-percent: 100 }
    # 지원자의 관심 섹터와 같은 섹터 데스크에 앉으면 맞혔을 때 +2%p
    interest-bonus-bp: 200
    phase-bp: { boom: 300, normal: 0, crash: -500 }
    sway-percent: 50
    # 폭락장에 손이 뒤집히면(못 참고 팔면) 손실이 두 배
    crash-flip-percent: 200
    # 라이벌 증권사 (decisions.md 260번): 해마다 그해 시장 갈래의 비율(%)에 ±spread를 더해 자본이 움직인다
    rivals:
      phase-percent: { boom: 130, normal: 116, crash: 86 }
      spread: 12
    # 사람 이야기 (decisions.md 261번): 이직 제안은 poach-from-year 해부터 해마다 poach-percent 확률로 온다.
    # 붙잡는 값과 이적료는 그 직원 계약금의 keep-percent·transfer-percent. 같은 자리 settle-years 해째부터 손 뒤집힘 settled-flip-percent배
    people:
      poach-from-year: 3
      poach-percent: 25
      keep-percent: 50
      transfer-percent: 50
      settle-years: 3
      settled-flip-percent: 80
    # 실전 경험과 큰 손실 (2.3·6.4절): 한 해에 판돈의 30% 이상 잃으면 한 단계 하락(능력치는 한 띠 = 10점),
    # 폭락장을 손실 없이 버티면 실전 경험 +1. SSS에서 X까지 1, XX까지 2 … 단계마다 1씩 더 든다
    experience:
      drop-loss-percent: 30
      band: 10
      need-base: 1
    # X 이상 효과 (2.4절): X 확신은 맞히면 +4%p·틀리면 손실 절반, XXX 역발상은 폭락장에 판단마다 +5%,
    # Z 리더는 같은 자리 팀원의 뒤집힘 확률 절반. XX 경보·ZZ 사수·ZZZ 선견은 수치가 없다
    effects:
      conviction-gain-bp: 400
      conviction-miss-percent: 50
      contrarian-crash-bp: 500
      leader-flip-percent: 50
    # 인사 직원 (6.3절): 인사팀에 사람이 있으면 지원자가 한 명 더 오고, 지원자 등급의 중심이 인사 직원보다 두 단계 아래까지 오른다
    hr:
      cap-steps: 2
      extra-applicants: 1
    # 공채 시장 (decisions.md 228번): 해마다 지원자 셋이 온다. 등급의 중심은 회사 등급보다 두 단계 위(F 회사면 D)이고
    # 한 단계 아래·위로 흩어진다. 계약금을 내고 뽑는다. 새로 받는 값 300만 원
    market:
      applicants: 3
      level-steps: 2
      spread: 15
      # 계약금 F 200만 · E 400만 · D 700만 · C 1,000만 · B 1,500만 · A 2,500만 · S 4,000만 · SS 7,000만 · SSS 1.2억
      fees: [2000000, 4000000, 7000000, 10000000, 15000000, 25000000, 40000000, 70000000, 120000000]
      # 큰 회사에도 계약금이 무겁게 (decisions.md 257번): 정해진 계약금과 자본 × 이 만분율(F~SSS) 가운데 큰 쪽. 1억 회사는 정해진 값 그대로다
      fee-bp: [50, 100, 150, 200, 300, 400, 500, 650, 800]
      # SSS 회사부터 오는 경력직(X 이상)의 계약금: 자본 × 이 만분율, 단계마다 step만큼 더
      veteran-fee-bp: 1200
      veteran-fee-step-bp: 300
      # 새로 받기 값: 정해진 값과 자본 × refresh-bp 가운데 큰 쪽. 한 해에 받을수록 (횟수 + 1)배
      refresh-cost: 3000000
      refresh-bp: 50
    # 투자 회의 (decisions.md 229번): 해마다 한 번 단서 기사를 놓고 직원들과 고민한다. 호황이면 오르는 뉴스가 +15%p, 폭락장이면 −10%p.
    # 곁가지 문장은 60% 반대쪽(기사만 읽고 다수결하면 약 64% 맞는다). 제멋대로 할 확률이 20% 이상이면 고집 "보통", 40% 이상이면 "높음"(D 직원이 보통, E 직원이 높음)
    invest:
      year-up-bp: { boom: 1500, normal: 0, crash: -1000 }
      side-opposite-percent: 60
      stubborn-bp: 2000
      # 크게 (decisions.md 259번): 판돈이 두 배, 대신 직원이 사장 말을 안 들을 확률(꼬드김·제 판단)이 1.5배
      big-stake-percent: 200
      big-stubborn-percent: 150
      # 기사가 얼마나 또렷한가 (decisions.md 241번): 흐릴수록 읽을 때 안목을 깎아 안목 높은 직원끼리도 의견이 갈린다
      clarity:
        - { code: clear, weight: 35, penalty: 0 }
        - { code: murky, weight: 40, penalty: 25 }
        - { code: foggy, weight: 25, penalty: 55 }
    # 매각과 재창업 (9절, 4단계). 한 해 시장 갈래의 가중치는 시대(content/raising.json의 eras)가 정한다.
    # 시대(turns 해)가 끝나면 반드시 팔고, 그 전에는 SSS 이상이면 스스로 팔 수 있다 (decisions.md 215번~)
    sale:
      min-grade: SSS
      # 판 회사의 등급 단계 + 1점(F 1점 … SSS 9점), 명성 한 단계에 2점
      fame-per-step: 2
      voluntary-bonus: 1
      # 공동창업자: 처음 1명, 명성 3단계마다 +1, 4명까지
      cofounder-base: 1
      cofounder-fame-steps: 3
      cofounder-max: 4
      # 회사 시작 자본 1억 원(첫 회사는 사장의 사재), 명성 한 단계마다 +10%
      base-capital: 100000000
      fame-capital-percent: 10
