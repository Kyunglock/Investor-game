spring:
  application:
    name: investor-game
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investor}
    username: ${DB_USER:investor}
    password: ${DB_PASSWORD:investor}
  flyway:
    # 에이전트들이 병렬로 추가한 마이그레이션의 병합 순서가 번호 순서와 어긋날 수 있다. 운영은 끈다 (db.md 6절).
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

# 관리자 플레이 기록(/api/admin/plays)을 여는 토큰. 비워 두면 관리자 API는 꺼진다 (decisions.md 46번)
admin:
  token: ${ADMIN_TOKEN:}

# 결과 공유 (#275). 카카오 JavaScript 키가 있으면 카카오톡 카드로 보낸다. 비우면 휴대폰 공유창·링크 복사
share:
  kakao-js-key: ${KAKAO_JS_KEY:}

game:
  days-per-month: 30
  days-per-year: 360

progress:
  # 15세에 시작해 성장기(15~24세) 10장면으로 성향이 정해지고, 취업 후 투자한다 (decisions.md 23번). 70세에 끝난다 (27번)
  start-age: 15
  end-age: 70
  max-skip-days: 360
  # 뉴스 선택의 매수가 쓰는 현금 비율(만분율). 수량은 진행이 현재가로 계산한다. 자유 매매는 사용자가 수량을 정한다
  news-buy-ratio-bp: 3000
  # 빚투를 고르면 총자산의 절반을 빌려 그 종목을 산다 (decisions.md 39번)
  leverage-loan-bp: 5000
  # 자녀가 독립해 집을 나가는 나이. 태어날 때 아이마다 굴린다 (decisions.md 68번, 138번에서 20~25로)
  child-leave-age: { min: 20, max: 25 }
  # 일을 시작하기 전이면 20세부터 아르바이트. 그 전엔 모이는 돈이 없다 (decisions.md 96·98번)
  part-time-from-age: 20
  # 재취업하면 그동안 일한 햇수의 60%를 연차로 인정해 월급에 얹는다. 신입 월급으로 돌아가지 않는다 (decisions.md 116번)
  rehire-credit-percent: 60
  # 월급 곡선 (decisions.md 133번): 실제 평균 임금처럼 20대 후반→40대 후반 1.6배쯤, 50대 후반부터 줄어든다.
  # 연차 인상(jobs.json raise-percent-per-year, 물가 위의 실질)은 10년 동안 그대로, 다음 10년은 절반, 그 뒤 0.
  # 55세부터 해마다 3% 줄고(정년 있는 직업만), 협상·승진 인상분은 합쳐 +100%까지. 월급은 물가(household.inflation-percent)를 따라 오른다
  salary:
    raise-full-years: 10
    raise-half-years: 10
    decline-age: 55
    decline-percent: 3
    max-bonus-bp: 10000
  # 주거 돈 계산 (주거 설계 3절). LTV 50%, DSR 40%, 아파트 전세가 = 시세의 55%(84㎡, 식구 수와 무관), 전세대출은 모자란 만큼만 최대 80%(decisions.md 107번), 연장 +5%.
  # 월세·빌라 전세는 집 크기(방 수 1~4: 원룸·투룸·쓰리룸·포룸, #117·decisions.md 105번)를 따른다. 필요한 크기 = 1 + 결혼 1 + 집에 있는 아이(최대 2).
  # 월세 1000만/60만 → 2000만/90만 → 3000만/120만 → 4000만/150만, 빌라 전세 = 경기 시세의 30 → 40 → 48 → 55%.
  # 매물은 한 달에 25%로 팔리고 집값이 빠질 땐 5%, 뜨거우면 45%
  housing:
    ltv-bp: 5000
    dsr-bp: 4000
    jeonse-ratio-bp: 5500
    villa-bp: [3000, 4000, 4800, 5500]
    jeonse-loan-bp: 8000
    renew-raise-bp: 500
    monthly:
      - { deposit: 10000000, rent: 600000 }
      - { deposit: 20000000, rent: 900000 }
      - { deposit: 30000000, rent: 1200000 }
      - { deposit: 40000000, rent: 1500000 }
    # 보증금이 모자라면 모자란 만큼 × 0.5%를 월세에 얹는다(전월세 전환율 연 6%)
    conversion-bp-per-month: 50
    sale-chance-bp: 2500
    sale-chance-falling-bp: 500
    sale-chance-hot-bp: 4500
    falling-bp: -500
    hot-bp: 1500
    # 청약 분양가는 시세의 70% (decisions.md 42번)
    cheongyak-price-bp: 7000
    # 청약 계약금은 분양가의 20%를 현금으로, 나머지는 분양 대출(LTV 대신 DSR만). 둘 다 되어야 공고가 온다 (decisions.md 48번)
    cheongyak-down-bp: 2000
  # 평범한 경제 기사 (매매창 설계 3.3절): 24세(108달)부터 3~4달마다 하나. 전조·헛소문과 똑같이 토스트로 지나가고 신문에 쌓인다
  article-first-month: 108
  article-gap-months: { min: 3, max: 4 }
  # 행동 프로필의 자유 매매 빈도는 투자 1년에 12번(한 달에 한 번) 사고팔면 1로 친다 (행동 프로필·봇 설계 3절)
  profile-full-trades-per-year: 12

content:
  # 콘텐츠 JSON 디렉터리 후보(작업 디렉터리 기준). 있으면 클래스 경로보다 먼저 읽어 IDE 실행에서도 콘텐츠가 보인다. 운영은 클래스 경로만 쓴다
  dirs: ../content, content
  # 성향 선택지가 능력치를 움직이는 최대 폭과 선택지 개수. 초기 능력치가 낮은 대신 선택 한 번이 크게 움직인다 (decisions.md 23번)
  trait-stat-max-delta: 8
  trait-options:
    min: 3
    max: 4

character:
  # 능력치마다 등급을 먼저 뽑고(확률 %), 그 등급의 점수 띠 안에서 균등하게 점수를 뽑는다 (decisions.md 24번).
  # 띠: SSS 90~100, SS 80~89, S 70~79, A 60~69, B 50~59, C 40~49, D 30~39, E 20~29, F 0~19 (StatGrade)
  initial-stat:
    # F 등급도 이 점수 아래로는 태어나지 않는다
    floor: 10
    grade-percent: { SSS: 1, SS: 3, S: 5, A: 10, B: 16, C: 25, D: 20, E: 12, F: 8 }
  growth:
    # 이탈 한 번 = 경험치 5 = 능력치 +1
    deviation-exp: 5
    exp-per-point: 5
    # SSS 띠 끝까지 오를 수 있다
    max-stat: 100
  trait-stat:
    # 성향 선택으로 내려갈 수 있는 하한. 상한은 growth.max-stat (경제 개편 설계 4.3절)
    min: 1

market:
  # 월 단위 가격 변동 (경제 개편 설계 5.3절). 섹터 공통 잡음 ±1.5%, 종목 등급별 ±1.5/3/4.5%, 종목 뉴스의 섹터 파급 30%, 바닥 100원.
  # 2026-10-24 세 토막으로 줄임: 시간이 흐르며 생기는 흔들림은 작게, 뉴스 충격은 크게 (decisions.md 65번)
  sector-volatility-bp: 150
  volatility-bp:
    low: 150
    mid: 300
    high: 450
  spillover-percent: 30
  min-price: 100
  # 아파트 시세 월 잡음 ±1%. 추세는 content/homes.json (주거 설계 3절)
  homes:
    volatility-bp: 100
  # 주담대 금리(연): 평소 5.5%, 위기로 빠지는 동안 +1.5%p, 회복기 −1.0%p. 달마다 ±0.25%p, 목표로 20%씩 되돌아감. 3~8%
  mortgage:
    base-bp: 550
    crisis-bp: 150
    recovery-bp: -100
    noise-bp: 25
    revert-percent: 20
    min-bp: 300
    max-bp: 800
  # 경기 흐름 (decisions.md 38번). 한 판에 불안한 시기가 1~3번. 위기 시작은 26세(132달)~60세(540달) 사이.
  # 시기마다 25%는 전조 없이 오는 위기(그중 40%가 대공황). 나머지는 위기 12~30달 전부터 전조를 2~4개 흘린 뒤
  # 대공황 20% / 불황 25% / 조정 25% / 아무 일 없음 30%. 전조가 나와도 위기가 꼭 오지는 않는다.
  cycle:
    windows: { min: 1, max: 3 }
    first-month: 132
    last-month: 540
    omens: { min: 2, max: 4 }
    omen-lead-months: { min: 12, max: 30 }
    silent-percent: 25
    silent-depression-percent: 40
    outcome-percent:
      depression: 20
      recession: 25
      correction: 25
    # 빠지는 동안 다달이 더하는 하락(bp)에 갈래의 섹터 비율을 곱한다. 대공황 12~24달 × 3.5~5.5% ≈ 반토막 이상
    shapes:
      depression:
        fall-months: { min: 12, max: 24 }
        fall-bp: { min: 350, max: 550 }
        recovery-months: { min: 18, max: 36 }
        recovery-bp: { min: 150, max: 300 }
      recession:
        fall-months: { min: 6, max: 12 }
        fall-bp: { min: 200, max: 350 }
        recovery-months: { min: 12, max: 24 }
        recovery-bp: { min: 100, max: 200 }
      correction:
        fall-months: { min: 3, max: 6 }
        fall-bp: { min: 150, max: 250 }
        recovery-months: { min: 0, max: 0 }
        recovery-bp: { min: 0, max: 0 }
    # 헛소문 (매매창 설계 3.2절): 평온한 시기에도 24세(108달)부터 끝(70세)까지 1~2년에 하나꼴로 같은 전조 풀에서 흘린다.
    # 불안한 시기·위기와 겹치는 달은 건너뛴다. 어느 위기에도 묶이지 않아 돌아볼 때 나오지 않는다
    rumor-first-month: 108
    rumor-last-month: 660
    rumor-gap-months: { min: 12, max: 24 }
  # 거시 지표 (매매창 설계 3.1절). 표시만 하고 가격에는 영향이 없다. 달마다 목표 쪽으로 15% 다가가고 잡음이 붙는다.
  # 전조 구간에는 결과와 상관없이 갈래 쪽으로 기울고(strong-scenarios면 크게), 전조 없는 위기는 빠지기 전까지 조용하다.
  # 평온한 달에도 6%로 가짜 신호가 시작돼 2~4달 동안 약하게 기운다
  indicators:
    revert-percent: 15
    fake-start-percent: 6
    fake-months: { min: 2, max: 4 }
    panic-months: 2
    series:
      # 원/달러
      fx:
        { base: 1300, alarm: 1380, alarm-strong: 1550, fall: 1500, fall-strong: 1800, recovery: 1350,
          panic: 0, noise: 20, min: 900, max: 2500, strong-scenarios: [currency] }
      # 가계부채 증가율(연, 만분율)
      debt:
        { base: 500, alarm: 700, alarm-strong: 1100, fall: 100, fall-strong: 0, recovery: 400,
          panic: 0, noise: 50, min: -500, max: 2000, strong-scenarios: [credit] }
      # 투자 심리 (0 공포 ~ 100 과열)
      sentiment:
        { base: 50, alarm: 65, alarm-strong: 82, fall: 15, fall-strong: 10, recovery: 55,
          panic: 0, noise: 8, min: 0, max: 100, strong-scenarios: [tech, depression] }
      # 거래대금 (평소 = 10000). 빠지기 시작한 첫 두 달은 치솟았다가(panic) 마른다
      turnover:
        { base: 10000, alarm: 13000, alarm-strong: 15000, fall: 7000, fall-strong: 7000, recovery: 10000,
          panic: 16000, noise: 1500, min: 3000, max: 30000, strong-scenarios: [tech, depression] }

asset:
  # 0원에서 시작한다. 20세 아르바이트부터 모은다 (decisions.md 94·98번)
  initial-cash:
    min-unit: 0
    max-unit: 0
    unit: 1000000
  # 빚(마이너스 통장·빚투)의 연이자 5%. 매월 1/12씩 붙는다 (decisions.md 72번)
  debt-annual-interest-bp: 500

household:
  # 가계 (경제 개편 설계 7.2절·13절). 금액은 원. 물가는 취업 나이(24)부터 연 2% 복리. 60세 은퇴
  # 주거비(월세·대출 이자)는 주거가 따로 낸다 (주거 설계 2절). 그래서 예전 140만/220만에서 주거비를 뺐다
  living-single: 900000
  living-couple: 1500000
  child-cost:
    to-age6: 600000
    to-age12: 800000
    to-age18: 1000000
    to-age22: 1300000
    # 23세부터 독립해 나갈 때까지 (decisions.md 68번)
    adult: 700000
  wedding-cost: 30000000
  childbirth-cost: 3000000
  spouse-income: 1800000
  # 은퇴 뒤 매달 연금. 1인/부부. 생활비보다 작아 노후 자금이 천천히 준다 (decisions.md 27번)
  pension-single: 700000
  pension-couple: 1100000
  inflation-percent: 2
  inflation-base-age: 25
  retire-age: 60
  # progress.start-age와 같은 값. 도메인이 진행 설정을 읽지 않으므로 따로 둔다
  start-age: 15

behavior:
  # 능력치 0이면 판정마다 이탈 40%, 100이면 0%. 줏대 판정 뒤 용기·인내 판정이 한 번 더 붙어 겹치므로 80%에서 30%로 낮췄다가
  # 너무 안 흔들려 40%로 올렸다 (decisions.md 23·179·184번)
  deviation-cap-bp: 4000
  hint:
    # 안목 0이면 정답률 40%(믿으면 조금 손해), 100이면 95%. 강한 힌트("아주 좋다!")는 안목과 무관하게 50%로 나와
    # 낮은 안목에서는 자신만만한 헛소리가 된다 (decisions.md 28번)
    accuracy-base-bp: 4000
    accuracy-per-point-bp: 55
    neutral-below-insight: 40
    neutral-percent: 30
    strong-percent: 50
  luck:
    # 운 100이면 50% 확률로 운이 따른다: 내릴 뉴스면 손실이 30%로 줄고, 오를 뉴스면 이득이 1.5배 (decisions.md 78번)
    chance-per-point-bp: 50
    loss-factor-percent: 30
    gain-bonus-percent: 150
  # 추세·시황 해석 (매매창 설계 4.2절): 안목 100이면 47.5%로 제대로 읽고(안목에 비례) 나머지는 세 갈래 중 찍는다 → 안목 0이면 약 33%, 100이면 65%.
  # 확신에 찬 말투는 안목과 무관하게 절반
  analysis:
    read-at-max-bp: 4750
    confident-percent: 50

event:
  job:
    # 성향이 다 정해진 뒤, 이 나이에 첫 직장을 고른다. "더 나은 자리를 기다린다"는 wait-days 뒤 다시 오고 max-waits번까지 (decisions.md 26번)
    age: 25
    option-count: 3
    wait-days: 180
    max-waits: 3
    # 실직한 뒤 다시 직업 선택이 오기까지
    rehire-days: 150
  career:
    # 직업이 있는 동안 직장 장면(연봉 협상·승진·이직 제안·구조조정·번아웃)이 이 간격으로 온다. last-age를 넘으면 직업·직장 이벤트가 없다
    # 선택 카드를 반으로 줄이려 540~1080에서 두 배로 (decisions.md 188번)
    gap-days: { min: 1080, max: 2160 }
    # 정년 있는 직업의 마지막 장면 나이. 정년(60) 직전 장면(공로연수 등)이 나오도록 59 (#233). 정년 없는 직업·전업투자자는 판 끝까지
    last-age: 59
    # household.retire-age와 같은 값. 도메인이 가계 설정을 읽지 않으므로 따로 둔다. 후속 장면은 정년 전에 온다
    retire-age: 60
  trait:
    # 취업 뒤에도 일상 장면(콘텐츠의 adult 장면)이 이 간격으로 와서 능력치를 움직인다. 풀을 다 쓰면 끝
    # 선택 카드를 반으로 줄이려 540~900에서 세 배로 (decisions.md 188번)
    adult-gap-days: { min: 1620, max: 2700 }
  news:
    interest-weight-percent: 300
    no-repeat-window: 5
    # 주식 이벤트(뉴스·흔들림·빚투)는 직장인에게 해마다 딱 하나 (decisions.md 194번). 뉴스는 해마다 굴려 두고, 그해 흔들림·빚투가 먼저 오면
    # 뉴스는 건너뛴다. 이미 주식 이벤트가 온 해의 흔들림·빚투는 다음 해 첫날로 밀린다. 예전에는 37.5%였다 (80·188번)
    yearly-chance-bp: 10000
    # 전업투자자에게는 해마다 세 번. 월급 없이 뉴스 0~1번으로는 생활비를 못 벌어 28세에 파산했다 (decisions.md 121번)
    investor-per-year: 3
  # 결혼·자녀 선택형 이벤트 시점 (경제 개편 설계 7.3절)
  life:
    marriage-age: { min: 27, max: 31 }
    marriage-retry-years: 2
    marriage-last-age: 35
    child-first-gap-years: { min: 1, max: 2 }
    child-gap-years: { min: 2, max: 3 }
    max-children: 3
    child-last-age: 42
    # 자녀가 독립한 뒤 이만큼 지나면 자녀 결혼 선택(결혼 비용을 얼마나 대줄지)이 온다 (decisions.md 68번)
    child-wedding-gap-years: { min: 2, max: 5 }
    # 결혼 뒤 이 간격마다 가족 가운데 누군가 여행을 가자고 한다. 이 나이까지 (decisions.md 71번)
    trip-gap-years: { min: 6, max: 12 }
    trip-last-age: 65
    # 아이가 어릴 때(대략 13세까지) 이 간격마다 놀이동산·운동회·학예회 같은 나들이·행사 가운데 하나가 온다 (decisions.md 87·99번)
    outing-gap-years: { min: 2, max: 4 }
    # 가족 점수가 이 아래면 남처럼 멀어진 집: 여행·나들이 제안이 끊기고 달마다 조금씩 지친다 (decisions.md 111번)
    cold-family-below: 20
    # 내 집을 사서 들어간 뒤 두 달이 지나면 집들이를 묻는다. 집마다 한 번 (decisions.md 140번)
    housewarming-delay-days: 60
  # 알림성 지출·수입 이벤트 간격 (직업이 생긴 뒤부터)
  notice:
    gap-days: { min: 240, max: 600 }
  # 보유 종목 흔들림: 버틸지 팔지 묻고 인내심·용기로 뒤집힌다. 그 뒤 55%로 오르고 10~25% 움직인다 (decisions.md 33번)
  shake:
    # 선택 카드를 반으로 줄이려 300~600에서 세 배로 (decisions.md 188번)
    gap-days: { min: 900, max: 1800 }
    up-bp: 5500
    magnitude-bp: { min: 1000, max: 2500 }
    # 산 지 반년 안 된 종목은 흔들지 않고, 뉴스와 한 달 안에 붙지 않는다. 급락 장면은 고점 대비 15% 넘게 빠졌을 때, 제자리걸음 장면은 반년 폭 15% 아래일 때만 (decisions.md 109번)
    min-held-days: 180
    after-news-days: 30
    plunge-drop-bp: 1500
    flat-range-bp: 1500
  # 빚투: 든 종목이 12달 고점보다 30% 넘게 빠지면 대출받아 더 살지 묻는다. 최소 2년 간격 (decisions.md 39번)
  leverage:
    drop-bp: 3000
    gap-days: 720
  # 주거 (주거 설계 4절): 보증보험 없는 빌라 전세는 만기 때 7%로 전세사기. "집 살까?"는 결혼·출산·서울 집값 12달 15% 상승 때, 최소 2년 간격
  housing:
    fraud-bp: 700
    buy-gap-days: 720
    surge-bp: 1500
    # 집이 없으면 3년마다 서울 분양 공고(청약). 가점으로 당첨을 굴린다 (decisions.md 42번, 188번에서 1년 반 → 3년)
    cheongyak-gap-days: 1080
    # 공고 간격은 본 횟수에 따라 3년 → 6년 → 9년으로 늘고, 세 번 뒤·은퇴 뒤·"관심 없다" 뒤에는 오지 않는다 (decisions.md 123·188번)
    cheongyak-gap-growth-max: 4
    cheongyak-max-notices: 3
    # 세 만기에 집주인이 재계약을 거절할 확률. 운 0이면 35%, 운 100이면 5%, 그 사이는 직선 (#25, decisions.md 49번)
    refuse-bp: { unlucky: 3500, lucky: 500 }
    # 주거 장면은 하루에 하나, 사이는 적어도 넉 달. 전세사기·거절 뒤 배우자 월세 불만은 반년 뒤 (decisions.md 110번)
    scene-gap-days: 120
    after-shock-days: 180
    # 결혼 뒤 월세에 살면 배우자가 "언제까지 월세 살 거야?" (#116, decisions.md 104번): 결혼(또는 독립) 1년 뒤 처음, 미루거나 거스르면 1년 반 뒤 다시,
    # 그사이 아이가 태어나면 반년 뒤 앞당겨. 60세까지
    spouse-rent:
      first-gap-days: 360
      retry-gap-days: 1080
      child-gap-days: 180
      last-age: 60
      # 네 번째면 배우자가 알아서 계약서를 들고 온다. 감당이 안 되면 월세로 굳어져 더 묻지 않는다 (decisions.md 111번)
      final-level: 4
    # 결혼·출산으로 세집이 식구 수에 비해 좁아지면 두 달 뒤 "집이 좁다" (#117, decisions.md 105번). 세 만기가 반년 안이면 만기에 옮기면 되니 따로 띄우지 않는다
    cramped-delay-days: 60
    cramped-lease-window-days: 180
  # 투자 스타일별 뉴스 폭. 빈도는 스타일과 무관하게 event.news.yearly-chance-bp (decisions.md 80번)
  styles:
    short:
      # 뉴스 폭은 content/news.json에서 두 배로 키웠다(65번). 단기는 그 위에 1.3배
      magnitude-percent: 130
    long:
      magnitude-percent: 100
    default:
      magnitude-percent: 100

session:
  ttl: 1d
  cookie-secure: true

housing:
  # 주거 (주거 설계 3절). 세는 2년, 아파트는 2채까지, 주담대 30년 원리금균등, 전세대출 = 주담대 − 0.5%p, 보증보험 연 0.2%
  # 2년 + 갱신청구권 2년. 만기 카드가 한 판에 열 번 넘게 떠서 4년으로 늘렸다 (decisions.md 188번)
  lease-years: 4
  max-homes: 2
  mortgage-years: 30
  jeonse-loan-spread-bp: -50
  insurance-bp-per-year: 20

# 3분 육성 한 판 (증권사 육성 설계 3절, 투자 원칙 장치 설계). (제안)으로 적힌 값을 구현하며 정한 초기값 (decisions.md 197번~)
raising:
  # 운용금. 회사가 열리기 전에는 판마다 사장의 사재 1억 원 (6.5절)
  fund: 100000000
  # 성향 2 → 실전 매매 7(원칙·풀기 카드는 뉴스 자리를 대신한다) + 돈이 걸린 큰일 2 → 입사 심사 1 = 12장 (3.1절)
  deck: [TRAIT_STYLE, TRAIT_SECTOR, NEWS, NEWS, NEWS, BIG, NEWS, NEWS, LEVERAGE, NEWS, NEWS, EXAM]
  # 조금/크게가 열리기 전의 "산다"는 지금처럼 30%. 열린 뒤 조금 15%, 크게 50% (3.2절)
  buy-ratio-bp: 3000
  small-ratio-bp: 1500
  big-ratio-bp: 5000
  # 뉴스 한 장을 복기할 때마다 안목 경험치 3. 두 장이면 안목 +1이라 첫 판 세 번째 뉴스에 형광펜이 열린다 (11.1·11.2절)
  review-insight-exp: 3
  # 손이 뒤집히면 그 능력치에 경험치 5 = +1 (character.growth와 같다)
  deviation-exp: 5
  exp-per-point: 5
  max-stat: 100
  min-stat: 1
  initial-stat:
    floor: 10
    grade-percent: { SSS: 1, SS: 3, S: 5, A: 10, B: 16, C: 25, D: 20, E: 12, F: 8 }
  # 처음 온 사람의 짜인 첫 판 (11.2절): 쉬운 기사 → 손이 뒤집힘 → 형광펜이 틀리고 기사가 맞음
  scripted:
    stats: { insight: 28, patience: 45, courage: 22, conviction: 50, luck: 40 }
    news:
      - { news: semi-contract, stock: ssj, up: true, mode: EASY }
      - { news: food-launch, stock: nsm, up: true, mode: FLIP }
      - { news: bio-trial, stock: ctl, up: false, mode: MISLEAD }
  # 곁가지 문장이 숨은 방향의 반대쪽일 확률. 기사만 읽고 다수결하면 약 64% 맞는다 (3.1절)
  side-opposite-percent: 60
  # 카드 한 장(한 분기) 동안 저절로 흔들리는 폭(±). 뉴스 충격(6~30%)보다 작게
  noise-bp: { low: 200, mid: 400, high: 600 }
  spillover-percent: 30
  # 공채 육성은 회사의 올해 시장에서 한다 (6.2절): 호황이면 뉴스가 오를 확률 +15%p, 폭락장이면 −10%p
  year-up-bp: { boom: 1500, normal: 0, crash: -1000 }
  crisis:
    chance-percent: 35
    silent-percent: 25
    from-card: 6
    omen-cards: 2
    fall-bp: { min: 2000, max: 3500 }
  leverage:
    min-drop-bp: 500
    loan-bp: 5000
    interest-bp: 500
  principle:
    flips: 2
    per-run: 1
    max-devices: 2
    release-at: 70
  # 아주 작은 회사 (증권사 육성 설계 4·6절, 2단계). (제안) 수치를 구현하며 정한 초기값 (decisions.md 208번~)
  company:
    # 2단계는 세 해로 끝나는 체험판
    turns: 3
    # 회사 등급의 자본 띠: F 0, E 3억, D 10억 … ZZZ 1천조 (4.5절 표 그대로)
    grade-capital:
      [0, 300000000, 1000000000, 3000000000, 10000000000, 30000000000, 100000000000, 300000000000,
       1000000000000, 3000000000000, 10000000000000, 30000000000000, 100000000000000,
       300000000000000, 1000000000000000]
    # 자리 수: F 2 … SSS 10, 그 위는 한 단계마다 +1 (4.5절 표 그대로)
    seats: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    # 등급 한 단계마다 수수료 매출과 판돈 ×1.5. 자본 띠가 ×3이라 등급이 저절로 치솟지 않는다
    multiplier-percent: 150
    fee-bp: 200
    stake-percent: 60
    # 공채 육성의 운용금: 자본의 10%, 10억 원까지 (6.5절)
    recruit-percent: 10
    recruit-max: 1000000000
    decisions: 4
    omen-percent: 75
    false-omen-percent: 15
    desks:
      bio: { gain-bp: 1200, miss-bp: 800, flip-bp: 1000 }
      day: { gain-bp: 800, miss-bp: 600, flip-bp: 700 }
    phase-bp: { boom: 300, normal: 0, crash: -500 }
    sway-percent: 50
    # 폭락장에 손이 뒤집히면(못 참고 팔면) 손실이 두 배
    crash-flip-percent: 200
    # 실전 경험과 큰 손실 (2.3·6.4절): 한 해에 판돈의 30% 이상 잃으면 한 단계 하락(능력치는 한 띠 = 10점),
    # 폭락장을 손실 없이 버티면 실전 경험 +1. SSS에서 X까지 1, XX까지 2 … 단계마다 1씩 더 든다
    experience:
      drop-loss-percent: 30
      band: 10
      need-base: 1
    # 매각과 재창업 (9절, 4단계). 한 해 시장 갈래의 가중치는 시대(content/raising.json의 eras)가 정한다.
    # 시대(turns 해)가 끝나면 반드시 팔고, 그 전에는 SSS 이상이면 스스로 팔 수 있다 (decisions.md 215번~)
    sale:
      min-grade: SSS
      # 판 회사의 등급 단계 + 1점(F 1점 … SSS 9점), 명성 한 단계에 2점
      fame-per-step: 2
      voluntary-bonus: 1
      # 공동창업자: 처음 1명, 명성 3단계마다 +1, 4명까지
      cofounder-base: 1
      cofounder-fame-steps: 3
      cofounder-max: 4
      # 새 회사 시작 자본 1억 원, 명성 한 단계마다 +10%
      base-capital: 100000000
      fame-capital-percent: 10
