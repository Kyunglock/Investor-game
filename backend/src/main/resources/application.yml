spring:
  application:
    name: investor-game
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investor}
    username: ${DB_USER:investor}
    password: ${DB_PASSWORD:investor}
  flyway:
    # 에이전트들이 병렬로 추가한 마이그레이션의 병합 순서가 번호 순서와 어긋날 수 있다. 운영은 끈다 (db.md 6절).
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

# 관리자 플레이 기록(/api/admin/plays)을 여는 토큰. 비워 두면 관리자 API는 꺼진다 (decisions.md 46번)
admin:
  token: ${ADMIN_TOKEN:}

content:
  # 콘텐츠 JSON 디렉터리 후보(작업 디렉터리 기준). 있으면 클래스 경로보다 먼저 읽어 IDE 실행에서도 콘텐츠가 보인다. 운영은 클래스 경로만 쓴다
  dirs: ../content, content

behavior:
  # 능력치 0이면 판정마다 이탈 40%, 100이면 0%. 줏대 판정 뒤 용기·인내 판정이 한 번 더 붙어 겹치므로 80%에서 30%로 낮췄다가
  # 너무 안 흔들려 40%로 올렸다 (decisions.md 23·179·184번)
  deviation-cap-bp: 4000
  hint:
    # 안목 0이면 정답률 40%(믿으면 조금 손해), 100이면 95%. 강한 힌트("아주 좋다!")는 안목과 무관하게 50%로 나와
    # 낮은 안목에서는 자신만만한 헛소리가 된다 (decisions.md 28번)
    accuracy-base-bp: 4000
    accuracy-per-point-bp: 55
    neutral-below-insight: 40
    neutral-percent: 30
    strong-percent: 50
  luck:
    # 운 100이면 50% 확률로 운이 따른다: 내릴 뉴스면 손실이 30%로 줄고, 오를 뉴스면 이득이 1.5배 (decisions.md 78번)
    chance-per-point-bp: 50
    loss-factor-percent: 30
    gain-bonus-percent: 150

session:
  # 마지막 접속 후 이만큼 지나면 세션이 만료된다. 접속할 때마다 쿠키도 다시 내려 같이 늘어난다. 앱은 며칠 쉬었다 이어 하는 것이 보통이라
  # 하루에서 30일로 늘렸다 (decisions.md 311번). 계정 연결은 따로 붙인다
  ttl: 30d
  cookie-secure: true
  # 안드로이드 앱이 화면을 앱 안에 담아 다른 출처(https://localhost)에서 부르면 None으로 바꾼다 (decisions.md 306번, docs/app.md)
  cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

api:
  cors:
    # 다른 출처에서 /api를 부르도록 허용할 출처(쉼표로 여럿). 비우면 CORS를 열지 않는다(웹은 같은 출처라 필요 없다).
    # 안드로이드 앱이 화면을 앱 안에 담으면 https://localhost 를 둔다 (decisions.md 306번, docs/app.md)
    origins: ${API_CORS_ORIGINS:}

# 증권사 육성 (증권사 육성 설계). 3분 육성 판은 없앴다: 직원은 회사의 공채 시장에서 뽑는다 (decisions.md 228번)
raising:
  # 아주 작은 회사 (증권사 육성 설계 4·6절, 2단계). (제안) 수치를 구현하며 정한 초기값 (decisions.md 208번~)
  company:
    # 사장의 사재: 회사를 차릴 때(망해서 다시 차릴 때도) 시작 자본 1억 원 (decisions.md 228·247번)
    base-capital: 100000000
    # 한 시대의 길이(해). 세 해마다 다른 시대가 온다 (decisions.md 250번). 회사는 끝나지 않는다(236번)
    turns: 3
    # 회사 등급의 자본 띠: F 0, E 2억, D 6억, C 20억, B 100억 … ZZZ 1천조. 처음 세 띠는 4.5절 표(3억·10억·30억)보다 좁혔다:
    # 첫 이사까지 16년쯤 걸려 초반이 지루했다 (decisions.md 257번)
    grade-capital:
      [0, 120000000, 300000000, 1000000000, 4500000000, 25000000000, 100000000000, 300000000000,
       1000000000000, 3000000000000, 10000000000000, 30000000000000, 100000000000000,
       300000000000000, 1000000000000000]
    # 건물 이사 (decisions.md 296번): 등급은 저절로 오르지 않는다. 자본이 다음 띠 + 이사 비용 이상이면 이사 비용(다음 띠의 percent%)을 내고 올라간다.
    # 자본이 지금 띠 아래로 떨어지면 연말에 저절로 줄어든다
    upgrade:
      percent: 15
      # 돕는 자리는 회사가 이 등급이 되면 열린다 (#393): 처음엔 돈을 굴리는 자리만 보고, 커 가며 하나씩 배운다. 표에 없는 자리는 처음부터 열려 있다
      desk-unlock: { research: E, scout: D, risk: D, hr: B }
    # 자리 수 (decisions.md 281·287번, 359번): 건물이 커질수록 더 많이 앉힌다. F 4 · E 6 · D 10 · C 14 · B 18 · A 22 · S 26 · SS 30 · SSS 34, 그 위는 한 단계마다 +2.
    # 354번에서 셋으로 묶었다가 359번에서 풀었다. 목록이 하나면 모든 등급이 그 수다
    seats: [4, 6, 10, 14, 18, 22, 26, 30, 34]
    # 규모의 벽 (decisions.md 244번): 등급 단계(F = 0)마다 종목 회의 판돈 ×meeting, 데스크에서 잃는 몫 ×miss, 폭락장 손익 ×crash.
    # 전에는 등급마다 수수료·판돈 ×1.5라 B부터 잃는 해가 없고 SSS면 수수료만으로 자본이 두 배가 됐다
    scale:
      # 종목 회의는 수익률이 아니라 판돈에 등급 단계마다 곱한다 (decisions.md 388번): 회의 수익률의 폭(−50% ~ +300%)은 사용자가 정한 것이라 그대로다
      meeting-percent: 77
      miss-percent: 108
      crash-percent: 118
      # 분기 데스크에서 맞혀 버는 몫은 이 벽(F부터 회사 등급마다 %)을 쓴다 (decisions.md 387번, 전에는 0.91 = 옛 gain-percent). 등급 효과가 등급마다 두 배라
      # 벽도 등급마다 거의 절반씩 높다: 0.91^등급 × (1 + 289번의 더 버는 몫) ÷ (1 + 지금의 더 버는 몫)이라 회사 등급과 같은 등급의 직원은 전과 비슷하게
      # 벌고, 한 등급 높은 직원은 두 배 가까이 번다(A·XX는 시뮬레이션으로 조금 올렸다). 종목 회의는 meeting-percent(388번)
      desk-gain-percent:
        [100, 77.3, 61.6, 44.4, 28.5, 17, 8.65, 4.28, 2.07, 0.96, 0.53, 0.2, 0.092, 0.042, 0.019]
    # 수수료 매출 건물의 값의 3%, 판돈은 건물의 값 × stake-percent%. 건물의 값은 지금 건물 등급의 자본 띠(반지하는 base-capital)라 자본을 강화·이사에
    # 써도 버는 양이 줄지 않는다(decisions.md 411번, #567, 전에는 자본 전부 226·244번). 자본이 겹겹이 불지 않는 만큼 100 → 180으로 올려 성장 속도를 맞췄다
    fee-bp: 300
    stake-percent: 180
    decisions: 4
    omen-percent: 75
    false-omen-percent: 15
    # 맞히면 +28%·틀리면 −10%·손이 뒤집히면 −14%(바이오), 단타는 +22%·−8%·−10%. 첫 시대(세 해)에 E(2억)에 닿는 몫은
    # E 직원 31% · C 62% · A 88% · S 98% (decisions.md 226·257번, EconomySimulationTest).
    # 섹터 데스크 (decisions.md 233번): 섹터마다 변동이 다르다. crash-percent는 폭락장의 시장 손익(−5%)에 곱한다.
    # 게임·반도체는 크게 벌고 크게 잃고, 식품·금융은 덜 벌지만 폭락장에 덜 빠진다
    desks:
      semiconductor: { gain-bp: 2700, miss-bp: 1000, flip-bp: 1300, crash-percent: 130 }
      bio: { gain-bp: 2800, miss-bp: 1000, flip-bp: 1400, crash-percent: 100 }
      energy: { gain-bp: 2600, miss-bp: 900, flip-bp: 1200, crash-percent: 100 }
      game: { gain-bp: 2900, miss-bp: 1200, flip-bp: 1500, crash-percent: 100 }
      food: { gain-bp: 1800, miss-bp: 600, flip-bp: 800, crash-percent: 30 }
      finance: { gain-bp: 2000, miss-bp: 700, flip-bp: 900, crash-percent: 50 }
      day: { gain-bp: 2200, miss-bp: 800, flip-bp: 1000, crash-percent: 100 }
    # 지원자의 관심 섹터와 같은 섹터 데스크에 앉으면 맞혔을 때 +2%p
    interest-bonus-bp: 200
    phase-bp: { boom: 300, normal: 0, crash: -500 }
    sway-percent: 50
    # 폭락장에 손이 뒤집히면(못 참고 팔면) 손실이 두 배
    crash-flip-percent: 200
    # 랜드마크 타워 (decisions.md 276·374번): 이 등급(자본 100조 원)으로 이사하면 축하 한 줄과 연표를 남긴다. 엔딩은 없어 회사는 ZZ·ZZZ로 이어 간다
    ending-grade: Z
    # 사람 이야기 (decisions.md 262번): 같은 자리 settle-years 해째부터 손 뒤집힘 settled-flip-percent배. 이직 제안과 이적료는 385번에서 뺐다
    people:
      settle-years: 3
      settled-flip-percent: 80
      # 사기 (decisions.md 270번): 사기 한 칸마다 손 뒤집힘 ±morale-flip-percent%. 연봉·연봉 협상·사표는 뺐다(383번)
      pay:
        morale-flip-percent: 15
    # 능력치 한 띠 = 10점. ZZ 사수가 신입의 가장 높은 능력치를 한 띠 올린다(222번). 직원 등급은 뽑은 그대로 간다(421번):
    # 큰 손실로 떨어지지도, 폭락장을 버티거나 한 해 일해 오르지도 않는다
    experience:
      band: 10
    # X 이상 효과 (2.4절): X 확신은 맞히면 +4%p·틀리면 손실 절반, XXX 역발상은 폭락장에 판단마다 +5%,
    # Z 리더는 같은 자리 팀원의 뒤집힘 확률 절반. XX 경보·ZZ 사수·ZZZ 선견은 수치가 없다
    effects:
      conviction-gain-bp: 400
      conviction-miss-percent: 50
      contrarian-crash-bp: 500
      leader-flip-percent: 50
      # XS 큰손은 맞히면 1.5배, XSS 철벽은 틀려도 절반만 잃고, GOD 신의 손은 회사 모두의 뒤집힘·꼬드김이 절반 (decisions.md 289번)
      big-gain-percent: 150
      wall-miss-percent: 50
      god-flip-percent: 50
    # 멘탈 전투 (decisions.md 328번): 분기마다 결산 직전 한 판. 강화율 = min(30%, 물리친 적 ÷ 6 + 남은 멘탈 ÷ 10, 363번: 한 판이 2분이라 적 수가 줄었다)이 그 분기 돈을 굴리는
    # 직원 모두의 버는 몫을 키우고 뒤집힘을 줄인다. 장르는 시장 갈래를 가중치로만 섞어 뽑아 숨은 값이 새지 않는다(burst는 폭락이 터지는 분기)
    mental:
      kills-per-percent: 6
      mental-per-percent: 10
      max-percent: 30
      max-kills: 300
      max-mental: 150
      genre-weights:
        boom: { ASSAULT: 65, DEFENSE: 35 }
        normal: { ASSAULT: 50, DEFENSE: 50 }
        crash: { ASSAULT: 35, DEFENSE: 65 }
        burst: { ASSAULT: 15, DEFENSE: 85 }
      # 무기 (decisions.md 346번): 종류마다 공격력(%)·연사 간격(ms)·탄 강화 단계(power, 362번)·탄 속도. 등급(F~LR)은 공격력을 damage-percent% 더하고 연사 간격을
      # fire-percent% 줄인다. 무기는 전투에서 떨어지지 않고 무기 뽑기로 얻는다(366번, weapon-gacha)
      weapons:
        pistol: { damage-percent: 100, fire-ms: 260, power: 0, bullet-speed: 720 }
        # 장단점이 극명하게 (decisions.md 430번, #587): 리볼버 한 방·느린 연사, 기관단총 약한 한 발·아주 빠른 연사, 산탄총 센 한 발·느림, 소총 가장 세고 가장 느림
        revolver: { damage-percent: 250, fire-ms: 600, power: 0, bullet-speed: 820 }
        smg: { damage-percent: 50, fire-ms: 80, power: 0, bullet-speed: 700 }
        shotgun: { damage-percent: 220, fire-ms: 700, power: 2, bullet-speed: 640 }
        rifle: { damage-percent: 330, fire-ms: 900, power: 3, bullet-speed: 1100 }
      # 등급 밸런스 (decisions.md 461번, #683): 한 대상에 대한 실효 초당 피해(탄 강화 1+0.4×power, 리볼버 치명타·재장전 포함)가 한 등급에
      # 약 1.75배씩 오른다. F 385 → E 684 → D 1,197 → C 2,062 → B 3,594 → A 6,364 → S 11,091. 종류별 바탕 수치(430번)는 그대로다
      weapon-grades:
        F: { kind: pistol, damage-percent: 0, fire-percent: 0 }
        E: { kind: pistol, damage-percent: 60, fire-percent: 10 }
        D: { kind: revolver, damage-percent: 80, fire-percent: 15 }
        C: { kind: smg, damage-percent: 230, fire-percent: 0 }
        B: { kind: smg, damage-percent: 360, fire-percent: 20 }
        A: { kind: shotgun, damage-percent: 800, fire-percent: 20 }
        S: { kind: rifle, damage-percent: 450, fire-percent: 60 }
        SS: { kind: rifle, damage-percent: 863, fire-percent: 60 }
        SSS: { kind: rifle, damage-percent: 1585, fire-percent: 60 }
        SR: { kind: rifle, damage-percent: 2849, fire-percent: 60 }
        UR: { kind: rifle, damage-percent: 5061, fire-percent: 60 }
        LR: { kind: rifle, damage-percent: 8932, fire-percent: 60 }
      # 무기 뽑기 (decisions.md 366번): 무기 뽑기권 한 장에 한 번. 등급 가중치로 등급을, 종류는 등급에 따라 정한다. 같은 무기(종류+등급)가 merge-count개
      # 모이면 합쳐 한 등급 올린다. 뽑기권은 처음 start-tickets장, 분기 전투를 마칠 때마다 battle-tickets장
      # (스테이지를 처음 깰 때·별·EX 도전 보상은 #493에서 붙는다)
      weapon-gacha:
        # F~A만 뽑는다. 이전 S 몫은 A에 더한다. S~LR은 같은 무기 두 개 합성으로만 획득.
        grade-weights: { F: 450, E: 260, D: 150, C: 80, B: 40, A: 20 }
        start-tickets: 3
        battle-tickets: 1
        merge-count: 2
      # 스테이지 (decisions.md 369번): 번호 스테이지를 골라 전진 모드로 깬다. 한 챕터 per-chapter개, 마지막은 보스. 처음 깨면 자본
      # (스테이지 번호 × capital-per-stage)과 무기 뽑기권 clear-tickets장(보스면 boss-tickets장), 별을 처음 얻을 때마다 star-tickets장.
      # 분기 강화율 = min(max-bonus, 깬 최고 스테이지 × bonus-per-stage). EX 디펜스는 분기에 한 번, 뽑기권 1 + 적 ÷ ex-kills-per-ticket장(최대 ex-max-tickets)
      stages:
        per-chapter: 10
        # 챕터 수 (407번): 챕터 보스를 깨면 다음 챕터가 열린다. 마지막 스테이지는 per-chapter × chapters
        chapters: 5
        capital-per-stage: 1000000
        clear-tickets: 1
        boss-tickets: 3
        star-tickets: 1
        bonus-per-stage: 3
        max-bonus: 30
        ex-kills-per-ticket: 40
        ex-max-tickets: 3
      # 자본으로 사는 전투 강화 (decisions.md 367·394번): 공격력·연사를 단계마다 step-percent%씩, 최대 단계 없이 끝없이. 값은 처음
      # base-price(1b)이고 단계마다 price-growth-percent%씩 오른다(100단계째 약 0.5억, 200단계째 약 25억). 한 요청에 max-batch단계까지 묶어 산다.
      # 멘탈 전투의 바탕 수치(무기 위)에 영구로 붙는다. 고양이 속도 강화는 394번에서 뺐다. 체력(hp)은 최대 멘탈을 단계마다 step-percent%씩 (410번)
      upgrades:
        base-price: 1000000
        price-growth-percent: 4
        max-batch: 100
        # 한 단계의 효과 (492번): 공격력·체력 3%, 연사 2%(100%에서 멈춘다, 487번), 치명타 피해는 치명타 배율 6%
        # 매수벽은 체력(hp)과 공격(buy: 매수 주문의 공격력)을 따로 올린다 (495번)
        step-percent: { damage: 3, fire: 2, hp: 3, buy: 3, crit: 6 }
        max-percent: { fire: 100 }
    # 등급 효과 (decisions.md 289·387번): 종합 등급마다 분기 데스크에서 맞혔을 때 버는 몫에 gain-percent%를 더 얹는다. 등급마다 두 배라
    # F 1.1배 · S 7.4배 · SS 13.8배 · SSS 26.6배를 벌고, SSS 위(X~GOD)도 단계마다 두 배다. 종목 회의 손익에는 붙지 않는다.
    # 높을수록 판단이 정확하다: 손이 뒤집힐 확률(사기·근속과 함께 곱한다)에 flip-percent%를 곱하고, 종목 회의에서 기사를 읽을 때 안목에 read-bonus를 더한다
    # (SSS 위는 SSS 값). 이름 붙은 효과(쌓인다): A 손절은 손이 뒤집혀 잃는 몫이 stop-loss-percent%, S 끌어주기는 같은 데스크 동료가 맞히면
    # pull-gain-percent% 더 벌고, SS 방패는 분기에 잃으면 손실의 shield-percent%를 막고, SSS 전설의 촉은 종목 회의에서 기사를 늘 맞게 읽는다
    perks:
      gain-percent:
        { F: 10, E: 20, D: 40, C: 80, B: 160, A: 320, S: 640, SS: 1280, SSS: 2560, X: 5120, XX: 10240,
          XXX: 20480, Z: 40960, ZZ: 81920, ZZZ: 163840, XS: 327680, XSS: 655360, GOD: 1310720 }
      flip-percent: { F: 100, E: 95, D: 90, C: 85, B: 80, A: 70, S: 60, SS: 50, SSS: 40 }
      read-bonus: { F: 0, E: 2, D: 4, C: 6, B: 8, A: 10, S: 13, SS: 16, SSS: 20 }
      stop-loss-percent: 50
      pull-gain-percent: 50
      shield-percent: 30
    # 인사 직원 (6.3절): 인사팀에 사람이 있으면 뽑기 확률표의 중심이 인사 직원보다 두 단계 아래까지 오르고, 연말에 채용권을 한 장 더 받는다 (decisions.md 312번)
    hr:
      cap-steps: 2
      extra-tickets: 1
    # 뽑은 사람의 능력치 (decisions.md 228·312번). 계약금은 채용 뽑기로 바뀌며 내지 않게 됐고, 그것을 바탕으로 하던 연봉(383번)·이적료(385번)도 빠져 함께 뺐다
    market:
      level-steps: 0
      spread: 15
    # 채용 뽑기 (decisions.md 312번): 공채 시장(지원자를 골라 계약금을 내고 뽑던 것)을 대신한다. 채용권 한 장에 한 명.
    # 채용권 (decisions.md 357번): 회사를 차릴 때 10장, 그 뒤로는 연말에 1장. 분기마다 주던 1장과 연말 2장·업적 3장·이사 3장은 너무 많아 뺐다(업적·이사도 1장).
    # 한 해에 한 명이라 자리에 누구를 앉힐지가 중요해진다. 직원 합성은 384번에서 뺐다.
    gacha:
      start-tickets: 10
      quarter-tickets: 0
      year-tickets: 1
      achievement-tickets: 1
      move-tickets: 1
      max-draws: 10
      # 데리고 있을 수 있는 사람 (354번): 상한이 없다. 화면은 이 값 이상이면 상한을 보이지 않는다(337번의 100명을 뺐다)
      roster-max: 999999
      # 확률표: 회사 등급(인사팀이면 더 높게)보다 steps 단계 위가 percent%. 맨 끝은 특급(전의 특급 인재, 290번)
      rates:
        - { steps: -1, percent: 30, star: false }
        - { steps: 0, percent: 44, star: false }
        - { steps: 1, percent: 18, star: false }
        - { steps: 2, percent: 6, star: false }
        - { steps: 4, percent: 2, star: true }
    # 투자 회의 (decisions.md 229번): 해마다 한 번 단서 기사를 놓고 직원들과 고민한다. 호황이면 오르는 뉴스가 +15%p, 폭락장이면 −10%p.
    # 곁가지 문장은 60% 반대쪽(기사만 읽고 다수결하면 약 64% 맞는다). 제멋대로 할 확률이 20% 이상이면 고집 "보통", 40% 이상이면 "높음"(D 직원이 보통, E 직원이 높음)
    invest:
      year-up-bp: { boom: 1500, normal: 0, crash: -1000 }
      side-opposite-percent: 60
      stubborn-bp: 2000
      # 크게 (decisions.md 260번): 판돈이 두 배, 대신 직원이 사장 말을 안 들을 확률(꼬드김·제 판단)이 1.5배
      big-stake-percent: 200
      # 크게 틀리면 잃는 몫에 한 번 더 곱한다 (#388): 판돈 두 배에 더해 손실은 ×1.5. 그래도 returns.loss-cap-bp(−50%) 아래로는 안 간다(388번)
      big-miss-percent: 150
      big-stubborn-percent: 150
      # 회의 손익 배율 (decisions.md 281번): 종목 회의 한 번의 판돈 = 분기 몫 × 이 비율(%) × scale.meeting-percent^등급. 전에는 100이라 회의가 가벼웠다.
      # 회의 수익률을 넓히며(388번) 300 → 260, 벽은 수익률 대신 판돈에(BalanceSimulationTest·EconomySimulationTest). 411번에서 분기 몫이
      # 1.8배가 되어 145로(분기 몫 × 비율이 전과 같게)
      meeting-stake-percent: 145
      # 종목 회의 수익률 (decisions.md 388번): 데스크의 gain-bp·miss-bp와 떼어 낸 회의만의 수익률. 기사의 크기(magnitude)가 콘텐츠의 가장 작은 폭(4%) ~
      # 가장 큰 폭(35%)에서 어디쯤인지(0~1)로 정한다. 맞히면 gain-min ~ gain-max를 gain-power제곱으로(평범하면 수십 %, 대박이면 +300%), 틀리면
      # loss-min ~ loss-max를 곧게, 크게 틀리면 ×big-miss-percent지만 loss-cap(−50%)에서 멈춘다. 직원 등급 효과(387번)는 붙지 않는다
      returns:
        gain-min-bp: 1500
        gain-max-bp: 30000
        gain-power: 3
        loss-min-bp: 2000
        loss-max-bp: 5000
        loss-cap-bp: 5000
      # 회의 뒤 전투 (decisions.md 414번, #573): 틀린 쪽에 걸었으면 디펜스로 손실을 줄이고(별 0·1·2·3 → 잃은 몫의 100·70·40·0%를 남긴다, 별 3개면
      # 판돈의 defense-gain-percent%를 더 번다), 맞힌 쪽이면 공격 판(매도벽)으로 번 몫을 키운다(별 0·1·2·3 → 추가 0·25·50·100%, 광고 보기 400%는 버튼만 있다). 건너뛰면 그대로
      battle:
        defense-keep-percent: [100, 70, 40, 0]
        defense-gain-percent: 10
        assault-percent: [100, 125, 150, 200]
      # 기사가 얼마나 또렷한가 (decisions.md 241번): 흐릴수록 읽을 때 안목을 깎아 안목 높은 직원끼리도 의견이 갈린다
      clarity:
        - { code: clear, weight: 35, penalty: 0 }
        - { code: murky, weight: 40, penalty: 25 }
        - { code: foggy, weight: 25, penalty: 55 }
    # 종목 발굴 (decisions.md 267번): 종목 회의는 직원이 종목을 물어 올 때만 열린다. 분기 넘기기를 누르면 물어 온다(382번). 종목 발굴팀은 40% + 안목의 절반(안목 100이면 90%),
    # 섹터 데스크 직원은 15%. 가져온 사람의 안목이 50보다 높을수록 오르는 종목(안목 1점에 +0.3%p), 70 이상이면 또렷한 기사, 40 아래면 소문
    scout:
      base-percent: 40
      insight-percent: 50
      desk-percent: 15
      up-per-insight-bp: 30
      clear-insight: 70
      murky-insight: 40
    # 매각과 재창업 (9절, decisions.md 215번~). 매각을 뺀 뒤(236번)로는 API가 부르지 않는다: 다시 붙일 때를 위해 엔진 규칙과 수치만 남겼다 (264번).
    # 시작 자본은 raising.company.base-capital로 옮겼다
    sale:
      min-grade: SSS
      # 판 회사의 등급 단계 + 1점(F 1점 … SSS 9점), 명성 한 단계에 2점
      fame-per-step: 2
      voluntary-bonus: 1
      # 공동창업자: 처음 1명, 명성 3단계마다 +1, 4명까지
      cofounder-base: 1
      cofounder-fame-steps: 3
      cofounder-max: 4
      # 재창업한 회사의 시작 자본: base-capital에 명성 한 단계마다 +10%
      fame-capital-percent: 10
