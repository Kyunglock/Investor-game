spring:
  application:
    name: investor-game
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/investor}
    username: ${DB_USER:investor}
    password: ${DB_PASSWORD:investor}
  flyway:
    # 에이전트들이 병렬로 추가한 마이그레이션의 병합 순서가 번호 순서와 어긋날 수 있다. 운영은 끈다 (db.md 6절).
    out-of-order: true

management:
  endpoints:
    web:
      exposure:
        include: health

# 관리자 플레이 기록(/api/admin/plays)을 여는 토큰. 비워 두면 관리자 API는 꺼진다 (decisions.md 46번)
admin:
  token: ${ADMIN_TOKEN:}

content:
  # 콘텐츠 JSON 디렉터리 후보(작업 디렉터리 기준). 있으면 클래스 경로보다 먼저 읽어 IDE 실행에서도 콘텐츠가 보인다. 운영은 클래스 경로만 쓴다
  dirs: ../content, content
  # 육성 카드의 선택지가 능력치를 움직이는 최대 폭 (decisions.md 23번)
  trait-stat-max-delta: 8

behavior:
  # 능력치 0이면 판정마다 이탈 40%, 100이면 0%. 줏대 판정 뒤 용기·인내 판정이 한 번 더 붙어 겹치므로 80%에서 30%로 낮췄다가
  # 너무 안 흔들려 40%로 올렸다 (decisions.md 23·179·184번)
  deviation-cap-bp: 4000
  hint:
    # 안목 0이면 정답률 40%(믿으면 조금 손해), 100이면 95%. 강한 힌트("아주 좋다!")는 안목과 무관하게 50%로 나와
    # 낮은 안목에서는 자신만만한 헛소리가 된다 (decisions.md 28번)
    accuracy-base-bp: 4000
    accuracy-per-point-bp: 55
    neutral-below-insight: 40
    neutral-percent: 30
    strong-percent: 50
  luck:
    # 운 100이면 50% 확률로 운이 따른다: 내릴 뉴스면 손실이 30%로 줄고, 오를 뉴스면 이득이 1.5배 (decisions.md 78번)
    chance-per-point-bp: 50
    loss-factor-percent: 30
    gain-bonus-percent: 150

session:
  ttl: 1d
  cookie-secure: true

# 3분 육성 한 판 (증권사 육성 설계 3절, 투자 원칙 장치 설계). (제안)으로 적힌 값을 구현하며 정한 초기값 (decisions.md 197번~)
raising:
  # 운용금. 회사가 열리기 전에는 판마다 사장의 사재 1억 원 (6.5절)
  fund: 100000000
  # 성향 2 → 실전 매매 7(원칙·풀기 카드는 뉴스 자리를 대신한다) + 돈이 걸린 큰일 2 → 입사 심사 1 = 12장 (3.1절)
  deck: [TRAIT_STYLE, TRAIT_SECTOR, NEWS, NEWS, NEWS, BIG, NEWS, NEWS, LEVERAGE, NEWS, NEWS, EXAM]
  # 조금/크게가 열리기 전의 "산다"는 지금처럼 30%. 열린 뒤 조금 15%, 크게 50% (3.2절)
  buy-ratio-bp: 3000
  small-ratio-bp: 1500
  big-ratio-bp: 5000
  # 뉴스 한 장을 복기할 때마다 안목 경험치 3. 두 장이면 안목 +1이라 첫 판 세 번째 뉴스에 형광펜이 열린다 (11.1·11.2절)
  review-insight-exp: 3
  # 손이 뒤집히면 그 능력치에 경험치 5 = +1 (character.growth와 같다)
  deviation-exp: 5
  exp-per-point: 5
  max-stat: 100
  min-stat: 1
  initial-stat:
    floor: 10
    grade-percent: { SSS: 1, SS: 3, S: 5, A: 10, B: 16, C: 25, D: 20, E: 12, F: 8 }
  # 처음 온 사람의 짜인 첫 판 (11.2절): 쉬운 기사 → 손이 뒤집힘 → 형광펜이 틀리고 기사가 맞음
  scripted:
    stats: { insight: 28, patience: 45, courage: 22, conviction: 50, luck: 40 }
    news:
      - { news: semi-contract, stock: ssj, up: true, mode: EASY }
      - { news: food-launch, stock: nsm, up: true, mode: FLIP }
      - { news: bio-trial, stock: ctl, up: false, mode: MISLEAD }
  # 곁가지 문장이 숨은 방향의 반대쪽일 확률. 기사만 읽고 다수결하면 약 64% 맞는다 (3.1절)
  side-opposite-percent: 60
  # 카드 한 장(한 분기) 동안 저절로 흔들리는 폭(±). 뉴스 충격(6~30%)보다 작게
  noise-bp: { low: 200, mid: 400, high: 600 }
  spillover-percent: 30
  # 공채 육성은 회사의 올해 시장에서 한다 (6.2절): 호황이면 뉴스가 오를 확률 +15%p, 폭락장이면 −10%p
  year-up-bp: { boom: 1500, normal: 0, crash: -1000 }
  crisis:
    chance-percent: 35
    silent-percent: 25
    from-card: 6
    omen-cards: 2
    fall-bp: { min: 2000, max: 3500 }
  leverage:
    min-drop-bp: 500
    loan-bp: 5000
    interest-bp: 500
  principle:
    flips: 2
    per-run: 1
    max-devices: 2
    release-at: 70
  # 아주 작은 회사 (증권사 육성 설계 4·6절, 2단계). (제안) 수치를 구현하며 정한 초기값 (decisions.md 208번~)
  company:
    # 2단계는 세 해로 끝나는 체험판
    turns: 3
    # 회사 등급의 자본 띠: F 0, E 3억, D 10억 … ZZZ 1천조 (4.5절 표 그대로)
    grade-capital:
      [0, 300000000, 1000000000, 3000000000, 10000000000, 30000000000, 100000000000, 300000000000,
       1000000000000, 3000000000000, 10000000000000, 30000000000000, 100000000000000,
       300000000000000, 1000000000000000]
    # 자리 수: F 2 … SSS 10, 그 위는 한 단계마다 +1 (4.5절 표 그대로)
    seats: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    # 등급 한 단계마다 수수료 매출과 판돈 ×1.5. 자본 띠가 ×3이라 등급이 저절로 치솟지 않는다
    multiplier-percent: 150
    # 수수료 매출 자본의 3%, 판돈은 자본 전부(× 배율, 자본을 넘지 않음). 경제 맞춤 (decisions.md 226번, EconomySimulationTest)
    fee-bp: 300
    stake-percent: 100
    # 공채 육성의 운용금: 자본의 10%, 10억 원까지 (6.5절)
    recruit-percent: 10
    recruit-max: 1000000000
    decisions: 4
    omen-percent: 75
    false-omen-percent: 15
    # 맞히면 +28%·틀리면 −10%·손이 뒤집히면 −14%(바이오), 단타는 +22%·−8%·−10%. C 직원 둘이면 한 시대(세 해)에 자본이 1.5~2배,
    # A 직원이면 셋에 하나쯤 E(3억)에 닿는다 (decisions.md 226번)
    desks:
      bio: { gain-bp: 2800, miss-bp: 1000, flip-bp: 1400 }
      day: { gain-bp: 2200, miss-bp: 800, flip-bp: 1000 }
    phase-bp: { boom: 300, normal: 0, crash: -500 }
    sway-percent: 50
    # 폭락장에 손이 뒤집히면(못 참고 팔면) 손실이 두 배
    crash-flip-percent: 200
    # 실전 경험과 큰 손실 (2.3·6.4절): 한 해에 판돈의 30% 이상 잃으면 한 단계 하락(능력치는 한 띠 = 10점),
    # 폭락장을 손실 없이 버티면 실전 경험 +1. SSS에서 X까지 1, XX까지 2 … 단계마다 1씩 더 든다
    experience:
      drop-loss-percent: 30
      band: 10
      need-base: 1
    # X 이상 효과 (2.4절): X 확신은 맞히면 +4%p·틀리면 손실 절반, XXX 역발상은 폭락장에 판단마다 +5%,
    # Z 리더는 같은 자리 팀원의 뒤집힘 확률 절반. XX 경보·ZZ 사수·ZZZ 선견은 수치가 없다
    effects:
      conviction-gain-bp: 400
      conviction-miss-percent: 50
      contrarian-crash-bp: 500
      leader-flip-percent: 50
    # 인사 직원 (6.3절): 인사팀에 앉으면 공채를 맡는다. 신입은 인사 직원 종합 등급보다 두 단계 아래까지,
    # 회사 자본을 가져오지 않는 대신 연봉 3천만 원이 결산마다 나간다
    hr:
      cap-steps: 2
      salary: 30000000
    # 매각과 재창업 (9절, 4단계). 한 해 시장 갈래의 가중치는 시대(content/raising.json의 eras)가 정한다.
    # 시대(turns 해)가 끝나면 반드시 팔고, 그 전에는 SSS 이상이면 스스로 팔 수 있다 (decisions.md 215번~)
    sale:
      min-grade: SSS
      # 판 회사의 등급 단계 + 1점(F 1점 … SSS 9점), 명성 한 단계에 2점
      fame-per-step: 2
      voluntary-bonus: 1
      # 공동창업자: 처음 1명, 명성 3단계마다 +1, 4명까지
      cofounder-base: 1
      cofounder-fame-steps: 3
      cofounder-max: 4
      # 새 회사 시작 자본 1억 원, 명성 한 단계마다 +10%
      base-capital: 100000000
      fame-capital-percent: 10
