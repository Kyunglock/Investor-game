<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ffbb50" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preload" as="image" href="/src/app/assets/loading-squad.png" fetchpriority="high" />
    <link rel="stylesheet" href="/src/app/loading-screen.css" />
    <title>매도벽 돌파냥</title>
  </head>
  <body>
    <!-- 로딩 화면 (decisions.md 517번): 스크립트가 내려오는 동안 보이고, 앱이 그리면 LoadingScreen으로 바뀐다. -->
    <div id="root">
      <div class="loading-screen" role="status" aria-label="게임을 준비하는 중">
        <div class="loading-screen-body">
          <h1 class="loading-screen-title">매도벽 돌파냥</h1>
          <div class="loading-screen-hero" aria-hidden="true">
            <img src="/src/app/assets/loading-squad.png" alt="" fetchpriority="high" />
          </div>
          <div class="loading-screen-footer">
            <p class="loading-screen-message">게임을 준비하는 중…</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
